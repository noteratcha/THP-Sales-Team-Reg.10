<!-- 🗂️ PAGE: ไฟล์สัญญา (เมนูย่อยใต้ สัญญาขนส่ง — ผู้ใช้ขอ 2026-11-20)
     admin เห็นทุกไฟล์ / ที่ทำการจังหวัด (33000 34000 35000 37000 47000 48000 49000) เห็นทั้งจังหวัด / ที่ทำการอื่นเห็นเฉพาะของตน
     หลังบ้านตรวจสิทธิ์จาก session (listContractFiles / getContractFileData) — ไฟล์ใน Drive ไม่แชร์ให้ผู้ใช้ -->
<div class="bg-white custom-radius shadow-xl w-full max-w-[1200px] mx-auto mt-4 mb-8 p-4 md:p-6">
    <div class="cf-top">
        <p id="cfScope" class="cf-scope">ไฟล์สัญญาที่สร้างจากระบบ</p>
        <button type="button" id="cfReload" class="cf-btn-2" onclick="thpCfLoad(true)"><i class="fas fa-sync-alt"></i> โหลดใหม่</button>
    </div>
    <div class="cf-filters">
        <div class="cf-search">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input id="cfSearch" type="search" autocomplete="off" placeholder="ค้นหาชื่อลูกค้า" aria-label="ค้นหาไฟล์สัญญาตามชื่อลูกค้า" oninput="thpCfRender()">
        </div>
        <select id="cfOffice" class="cf-select hidden" onchange="thpCfRender()" aria-label="กรองตามที่ทำการ"></select>
        <div id="cfTotal" class="cf-total" aria-live="polite"></div>
    </div>
    <div id="cfList" class="cf-list"></div>
</div>

<style>
    #page-contract-files .cf-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    #page-contract-files .cf-scope { font-size: 14px; color: #4b5563; margin: 0; }
    #page-contract-files .cf-scope b { color: #c2410c; }
    #page-contract-files .cf-btn-2 { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #c2410c; background: #fff; border: 1px solid #fdba74; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
    #page-contract-files .cf-btn-2:disabled { opacity: .6; cursor: wait; }
    #page-contract-files .cf-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 14px 0; }
    #page-contract-files .cf-search { position: relative; flex: 1 1 260px; min-width: 0; }
    #page-contract-files .cf-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 13px; }
    #page-contract-files .cf-search input { width: 100%; height: 40px; border: 1px solid #d1d5db; border-radius: 10px; padding: 0 12px 0 34px; font-size: 14px; }
    #page-contract-files .cf-search input:focus, #page-contract-files .cf-select:focus { outline: none; border-color: #EA580C; box-shadow: 0 0 0 3px rgba(234, 88, 12, .15); }
    #page-contract-files .cf-select { height: 40px; border: 1px solid #d1d5db; border-radius: 10px; padding: 0 30px 0 12px; font-size: 14px; background: #fff; flex: 0 1 300px; min-width: 0; }
    #page-contract-files .cf-select.hidden { display: none; }
    #page-contract-files .cf-total { font-size: 13px; color: #6b7280; margin-left: auto; white-space: nowrap; }
    #page-contract-files .cf-total b { font-size: 18px; color: #c2410c; font-weight: 800; }
    #page-contract-files .cf-list { display: flex; flex-direction: column; gap: 14px; }
    #page-contract-files .cf-prov { border: 1px solid #fed7aa; border-radius: 16px; background: #fff; overflow: hidden; }
    #page-contract-files .cf-prov-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; list-style: none; font-size: 15px; font-weight: 800; color: #7c2d12; background: #ffedd5; user-select: none; }
    #page-contract-files .cf-prov-h::-webkit-details-marker { display: none; }
    #page-contract-files .cf-prov-h:hover { background: #fed7aa; }
    #page-contract-files .cf-prov-h:focus-visible { outline: 2px solid #c2410c; outline-offset: -2px; }
    #page-contract-files .cf-prov-h small { margin-left: auto; font-size: 12px; font-weight: 600; color: #9a3412; }
    #page-contract-files .cf-chev { font-size: 11px; transition: transform .2s; }
    #page-contract-files .cf-prov[open] > .cf-prov-h .cf-chev { transform: rotate(90deg); }
    #page-contract-files .cf-prov-body { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
    #page-contract-files .cf-group { border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; background: #fff; }
    #page-contract-files summary.cf-group-h { cursor: pointer; list-style: none; user-select: none; }
    #page-contract-files summary.cf-group-h::-webkit-details-marker { display: none; }
    #page-contract-files summary.cf-group-h:hover { background: #fff1e6; }
    #page-contract-files summary.cf-group-h:focus-visible { outline: 2px solid #c2410c; outline-offset: -2px; }
    #page-contract-files .cf-group:not([open]) > .cf-group-h { border-bottom: 0; }
    #page-contract-files .cf-group[open] > .cf-group-h .cf-chev { transform: rotate(90deg); }
    #page-contract-files .cf-group-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #fffaf5; border-bottom: 1px solid #fde6cf; font-size: 14px; font-weight: 700; color: #9a3412; }
    #page-contract-files .cf-group-h small { margin-left: auto; font-weight: 600; color: #6b7280; }
    #page-contract-files .cf-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid #f3f4f6; }
    #page-contract-files .cf-row:first-of-type { border-top: 0; }
    #page-contract-files .cf-row:hover { background: #fafafa; }
    #page-contract-files .cf-ic { color: #dc2626; font-size: 18px; flex-shrink: 0; }
    #page-contract-files .cf-name { flex: 1; min-width: 0; }
    #page-contract-files .cf-name b { display: block; font-size: 14px; color: #111827; font-weight: 600; overflow-wrap: anywhere; }
    #page-contract-files .cf-name small { font-size: 12px; color: #9ca3af; }
    #page-contract-files .cf-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 2px; }
    #page-contract-files .cf-hist { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #4b5563; }
    #page-contract-files .cf-hist i { font-size: 11px; color: #c2410c; width: 12px; text-align: center; }
    #page-contract-files .cf-hist em { font-style: normal; color: #9ca3af; }
    #page-contract-files .cf-hist.none { color: #9ca3af; }
    #page-contract-files .cf-hist.none i { color: #d1d5db; }
    #page-contract-files .cf-act { display: flex; gap: 6px; flex-shrink: 0; }
    #page-contract-files .cf-act button { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 8px; padding: 5px 10px; cursor: pointer; border: 1px solid #e5e7eb; background: #fff; color: #374151; }
    #page-contract-files .cf-act button.cf-view { background: #c2410c; border-color: #c2410c; color: #fff; }
    #page-contract-files .cf-act button:disabled { opacity: .6; cursor: wait; }
    #page-contract-files .cf-act button:focus-visible, #page-contract-files .cf-btn-2:focus-visible { outline: 2px solid #c2410c; outline-offset: 2px; }
    #page-contract-files .cf-empty { font-size: 14px; color: #6b7280; padding: 24px 14px; border: 1px dashed #d1d5db; border-radius: 12px; text-align: center; }
    #page-contract-files .cf-skel { height: 52px; border-radius: 12px; background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 37%, #f3f4f6 63%); background-size: 400% 100%; animation: cfShimmer 1.4s ease infinite; }
    @keyframes cfShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    @media (max-width: 640px) {
        #page-contract-files .cf-total { margin-left: 0; }
        #page-contract-files .cf-row { flex-wrap: wrap; }
        #page-contract-files .cf-act { width: 100%; justify-content: flex-end; }
    }
</style>

<script>
    ;(function () {
        var esc = function (s) { return window.escapeHtml ? window.escapeHtml(String(s)) : String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var who = function () { try { return String((currentUserInfo || {}).user || ''); } catch (e) { return ''; } };
        var st = { list: null, forUser: null, seq: 0, meta: null };
        var fmt = function (n) { return Number(n).toLocaleString('th-TH'); };
        var show = function (name) { return String(name || '').replace(/^(\d{5}_)?สัญญาขนส่ง_/, '').replace(/\.pdf$/i, ''); };
        var thDate = function (s) {
            var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(s || ''); if (!m) return s || '';
            var mo = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return Number(m[3]) + ' ' + mo[Number(m[2]) - 1] + ' ' + (Number(m[1]) + 543) + ' ' + m[4] + ' น.';
        };

        window.thpCfClear = function () {
            st.list = null; st.forUser = null; st.meta = null; st.seq++;
            var l = document.getElementById('cfList'); if (l) l.innerHTML = '';
            var s = document.getElementById('cfSearch'); if (s) s.value = '';
        };
        // เข้าหน้าใหม่ทุกครั้ง = พับทุกจังหวัด/ที่ทำการ
        window.loadContractFilesPage = function () { st.openProv = null; st.openOffice = null; window.thpCfLoad(false); };
        window.thpCfLoad = function (force) {
            var u = who();
            if (!force && st.list && st.forUser === u) { window.thpCfRender(); return; }
            if (st.forUser !== u) { window.thpCfClear(); }
            st.forUser = u;
            var seq = ++st.seq, list = document.getElementById('cfList'), btn = document.getElementById('cfReload');
            if (list) list.innerHTML = '<div class="cf-skel"></div><div class="cf-skel"></div><div class="cf-skel"></div>';
            if (btn) btn.disabled = true;
            google.script.run.withSuccessHandler(function (res) {
                if (seq !== st.seq || who() !== u) return;
                if (btn) btn.disabled = false;
                if (!(res && res.status === 'success')) { if (list) list.innerHTML = '<div class="cf-empty">' + esc((res && res.message) || 'โหลดรายการไฟล์ไม่สำเร็จ') + '</div>'; return; }
                st.list = res.data || []; st.meta = res;
                // ชื่อโฟลเดอร์เดิมของรหัสขึ้นต้นด้วย 0 อาจมี "ปณ." นำหน้า → ไม่แสดง (ผู้ใช้กำหนด 2026-11-20)
                st.list.forEach(function (f) { if (String(f.zip || '').charAt(0) === '0') f.office = String(f.office || '').replace(/^ปณ\.\s*/, ''); });
                var sc = document.getElementById('cfScope');
                if (sc) sc.innerHTML = res.scope === 'all' ? 'ไฟล์สัญญา<b>ทุกที่ทำการ</b> (ผู้ดูแลระบบ)' : res.scope === 'province' ? 'ไฟล์สัญญาของที่ทำการใน<b>จังหวัด' + esc(res.prov) + '</b>' : 'ไฟล์สัญญาของที่ทำการ <b>' + esc(res.zip) + '</b>';
                // ตัวกรองที่ทำการ (มีมากกว่า 1 ที่ทำการ)
                var offices = {}, order = [];
                st.list.forEach(function (f) { var k = f.office; if (!offices[k]) { offices[k] = 0; order.push(k); } offices[k]++; });
                var sel = document.getElementById('cfOffice');
                if (sel) {
                    sel.innerHTML = '<option value="">ทุกที่ทำการ (' + fmt(order.length) + ' แห่ง)</option>' + order.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + ' · ' + fmt(offices[k]) + ' ไฟล์</option>'; }).join('');
                    sel.classList.toggle('hidden', order.length < 2);
                }
                window.thpCfRender();
            }).withFailureHandler(function (err) {
                if (seq !== st.seq) return;
                if (btn) btn.disabled = false;
                if (list) list.innerHTML = '<div class="cf-empty">โหลดรายการไฟล์ไม่สำเร็จ: ' + esc(err && err.message ? err.message : err) + '</div>';
            }).listContractFiles(currentUserInfo);
        };
        window.thpCfRender = function () {
            var list = document.getElementById('cfList'), tot = document.getElementById('cfTotal'); if (!list || !st.list) return;
            var q = String((document.getElementById('cfSearch') || {}).value || '').trim().toLowerCase();
            var off = String((document.getElementById('cfOffice') || {}).value || '');
            var hits = st.list.filter(function (f) { return (!off || f.office === off) && (!q || show(f.name).toLowerCase().indexOf(q) !== -1); });
            if (tot) tot.innerHTML = (q || off ? 'พบ ' : 'ทั้งหมด ') + '<b>' + fmt(hits.length) + '</b> ไฟล์' + (q || off ? ' จาก ' + fmt(st.list.length) : '');
            if (!hits.length) { list.innerHTML = '<div class="cf-empty">' + (st.list.length ? 'ไม่พบไฟล์ที่ตรงกับการค้นหา' : 'ยังไม่มีไฟล์สัญญา') + '</div>'; return; }
            // จัดกลุ่ม จังหวัด › ที่ทำการ — จังหวัดเป็นแบบพับได้ เปิดจังหวัดหนึ่งแล้วจังหวัดอื่นพับเอง (ผู้ใช้ขอ 2026-11-20)
            // ค้นหาอยู่ = เปิดทุกจังหวัดที่พบ; ไม่ค้นหา = เปิดจังหวัดที่เปิดไว้ล่าสุด (ครั้งแรก = จังหวัดแรก)
            var provs = {}, pOrder = [];
            hits.forEach(function (f) {
                var p = f.prov || 'ไม่ระบุจังหวัด';
                if (!provs[p]) { provs[p] = { n: 0, offices: {}, oOrder: [] }; pOrder.push(p); }
                var P = provs[p]; P.n++;
                if (!P.offices[f.office]) { P.offices[f.office] = []; P.oOrder.push(f.office); }
                P.offices[f.office].push(f);
            });
            // ลำดับจังหวัดตามที่ผู้ใช้กำหนด (2026-11-20) — จังหวัดอื่น/ไม่ระบุ ต่อท้าย
            var PROV_ORDER = ['ศรีสะเกษ', 'อุบลราชธานี', 'ยโสธร', 'อำนาจเจริญ', 'นครพนม', 'สกลนคร', 'มุกดาหาร'];
            var provRank = function (p) {
                var name = String(p).replace(/^จังหวัด\s*|^จ\.\s*/, '').trim();
                var i = PROV_ORDER.indexOf(name);
                return i === -1 ? PROV_ORDER.length : i;
            };
            pOrder.sort(function (a, b) { return provRank(a) - provRank(b) || String(a).localeCompare(String(b), 'th'); });
            // ค่าเริ่มต้นพับทั้งหมด (ผู้ใช้ขอ 2026-11-20) — เปิดเฉพาะที่ผู้ใช้กดเปิดไว้ในรอบนี้
            var openAll = !!q;
            // ประวัติล่าสุด (ผู้ใช้ขอ 2026-11-20): เปิดดู / ดาวน์โหลด — วันเวลา + ผู้ใช้
            var hist = function (e, icon, label) {
                return '<span class="cf-hist' + (e ? '' : ' none') + '"><i class="fas ' + icon + '"></i>' + label + (e ? ' ' + esc(thDate(e.at)) + (e.by ? ' <em>(' + esc(e.by) + ')</em>' : '') : ' ยังไม่มี') + '</span>';
            };
            var row = function (f) {
                return '<div class="cf-row"><i class="fas fa-file-pdf cf-ic" aria-hidden="true"></i><div class="cf-name"><b>' + esc(show(f.name)) + '</b>' +
                    '<div class="cf-meta"><span class="cf-hist"><i class="fas fa-clock"></i>สร้าง/อัปเดต ' + esc(thDate(f.at)) + '</span>' + hist(f.view, 'fa-eye', 'เปิดดูล่าสุด') + hist(f.dl, 'fa-download', 'ดาวน์โหลดล่าสุด') + '</div></div>' +
                    '<div class="cf-act"><button type="button" class="cf-view" data-id="' + esc(f.id) + '" onclick="thpCfOpen(this, false)"><i class="fas fa-eye"></i>เปิดดู</button>' +
                    '<button type="button" data-id="' + esc(f.id) + '" onclick="thpCfOpen(this, true)"><i class="fas fa-download"></i>ดาวน์โหลด</button></div></div>';
            };
            list.innerHTML = pOrder.map(function (p) {
                var P = provs[p], open = openAll || p === st.openProv;
                return '<details class="cf-prov" data-prov="' + esc(p) + '"' + (open ? ' open' : '') + '><summary class="cf-prov-h"><i class="fas fa-chevron-right cf-chev" aria-hidden="true"></i><i class="fas fa-map-marker-alt"></i>จังหวัด' + esc(p) +
                    '<small>' + fmt(P.oOrder.length) + ' ที่ทำการ · ' + fmt(P.n) + ' ไฟล์</small></summary><div class="cf-prov-body">' +
                    P.oOrder.map(function (k) {
                        // ที่ทำการพับได้เช่นกัน: เปิดทีละ 1 ที่ทำการ (ผู้ใช้ขอ 2026-11-20); ค้นหา/กรองที่ทำการ = เปิดทั้งหมดที่พบ; จังหวัดมีที่ทำการเดียว = เปิดเลย
                        var g = P.offices[k], oOpen = openAll || !!off || P.oOrder.length === 1 || st.openOffice === k;
                        return '<details class="cf-group" data-office="' + esc(k) + '"' + (oOpen ? ' open' : '') + '><summary class="cf-group-h"><i class="fas fa-chevron-right cf-chev" aria-hidden="true"></i><i class="fas fa-folder"></i>' + esc(k) + '<small>' + fmt(g.length) + ' ไฟล์</small></summary>' + g.map(row).join('') + '</details>';
                    }).join('') + '</div></details>';
            }).join('');
            // accordion: เปิดอันหนึ่ง อันอื่นระดับเดียวกันพับเอง
            var accordion = function (sel, key) {
                list.querySelectorAll(sel).forEach(function (d) {
                    d.addEventListener('toggle', function () {
                        if (!d.open || openAll || (key === 'openOffice' && off)) return;
                        st[key] = d.getAttribute(key === 'openProv' ? 'data-prov' : 'data-office');
                        var scope = key === 'openProv' ? list : d.parentNode;
                        scope.querySelectorAll(':scope > ' + sel + '[open]').forEach(function (o) { if (o !== d) o.open = false; });
                        setTimeout(function () { d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 0);
                    });
                });
            };
            accordion('details.cf-prov', 'openProv');
            accordion('details.cf-group', 'openOffice');
        };
        // เปิดดู: เปิดแท็บก่อน (กันเบราว์เซอร์บล็อกป๊อปอัป) แล้วใส่ไฟล์เมื่อโหลดเสร็จ
        window.thpCfOpen = function (btn, dl) {
            var id = btn.getAttribute('data-id'); if (!id) return;
            var w = dl ? null : window.open('', '_blank');
            if (w) { try { w.document.title = 'กำลังเปิดไฟล์สัญญา...'; w.document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;color:#6b7280">กำลังเปิดไฟล์สัญญา...</p>'; } catch (e) { } }
            btn.disabled = true;
            google.script.run.withSuccessHandler(function (res) {
                btn.disabled = false;
                if (!(res && res.status === 'success')) { if (w) w.close(); Swal.fire('เปิดไฟล์ไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                var bin = atob(res.data), u8 = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                // อัปเดตประวัติล่าสุดในรายการทันที (คงจังหวัดที่เปิดอยู่)
                if (res.log && st.list) { st.list.forEach(function (f) { if (f.id === id) f[res.log.kind] = { at: res.log.at, by: res.log.by }; }); window.thpCfRender(); }
                var url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
                if (dl || !w) {
                    var a = document.createElement('a'); a.href = url; a.download = res.name || 'สัญญา.pdf';
                    document.body.appendChild(a); a.click(); a.remove();
                } else w.location.href = url;
                setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
            }).withFailureHandler(function (err) {
                btn.disabled = false; if (w) w.close();
                Swal.fire('เปิดไฟล์ไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
            }).getContractFileData({ id: id, mode: dl ? 'download' : 'view' }, currentUserInfo);
        };
    })();
</script>
