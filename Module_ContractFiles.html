<script>
    ;(function () {
        var esc = function (s) { return window.escapeHtml ? window.escapeHtml(String(s)) : String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var who = function () { try { return String((currentUserInfo || {}).user || ''); } catch (e) { return ''; } };
        var st = { list: null, forUser: null, seq: 0, meta: null };
        var fmt = function (n) { return Number(n).toLocaleString('th-TH'); };
        var show = function (name) { return String(name || '').replace(/^(\d{5}_)?สัญญาขนส่ง_/, '').replace(/\.pdf$/i, ''); };
        var thDate = function (s) {
            var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(s || ''); if (!m) return s || '';
            var mo = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return Number(m[3]) + ' ' + mo[Number(m[2]) - 1] + ' ' + (Number(m[1]) + 543) + ' ' + m[4] + ' น.';
        };

        window.thpCfStatus = function (k) { st.status = st.status === k ? '' : k; window.thpCfRender(); };
        window.thpCfClear = function () {
            st.list = null; st.forUser = null; st.meta = null; st.seq++;
            var l = document.getElementById('cfList'); if (l) l.innerHTML = '';
            var rn = document.getElementById('cfRenew'); if (rn) rn.innerHTML = '';
            var s = document.getElementById('cfSearch'); if (s) s.value = '';
        };
        // เข้าหน้าใหม่ทุกครั้ง = พับทุกจังหวัด/ที่ทำการ
        window.loadContractFilesPage = function () { st.openProv = null; st.openOffice = null; window.thpCfLoad(false); };
        window.thpCfLoad = function (force) {
            var u = who();
            if (!force && st.list && st.forUser === u) { window.thpCfRender(); return; }
            if (st.forUser !== u) { window.thpCfClear(); }
            st.forUser = u;
            var seq = ++st.seq, list = document.getElementById('cfList'), btn = document.getElementById('cfReload');
            if (list) list.innerHTML = '<div class="cf-skel"></div><div class="cf-skel"></div><div class="cf-skel"></div>';
            if (btn) btn.disabled = true;
            google.script.run.withSuccessHandler(function (res) {
                if (seq !== st.seq || who() !== u) return;
                if (btn) btn.disabled = false;
                if (!(res && res.status === 'success')) { if (list) list.innerHTML = '<div class="cf-empty">' + esc((res && res.message) || 'โหลดรายการไฟล์ไม่สำเร็จ') + '</div>'; return; }
                st.list = res.data || []; st.meta = res;
                // ชื่อโฟลเดอร์เดิมของรหัสขึ้นต้นด้วย 0 อาจมี "ปณ." นำหน้า → ไม่แสดง (ผู้ใช้กำหนด 2026-11-20)
                st.list.forEach(function (f) { if (String(f.zip || '').charAt(0) === '0') f.office = String(f.office || '').replace(/^ปณ\.\s*/, ''); });
                var sc = document.getElementById('cfScope');
                if (sc) sc.innerHTML = res.scope === 'all' ? 'ไฟล์สัญญา<b>ทุกที่ทำการ</b> (ผู้ดูแลระบบ)' : res.scope === 'province' ? 'ไฟล์สัญญาของที่ทำการใน<b>จังหวัด' + esc(res.prov) + '</b>' : 'ไฟล์สัญญาของที่ทำการ <b>' + esc(res.zip) + '</b>';
                // ตัวกรองที่ทำการ (มีมากกว่า 1 ที่ทำการ)
                var offices = {}, order = [];
                st.list.forEach(function (f) { var k = f.office; if (!offices[k]) { offices[k] = 0; order.push(k); } offices[k]++; });
                var sel = document.getElementById('cfOffice');
                if (sel) {
                    sel.innerHTML = '<option value="">ทุกที่ทำการ (' + fmt(order.length) + ' แห่ง)</option>' + order.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + ' · ' + fmt(offices[k]) + ' ไฟล์</option>'; }).join('');
                    sel.classList.toggle('hidden', order.length < 2);
                }
                window.thpCfRender();
            }).withFailureHandler(function (err) {
                if (seq !== st.seq) return;
                if (btn) btn.disabled = false;
                if (list) list.innerHTML = '<div class="cf-empty">โหลดรายการไฟล์ไม่สำเร็จ: ' + esc(err && err.message ? err.message : err) + '</div>';
            }).listContractFiles(currentUserInfo);
        };
        // ===== สรุปการต่อสัญญาปี 2570 รายจังหวัด + ศป. (ผู้ใช้ขอ 2026-11-26) — นับทั้งขอบเขตสิทธิ์ ไม่ขึ้นกับช่องค้นหา =====
        var RN_ORDER = ['ศรีสะเกษ', 'อุบลราชธานี', 'ยโสธร', 'อำนาจเจริญ', 'นครพนม', 'สกลนคร', 'มุกดาหาร', 'ศป.อุบลราชธานี', 'ศป.สกลนคร'];
        var rnArea = function (f) { return f.zip === '34010' ? 'ศป.อุบลราชธานี' : f.zip === '47010' ? 'ศป.สกลนคร' : String(f.prov || 'ไม่ระบุจังหวัด').replace(/^จังหวัด\s*|^จ\.\s*/, '').trim(); };
        var rnLabel = function (a) { return /^ศป\./.test(a) || a === 'ไม่ระบุจังหวัด' ? a : 'จ.' + a; };
        var rnData = function () {
            var g = {}, order = [], tot = { n: 0, s: 0, off: {}, offDone: 0 };
            (st.list || []).forEach(function (f) {

                var v = all.filter(function (f) { return f.nView > 0 || f.view; }).length, d = all.filter(function (f) { return f.nDl > 0 || f.dl; }).length, s = all.filter(function (f) { return f.signed; }).length;
                return '<span class="cf-seen' + (v ? '' : ' is-zero') + '" title="เปิดดูแล้ว ' + fmt(v) + ' จาก ' + fmt(all.length) + ' ไฟล์"><i class="fas fa-eye"></i>' + fmt(v) + '</span>' +
                    '<span class="cf-seen' + (d ? '' : ' is-zero') + '" title="ดาวน์โหลดแล้ว ' + fmt(d) + ' จาก ' + fmt(all.length) + ' ไฟล์"><i class="fas fa-download"></i>' + fmt(d) + '</span>' +
                    '<span class="cf-seen' + (s ? ' is-sign' : ' is-zero') + '" title="ส่งสัญญาฉบับใหม่ปี ' + sy + ' แล้ว ' + fmt(s) + ' จาก ' + fmt(all.length) + ' ราย"><i class="fas fa-file-signature"></i>' + fmt(s) + '/' + fmt(all.length) + '</span>';
            };
            var seen = function (P) {
                var all = []; P.oOrder.forEach(function (k) { all = all.concat(P.offices[k]); });
                return seenFiles(all);
            };
            var row = function (f, i) {
                return '<div class="cf-row' + (f.cancelled ? ' is-cancel' : '') + '"><span class="cf-no">' + (i + 1) + '</span>' +
                    (f.signed ? '<i class="fas fa-check-circle cf-ic cf-ok" title="ต่อสัญญาปี ' + sy + ' แล้ว" aria-label="ต่อสัญญาแล้ว"></i>' : '<i class="fas fa-file-pdf cf-ic" aria-hidden="true"></i>') + '<div class="cf-name"><div class="cf-title"><b>' + esc(show(f.name)) + '</b>' + pkgBadge(f.pkg) +
                    (f.signed ? ' <span class="cf-sign" title="มีไฟล์แนบในโฟลเดอร์ ปี ' + sy + ' ' + fmt(f.signed.n) + ' ไฟล์ · ล่าสุด ' + esc(thDate(f.signed.at)) + '"><i class="fas fa-file-signature"></i> ส่งฉบับใหม่ปี ' + sy + ' แล้ว</span>' : '') + (f.cancelled ? ' <span class="cf-cancel" title="ลูกค้ายกเลิกสัญญา (ชีตรายชื่อ) — ไม่นับในสรุป">ยกเลิกสัญญา</span>' : '') + '</div>' +
                    '<div class="cf-meta">' + (f.signed ? '<span class="cf-hist cf-hist-ok"><i class="fas fa-check"></i>ต่อสัญญาเมื่อ ' + esc(thDate(f.signed.at)) + (f.signed.n > 1 ? ' · ' + fmt(f.signed.n) + ' ไฟล์' : '') + '</span>' : '') +
                    '<span class="cf-hist"><i class="fas fa-clock"></i>สร้าง/อัปเดต ' + esc(thDate(f.at)) + '</span>' + hist(f.view, 'fa-eye', 'เปิดดูล่าสุด', f.nView) + hist(f.dl, 'fa-download', 'ดาวน์โหลดล่าสุด', f.nDl) + '</div></div>' +
                    '<div class="cf-act"><button type="button" class="cf-view" data-id="' + esc(f.id) + '" onclick="thpCfOpen(this, false)"><i class="fas fa-eye"></i>เปิดดู</button>' +
                    '<button type="button" data-id="' + esc(f.id) + '" onclick="thpCfOpen(this, true)"><i class="fas fa-download"></i>ดาวน์โหลด</button></div></div>';
            };
            list.innerHTML = pOrder.map(function (p) {
                var P = provs[p], open = openAll || p === st.openProv;
                return '<details class="cf-prov" data-prov="' + esc(p) + '"' + (open ? ' open' : '') + '><summary class="cf-prov-h"><i class="fas fa-chevron-right cf-chev" aria-hidden="true"></i><i class="fas ' + (/^ศป\./.test(p) ? 'fa-warehouse' : 'fa-map-marker-alt') + '"></i>' + (/^ศป\./.test(p) ? '' : 'จังหวัด') + esc(p) +
                    '<small>' + fmt(P.oOrder.length) + ' ที่ทำการ · ' + fmt(P.n) + ' ไฟล์' + seen(P) + '</small></summary><div class="cf-prov-body">' +
                    P.oOrder.map(function (k) {
                        // ที่ทำการพับได้เช่นกัน: เปิดทีละ 1 ที่ทำการ (ผู้ใช้ขอ 2026-11-20); ค้นหา/กรองที่ทำการ = เปิดทั้งหมดที่พบ; จังหวัดมีที่ทำการเดียว = เปิดเลย
                        var g = P.offices[k], oOpen = openAll || !!off || P.oOrder.length === 1 || st.openOffice === k;
                        return '<details class="cf-group" data-office="' + esc(k) + '"' + (oOpen ? ' open' : '') + '><summary class="cf-group-h"><i class="fas fa-chevron-right cf-chev" aria-hidden="true"></i><i class="fas fa-folder"></i>' + esc(k) + '<small>' + fmt(g.length) + ' ไฟล์' + seenFiles(g) + '</small></summary>' + g.map(row).join('') + '</details>';
                    }).join('') + '</div></details>';
            }).join('');
            // accordion: เปิดอันหนึ่ง อันอื่นระดับเดียวกันพับเอง
            var accordion = function (sel, key) {
                list.querySelectorAll(sel).forEach(function (d) {
                    d.addEventListener('toggle', function () {
                        if (!d.open || openAll || (key === 'openOffice' && off)) return;
                        st[key] = d.getAttribute(key === 'openProv' ? 'data-prov' : 'data-office');
                        var scope = key === 'openProv' ? list : d.parentNode;
                        scope.querySelectorAll(':scope > ' + sel + '[open]').forEach(function (o) { if (o !== d) o.open = false; });
                        setTimeout(function () { d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 0);
                    });
                });
            };
            accordion('details.cf-prov', 'openProv');
            accordion('details.cf-group', 'openOffice');
        };
        // เปิดดู: เปิดแท็บก่อน (กันเบราว์เซอร์บล็อกป๊อปอัป) แล้วใส่ไฟล์เมื่อโหลดเสร็จ
        window.thpCfOpen = function (btn, dl) {
            var id = btn.getAttribute('data-id'); if (!id) return;
            var w = dl ? null : window.open('', '_blank');
            if (w) { try { w.document.title = 'กำลังเปิดไฟล์สัญญา...'; w.document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;color:#6b7280">กำลังเปิดไฟล์สัญญา...</p>'; } catch (e) { } }
            btn.disabled = true;
            google.script.run.withSuccessHandler(function (res) {
                btn.disabled = false;
                if (!(res && res.status === 'success')) { if (w) w.close(); Swal.fire('เปิดไฟล์ไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                var bin = atob(res.data), u8 = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                // อัปเดตประวัติล่าสุดในรายการทันที (คงจังหวัดที่เปิดอยู่)
                if (res.log && st.list) { st.list.forEach(function (f) { if (f.id === id) { f[res.log.kind] = { at: res.log.at, by: res.log.by }; if (res.log.kind === 'dl') f.nDl = (f.nDl || 0) + 1; else f.nView = (f.nView || 0) + 1; } }); window.thpCfRender(); }
                var url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
                if (dl || !w) {
                    var a = document.createElement('a'); a.href = url; a.download = res.name || 'สัญญา.pdf';
                    document.body.appendChild(a); a.click(); a.remove();
                } else w.location.href = url;
                setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
            }).withFailureHandler(function (err) {
                btn.disabled = false; if (w) w.close();
                Swal.fire('เปิดไฟล์ไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
            }).getContractFileData({ id: id, mode: dl ? 'download' : 'view' }, currentUserInfo);
        };
    })();
</script>
