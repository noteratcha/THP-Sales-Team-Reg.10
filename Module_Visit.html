            'ที่ทำการ',
            'รหัสไปรษณีย์',
            'ทีม',
            'ระหว่างประเทศ',
            'e-Commerce',
            'ไปรษณียภัณฑ์/การเงิน/ค้าปลีก',
            'Fuze Post',
            'เป้าหมาย (ครั้ง)',
            'ยอดเข้าพบจริง (ครั้ง)',
            '% เข้าพบ',
            'ปิดได้',
            'ปิดไม่ได้'
        ]);

        let rank = 1;
        data.forEach(o => {
            const pct = o.target > 0 ? Math.round((o.actual / o.target) * 100) : (o.actual > 0 ? 100 : 0);

            excelData.push([
                rank++,
                o.name,
                o.zip,
                o.team,
                o.groups['ขร'] || 0,
                o.groups['ขล'] || 0,
                o.groups['ขป'] || 0,
                o.groups['fuze'] || 0,
                o.target || 0,
                o.actual || 0,
                `${pct}%`,
                o.success || 0,
                o.fail || 0
            ]);
        });

        if (excelData.length <= 1) {
            Swal.fire('ข้อผิดพลาด', 'ไม่มีข้อมูลที่มีการเข้าพบหรือมีเป้าหมาย', 'warning');
            return;
        }

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(excelData);

        // กำหนดความกว้างของคอลัมน์ให้เหมาะสมกับเนื้อหา
        ws['!cols'] = [
            { wch: 8 },  // ลำดับ
            { wch: 35 }, // ที่ทำการ
            { wch: 15 }, // รหัสไปรษณีย์
            { wch: 25 }, // ทีม
            { wch: 15 }, // ระหว่างประเทศ
            { wch: 15 }, // e-Commerce
            { wch: 25 }, // ไปรษณียภัณฑ์/การเงิน/ค้าปลีก
            { wch: 12 }, // Fuze Post
            { wch: 15 }, // เป้าหมาย
            { wch: 20 }, // ยอดเข้าพบจริง
            { wch: 12 }, // % เข้าพบ
            { wch: 10 }, // ปิดได้
            { wch: 12 }  // ปิดไม่ได้
        ];

        XLSX.utils.book_append_sheet(wb, ws, "สรุปรายที่ทำการ");

        const date = new Date();
        const timestamp = date.getFullYear() + String(date.getMonth() + 1).padStart(2, '0') + String(date.getDate()).padStart(2, '0');

        XLSX.writeFile(wb, `Office_Summary_${monthLabel}_${timestamp}.xlsx`);
    };
</script>

<!-- 📦 Script: Script_Visit_Export_JPEG.html -->
<script>
    // ==========================================
    // ฟังก์ชัน Export กราฟเป็น JPEG ขนาด A4 แนวนอน (แก้ไขสัดส่วน & หน้าต่างไม่ปิด)
    // ==========================================
    window.exportPopupChartToJPEG = async function () {
        const canvas = document.getElementById('popupMonthChart');
        if (!canvas) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบข้อมูลกราฟ', 'error');
            return;
        }

        // --- 1. จัดการระบบ Loader แบบฝังใน Popup ป้องกันหน้าต่างปิดตัว ---
        const popupEl = document.querySelector('.custom-swal-popup');
        let loaderEl = document.getElementById('localImageLoader');

        if (popupEl && !loaderEl) {
            loaderEl = document.createElement('div');
            loaderEl.id = 'localImageLoader';
            loaderEl.className = 'absolute inset-0 bg-white/80 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center rounded-2xl transition-opacity duration-300';
            loaderEl.innerHTML = `
                <i class="fas fa-circle-notch fa-spin text-theme-orange text-5xl mb-4"></i>
                <p id="localImageLoaderText" class="text-lg font-bold text-gray-800">กำลังจัดเตรียมรูปภาพ...</p>
            `;
            popupEl.appendChild(loaderEl);
        } else if (loaderEl) {
            loaderEl.classList.remove('hidden');
            loaderEl.style.opacity = '1';
            const textEl = loaderEl.querySelector('#localImageLoaderText');
            if (textEl) textEl.innerText = 'กำลังจัดเตรียมรูปภาพ...';
        }

        const hideLoader = () => {
            if (loaderEl) {
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.classList.add('hidden'), 300);
            }
        };

        const showToast = (icon, title, message) => {
            if (popupEl) {
                const toast = document.createElement('div');
                toast.className = `absolute top-4 right-4 bg-white px-5 py-3 rounded-xl shadow-2xl border-l-4 ${icon === 'success' ? 'border-green-500' : 'border-red-500'} flex items-center gap-3 z-[10000] transition-all duration-300 transform translate-x-10 opacity-0`;
                toast.innerHTML = `
                    <i class="fas ${icon === 'success' ? 'fa-check-circle text-green-500' : 'fa-times-circle text-red-500'} text-2xl"></i>
                    <div>
                        <p class="font-bold text-gray-800 text-sm">${title}</p>
                        ${message ? `<p class="text-xs text-gray-500">${message}</p>` : ''}
                    </div>
                `;
                popupEl.appendChild(toast);
                setTimeout(() => { toast.classList.remove('translate-x-10', 'opacity-0'); }, 10);
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-x-10');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            } else {
                Swal.fire({ icon: icon, title: title, text: message, toast: true, position: 'top-end', timer: 3000, showConfirmButton: false });
            }
        };
        // ----------------------------------------------------

        // รอ UI อัปเดตการแสดง Loader
        await new Promise(r => setTimeout(r, 50));

        // --- 2. สร้างโครงสร้างกระดาษ A4 แนวนอนในหน่วย Pixel ---
        const offScreen = document.createElement('div');
        offScreen.style.cssText = "position: absolute; left: -9999px; top: 0; width: 1131px; height: 800px; padding: 40px; box-sizing: border-box; background-color: #ffffff; font-family: 'Prompt', sans-serif; display: flex; flex-direction: column;";
        document.body.appendChild(offScreen);

        const monthLabel = window.currentPopupMonthLabel || 'เดือน';

        // แปลงปี ค.ศ. เป็น พ.ศ. สำหรับแสดงในหัวข้อรายงาน
        let displayMonthLabel = monthLabel;
        try {
            let parts = monthLabel.split(' ');
            if (parts.length >= 2) {
                let year = parseInt(parts[parts.length - 1]);
                if (!isNaN(year) && year < 2500) {
                    parts[parts.length - 1] = year + 543;
                    displayMonthLabel = parts.join(' ');
                }
            }
        } catch (e) { }

        const header = document.createElement('div');
        header.innerHTML = `<h2 style="font-size: 24px; font-weight: bold; color: #062e21; margin-bottom: 20px; border-bottom: 2px solid #e27d3d; padding-bottom: 12px; text-align: center;">กราฟแสดงเป้าหมายและยอดเข้าพบจริง ประจำเดือน ${displayMonthLabel}</h2>`;
        offScreen.appendChild(header);

        // --- 3. แคปเจอร์กราฟต้นฉบับและคำนวณสัดส่วน ---
        // วาดกราฟใส่ Canvas ชั่วคราวเพื่อรับประกันพื้นหลังสีขาว
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.fillStyle = '#ffffff';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(canvas, 0, 0);

        // คำนวณพื้นที่ที่เหลือสำหรับวางกราฟ
        const availableWidth = 1131 - (40 * 2); // หัก Padding ซ้าย-ขวา
        const headerApproxHeight = 70;
        const availableHeight = 800 - (40 * 2) - headerApproxHeight - 20; // หัก Padding บน-ล่าง และความสูงของส่วนหัว

        // คำนวณอัตราส่วนภาพ (Aspect Ratio) ป้องกันภาพเพี้ยน
        const imgRatio = canvas.width / canvas.height;
        const containerRatio = availableWidth / availableHeight;

        let renderWidth, renderHeight;

        if (imgRatio > containerRatio) {
            // ภาพกว้างกว่ากล่อง -> ให้ความกว้างเต็มพื้นที่ แล้วลดความสูงตามสัดส่วน
            renderWidth = availableWidth;
            renderHeight = availableWidth / imgRatio;
        } else {
            // ภาพสูงกว่ากล่อง -> ให้ความสูงเต็มพื้นที่ แล้วลดความกว้างตามสัดส่วน
            renderHeight = availableHeight;
            renderWidth = availableHeight * imgRatio;
        }

        const chartImg = document.createElement('img');
        chartImg.src = tempCanvas.toDataURL('image/png', 1.0);
        // บังคับขนาดกว้าง/ยาวตามที่คำนวณเป๊ะๆ html2canvas จะได้ไม่ยืดภาพ
        chartImg.style.cssText = `width: ${renderWidth}px; height: ${renderHeight}px; display: block; margin: 0 auto; object-fit: contain;`;

        const imgContainer = document.createElement('div');
        imgContainer.style.cssText = "flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; padding-top: 20px;";
        imgContainer.appendChild(chartImg);
        offScreen.appendChild(imgContainer);

        // --- 4. เรนเดอร์เป็นภาพ JPEG ---
        try {
            if (loaderEl) {
                const textEl = loaderEl.querySelector('#localImageLoaderText');
                if (textEl) textEl.innerText = 'กำลังประมวลผลรูปภาพ...';
            }

            // รอให้ภาพโหลดลง DOM เสมือนเสร็จสมบูรณ์
            await new Promise(r => setTimeout(r, 300));

            const renderedCanvas = await html2canvas(offScreen, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
            const imgData = renderedCanvas.toDataURL('image/jpeg', 1.0);

            // สร้างคำสั่งดาวน์โหลด
            const link = document.createElement('a');
            const timestamp = new Date().getTime();
            link.download = `Chart_Visit_${monthLabel}_${timestamp}.jpg`;
            link.href = imgData;
            link.click();

            // ล้างข้อมูลและแสดงผลลัพธ์
            document.body.removeChild(offScreen);
            hideLoader();
            Swal.fire('สำเร็จ', 'ดาวน์โหลดไฟล์ JPEG เรียบร้อยแล้ว', 'success');

        } catch (err) {
            if (document.body.contains(offScreen)) document.body.removeChild(offScreen);
            hideLoader();
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถสร้างรูปภาพได้: ' + err.message, 'error');
        }
    };

    // ==========================================
    // 5. สรุปการเข้าพบลูกค้า (Summary Modal)
    // ==========================================
    
    async function getVisitSummaryBase64(targetEl) {
        if (!targetEl) return null;

        const offScreen = document.createElement('div');
        offScreen.style.position = 'absolute';
        offScreen.style.left = '-9999px';
        offScreen.style.top = '0';
        offScreen.style.width = '1200px'; 
        offScreen.style.backgroundColor = '#ffffff';
        offScreen.style.padding = '40px';
        offScreen.style.zIndex = '-1';
        
        const styleFix = document.createElement('style');
        styleFix.innerHTML = `
            table th, table td {
                vertical-align: middle !important;
                padding: 0 !important;
            }
            .cell-wrapper {
                display: flex;
                align-items: center;
                align-content: center;
                flex-wrap: wrap; 
                min-height: 32px;
                padding: 8px 12px;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                white-space: normal !important;
                word-break: break-word;
            }
            .cell-wrapper-center { justify-content: center; text-align: center; }
            .cell-wrapper-left { justify-content: flex-start; text-align: left; }
            .cell-wrapper-right { justify-content: flex-end; text-align: right; }
        `;
        offScreen.appendChild(styleFix);
        
        const headerHtml = `
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">
                <div style="background-color: #3b82f6; color: white; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-chart-bar" style="font-size: 16px;"></i>
                </div>
                <h2 style="font-size: 24px; font-weight: bold; color: #1f2937; margin: 0; font-family: 'Sarabun', sans-serif;">สรุปการเข้าพบลูกค้า</h2>
            </div>
        `;
        
        const titleContainer = document.createElement('div');
        titleContainer.innerHTML = headerHtml;
        offScreen.appendChild(titleContainer);
        
        const clone = targetEl.cloneNode(true);
        clone.style.height = 'auto';
        clone.style.overflow = 'visible';
        clone.style.maxHeight = 'none';
        
        const cells = clone.querySelectorAll('td, th');
        cells.forEach(cell => {
            const inner = cell.innerHTML;
            let wrapClass = 'cell-wrapper-center';
            if (cell.classList.contains('text-left') || cell.style.textAlign === 'left') {
                wrapClass = 'cell-wrapper-left';
            } else if (cell.classList.contains('text-right') || cell.style.textAlign === 'right') {
                wrapClass = 'cell-wrapper-right';
            }
            cell.innerHTML = `<div class="cell-wrapper ${wrapClass}">${inner}</div>`;
        });
        
        offScreen.appendChild(clone);
        document.body.appendChild(offScreen);
        
        await new Promise(resolve => setTimeout(resolve, 800));
        
        offScreen.offsetHeight;
        
        const tbodyTrs = Array.from(clone.querySelectorAll('table tbody tr'));
        for (let i = 0; i < tbodyTrs.length; i++) {
            const tr = tbodyTrs[i];
            const firstTd = tr.firstElementChild;
            if (firstTd && firstTd.hasAttribute('rowspan') && !tr.classList.contains('font-bold')) {
                const rowspan = parseInt(firstTd.getAttribute('rowspan'));
                if (rowspan > 1) {
                    let totalHeight = 0;
                    for (let k = 0; k < rowspan; k++) {
                        if (tbodyTrs[i + k]) {
                            totalHeight += tbodyTrs[i + k].offsetHeight;
                        }
                    }
                    
                    firstTd.removeAttribute('rowspan');
                    const cellContent = firstTd.textContent.trim();
                    const className = firstTd.className;
                    
                    firstTd.style.position = 'relative';
                    firstTd.style.setProperty('border-bottom', 'none', 'important');
                    firstTd.innerHTML = `<div style="position: absolute; top: 0; left: 0; width: 100%; height: ${totalHeight}px; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 0 12px; box-sizing: border-box; background: transparent;">
                        <div style="width: 100%; text-align: center; white-space: normal; word-break: break-word;">${cellContent}</div>
                    </div>`;
                    
                    for (let j = 1; j < rowspan; j++) {
                        const nextTr = tbodyTrs[i + j];
                        if (nextTr) {
                            const newTd = document.createElement('td');
                            newTd.className = className;
                            if (j < rowspan - 1) {
                                newTd.style.setProperty('border-bottom', 'none', 'important');
                            }
                            newTd.style.setProperty('border-top', 'none', 'important');
                            nextTr.insertBefore(newTd, nextTr.firstChild);
                        }
                    }
                    i += rowspan - 1;
                }
            }
        }
        
        await document.fonts.ready;
        await new Promise(resolve => setTimeout(resolve, 500));

        try {
            const canvas = await html2canvas(offScreen, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff',
                logging: false
            });
            document.body.removeChild(offScreen);
            return canvas.toDataURL('image/jpeg', 0.95);
        } catch (e) {
            if(document.body.contains(offScreen)) document.body.removeChild(offScreen);
            throw e;
        }
    }

    async function downloadVisitSummary() {
        if (typeof html2canvas === 'undefined') {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบไลบรารี html2canvas สำหรับบันทึกรูปภาพ', 'error');
            return;
        }
        
        try {
            showGlobalLoader('กำลังบันทึกรูปภาพ...');
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const targetEl = document.querySelector('#visitSummaryContent');
            const base64Data = await getVisitSummaryBase64(targetEl);
            if (!base64Data) {
                hideGlobalLoader();
                return;
            }
            
            const link = document.createElement('a');
            link.download = `สรุปการเข้าพบลูกค้า_${new Date().toISOString().slice(0,10)}.jpg`;
            link.href = base64Data;
            link.click();

            hideGlobalLoader();
            if (typeof hideLoader === 'function') hideLoader();
            Swal.fire('สำเร็จ', 'ดาวน์โหลดไฟล์ JPEG เรียบร้อยแล้ว', 'success');

        } catch (err) {
            hideGlobalLoader();
            if (typeof hideLoader === 'function') hideLoader();
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถสร้างรูปภาพได้: ' + err.message, 'error');
        }
    }

    async function sendVisitSummaryToLine() {
        if (typeof html2canvas === 'undefined') {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบไลบรารี html2canvas สำหรับจับภาพ', 'error');
            return;
        }

        try {
            showGlobalLoader('กำลังเตรียมส่งรูปภาพ...');
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const tables = document.querySelectorAll('#visitSummaryContent > div.bg-white');
            if (!tables || tables.length === 0) {
                hideGlobalLoader();
                return;
            }

            let imagesData = [];
            for (let i = 0; i < tables.length; i++) {
                showGlobalLoader(`กำลังสร้างรูปภาพตารางที่ ${i+1}/${tables.length}...`);
                const base64Data = await getVisitSummaryBase64(tables[i]);
                if (!base64Data) continue;
                
                let titleText = "สรุปการเข้าพบลูกค้า";
                let dateText = "";
                const headerDivs = tables[i].querySelectorAll('.bg-gray-50 > div');
                if (headerDivs && headerDivs.length >= 2) {
                    titleText = headerDivs[0].innerText.trim();
                    dateText = headerDivs[1].innerText.trim();
                }

                let messageText = `📊 ${titleText}\n`;
                if (dateText) messageText += `${dateText}\n`;

                imagesData.push({ base64: base64Data, messageText: messageText });
            }

            if (imagesData.length === 0) {
                hideGlobalLoader();
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถสร้างรูปภาพได้', 'error');
                return;
            }

            showGlobalLoader('กำลังอัปโหลดและส่งรูปภาพทั้งหมดไปยัง LINE...');
            
            await new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler(function(response) {
                        if (response && response.status === 'success') {
                            resolve();
                        } else {
                            reject(new Error(response ? response.message : 'Unknown Error'));
                        }
                    })
                    .withFailureHandler(function(error) {
                        reject(error);
                    })
                    .sendVisitSummaryImagesToLine(imagesData);
            });
            
            hideGlobalLoader();
            Swal.fire({
                icon: 'success',
                title: 'ส่งสำเร็จ!',
                text: `ระบบได้ส่งภาพตารางสรุปการเข้าพบลูกค้า (แบ่งเป็น ${tables.length} รูป) ไปยัง LINE OA เรียบร้อยแล้ว`,
                timer: 2000,
                showConfirmButton: false
            });
        } catch (err) {
            hideGlobalLoader();
            console.error('Canvas Error:', err);
            Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาดในการจับภาพและส่ง LINE: ' + err.message, 'error');
        }
    }

    // ==========================================
    // 5. สรุปการเข้าพบลูกค้า (Summary Modal)
    // ==========================================
    function openVisitSummaryModal() {
        const modal = document.getElementById('visitSummaryModal');
        
        // Check if admin to show LINE OA button
        const btnLineOA = document.getElementById('btnSendLineOA');
        const btnDownload = document.getElementById('btnDownloadVisitSummary');
        
        if (btnLineOA) {
            const isAdmin = typeof currentUserInfo !== 'undefined' && currentUserInfo.user && String(currentUserInfo.user).toLowerCase() === 'admin';
            if (isAdmin) {
                btnLineOA.classList.remove('hidden');
                btnLineOA.classList.add('flex');
            } else {
                btnLineOA.classList.add('hidden');
                btnLineOA.classList.remove('flex');
            }
        }
        
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modal.querySelector('.bg-white').classList.remove('scale-95');
            modal.querySelector('.bg-white').classList.add('scale-100');
        }, 10);
        
        // ตรวจสอบว่ามีการโหลดข้อมูลหรือยัง ถ้ายังไม่มีให้ดึงข้อมูลก่อน
        if (typeof globalAllFetchedRows === 'undefined' || !globalAllFetchedRows || globalAllFetchedRows.length === 0) {
            // ปิดปุ่มไว้ก่อนระหว่างที่กำลังโหลด
            if (btnLineOA) { btnLineOA.disabled = true; btnLineOA.classList.add('opacity-50', 'cursor-not-allowed'); }
            if (btnDownload) { btnDownload.disabled = true; btnDownload.classList.add('opacity-50', 'cursor-not-allowed'); }
            
            const content = document.getElementById('visitSummaryContent');
            content.innerHTML = `<div class="text-center py-8 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl mb-2 text-blue-500"></i><br>กำลังดึงข้อมูล...</div>`;
            
            google.script.run
                .withSuccessHandler((res) => {
                    renderTable(res);
                    generateVisitSummary();
                    // เปิดปุ่มเมื่อโหลดเสร็จ
                    if (btnLineOA) { btnLineOA.disabled = false; btnLineOA.classList.remove('opacity-50', 'cursor-not-allowed'); }
                    if (btnDownload) { btnDownload.disabled = false; btnDownload.classList.remove('opacity-50', 'cursor-not-allowed'); }
                })
                .withFailureHandler((err) => {
                    content.innerHTML = `<div class="text-center py-8 text-red-500"><i class="fas fa-exclamation-triangle text-2xl mb-2"></i><br>เกิดข้อผิดพลาด: ${err.message}</div>`;
                    // เปิดปุ่มกลับ (แม้จะเกิด error เพื่อป้องกันปุ่มค้าง) หรือปล่อยให้ปิดไว้ก็ได้ ในที่นี้เปิดกลับ
                    if (btnLineOA) { btnLineOA.disabled = false; btnLineOA.classList.remove('opacity-50', 'cursor-not-allowed'); }
                    if (btnDownload) { btnDownload.disabled = false; btnDownload.classList.remove('opacity-50', 'cursor-not-allowed'); }
                })
                .getDataForTable();
        } else {
            generateVisitSummary();
        }
    }

    function closeVisitSummaryModal() {
        const modal = document.getElementById('visitSummaryModal');
        modal.classList.add('opacity-0');
        modal.querySelector('.bg-white').classList.remove('scale-100');
        modal.querySelector('.bg-white').classList.add('scale-95');
        setTimeout(() => {

    function generateVisitSummary() {
        const content = document.getElementById('visitSummaryContent');
        if (typeof globalAllFetchedRows === 'undefined' || !globalAllFetchedRows || globalAllFetchedRows.length === 0) {
            let dbgType = typeof allFetchedRows;
            let dbgLen = globalAllFetchedRows ? globalAllFetchedRows.length : 'N/A';
            content.innerHTML = `<div class="text-center py-8 text-gray-500">ไม่มีข้อมูล หรือกำลังโหลดข้อมูล... <br><span class="text-xs text-gray-400">(Debug: Type=${dbgType}, Len=${dbgLen})</span></div>`;
            return;
        }

        const customProvOrder = ["ศรีสะเกษ", "อุบลราชธานี", "ยโสธร", "อำนาจเจริญ", "สกลนคร", "นครพนม", "มุกดาหาร", "ศป.อุบลราชธานี", "ศป.สกลนคร"];
        
        // กำหนดวันที่: เมื่อวาน
        let today = new Date();
        let yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        
        // เดือนของเมื่อวาน
        let monthName = yesterday.toLocaleDateString('th-TH', { month: 'long' });
        let yearThai = yesterday.getFullYear() + 543;
        
        // หาช่วงวันที่ 1 ถึงเมื่อวาน
        let startDay = 1;
        let endDay = yesterday.getDate();
        
        const globalOfficeMap = {};
        
        // Build globalOfficeMap to ensure 1 office -> 1 team, and store ZIP code
        globalAllFetchedRows.forEach(row => {
            const teamFull = String(row[6] || '').trim();
            if (!teamFull) return;
            
            const zip = String(row[5] || '').trim().replace(/^'/, "");
            
            let province = "ไม่ระบุ";
            let foundProv = customProvOrder.find(p => teamFull.includes(p));
            if (foundProv) {
                province = foundProv;
            } else if (zip.startsWith('33')) province = 'ศรีสะเกษ';
            else if (zip.startsWith('34')) province = 'อุบลราชธานี';
            else if (zip.startsWith('35')) province = 'ยโสธร';
            else if (zip.startsWith('37')) province = 'อำนาจเจริญ';
            else if (zip.startsWith('47')) province = 'สกลนคร';
            else if (zip.startsWith('48')) province = 'นครพนม';
            else if (zip.startsWith('49')) province = 'มุกดาหาร';
            
            if (teamFull.includes('ศป.อุบลราชธานี') || zip === '34010') province = 'ศป.อุบลราชธานี';
            if (teamFull.includes('ศป.สกลนคร') || zip === '47010') province = 'ศป.สกลนคร';
            
            let rawOfficeName = String(row[4] || '').trim();
            let officeName = rawOfficeName;
            if (province !== 'ศป.อุบลราชธานี' && province !== 'ศป.สกลนคร') {
                officeName = rawOfficeName.replace(/^(ปณ\.?|ปปณ\.?|ปจ\.?|ศป\.?|ที่ทำการไปรษณีย์)\s*/, '');
            }
            officeName = officeName.replace(/อุบลอุบลราชธานี/g, 'อุบลราชธานี');
            
            if (officeName && officeName !== 'ไม่ระบุ') {
                globalOfficeMap[officeName] = { team: teamFull, province: province, zip: zip };
            }
        });
        
        const processData = (predicate) => {
            const summary = {};
            
            // Initialize summary structure based on globalOfficeMap
            Object.values(globalOfficeMap).forEach(info => {
                let p = info.province;
                let t = info.team || 'ไม่ระบุทีม';
                if (!summary[p]) summary[p] = {};
                if (!summary[p][t]) {
                    summary[p][t] = {
                        offices: new Set(),
                        lead_ecom: 0, lead_inter: 0, lead_fuze: 0,
                        visit_ecom: 0, visit_inter: 0, visit_fuze: 0,
                        success: 0, fail: 0
                    };
                }
            });
            Object.keys(globalOfficeMap).forEach(officeName => {
                let info = globalOfficeMap[officeName];
                summary[info.province][info.team || 'ไม่ระบุทีม'].offices.add(officeName);
            });
            
            // Phase 3: Process the data
            globalAllFetchedRows.forEach(row => {
                const dateStr = row[0] ? String(row[0]).split(' ')[0] : ''; // DD/MM/YYYY
                if (!dateStr) return;
                
                const parts = dateStr.split('/');
                if (parts.length < 3) return;
                
                const rDay = parseInt(parts[0], 10);
                const rMonth = parseInt(parts[1], 10) - 1; // 0-11
                const rYear = parseInt(parts[2], 10);
                const rYearCE = rYear > 2500 ? rYear - 543 : rYear;
                const rDate = new Date(rYearCE, rMonth, rDay);
                
                if (predicate(rDate)) {
                    const teamFull = String(row[6] || '').trim();
                    const zip = String(row[5] || '').trim().replace(/^'/, "");
                    
                    let initialProv = "ไม่ระบุ";
                    let foundProv = customProvOrder.find(p => teamFull.includes(p));
                    if (foundProv) {
                        initialProv = foundProv;
                    } else if (zip.startsWith('33')) initialProv = 'ศรีสะเกษ';
                    else if (zip.startsWith('34')) initialProv = 'อุบลราชธานี';
                    else if (zip.startsWith('35')) initialProv = 'ยโสธร';
                    else if (zip.startsWith('37')) initialProv = 'อำนาจเจริญ';
                    else if (zip.startsWith('47')) initialProv = 'สกลนคร';
                    else if (zip.startsWith('48')) initialProv = 'นครพนม';
                    else if (zip.startsWith('49')) initialProv = 'มุกดาหาร';
                    
                    if (teamFull.includes('ศป.อุบลราชธานี') || zip === '34010') initialProv = 'ศป.อุบลราชธานี';
                    if (teamFull.includes('ศป.สกลนคร') || zip === '47010') initialProv = 'ศป.สกลนคร';
                    
                    let rawOfficeName = String(row[4] || '').trim();
                    let officeName = rawOfficeName;
                    if (initialProv !== 'ศป.อุบลราชธานี' && initialProv !== 'ศป.สกลนคร') {
                        officeName = rawOfficeName.replace(/^(ปณ\.?|ปปณ\.?|ปจ\.?|ศป\.?|ที่ทำการไปรษณีย์)\s*/, '');
                    }
                    officeName = officeName.replace(/อุบลอุบลราชธานี/g, 'อุบลราชธานี');
                    
                    let mappedInfo = globalOfficeMap[officeName];
                    if (!mappedInfo) return;
                    
                    let province = mappedInfo.province;
                    let teamName = mappedInfo.team || 'ไม่ระบุทีม';

                    let ecomCount = 0;
                    if (group.includes('e-Commerce')) ecomCount++;
                    if (group.includes('ไปรษณียภัณฑ์')) ecomCount++;
                    
                    let interCount = group.includes('ระหว่างประเทศ') ? 1 : 0;
                    let fuzeCount = group.includes('Fuze') ? 1 : 0;
                    
                    let totalCount = ecomCount + interCount + fuzeCount;
                    if (totalCount === 0) totalCount = 1; // Fallback in case of unmatched group but valid result
                    
                    const result = String(row[19] || '').trim(); // คอลัมน์ T
                    let isSuccess = result === 'ปิดได้' || result === 'จัดได้';
                    let isFail = result === 'ปิดไม่ได้' || result === 'จัดไม่ได้';

                    if (ecomCount > 0) { t.lead_ecom += ecomCount; t.visit_ecom += ecomCount; }
                    if (interCount > 0) { t.lead_inter += interCount; t.visit_inter += interCount; }
                    if (fuzeCount > 0) { t.lead_fuze += fuzeCount; t.visit_fuze += fuzeCount; }
                    
                    if (isSuccess) t.success += totalCount;
                    if (isFail) t.fail += totalCount;
                }

    window.currentVisitPopupData = [];
    window.currentVisitPopupTitle = '';
    window.currentVisitSortCol = -1;

    window.sortVisitDetailTable = function(colIndex) {
        if (colIndex === 13) return; // Do not sort image column
        if (window.currentVisitSortCol === colIndex) {
            window.currentVisitSortAsc = !window.currentVisitSortAsc;
        } else {
            window.currentVisitSortCol = colIndex;
            window.currentVisitSortAsc = true;
        }
        
        const parseDate = (dStr) => {
            if (!dStr) return 0;
            const cleanStr = String(dStr).replace(',', '').split(' ')[0];
            const parts = cleanStr.split('/');
            if (parts.length < 3) return 0;
            return parseInt(parts[2] + parts[1].padStart(2, '0') + parts[0].padStart(2, '0'), 10);
        };

        window.currentVisitPopupData.sort((a,b) => {
            const getVal = (row, colIdx) => {
                if (colIdx === 0) return parseDate(row[0]);
                if (colIdx === 1) return String(row[1] || '').trim();
                if (colIdx === 2) return String(row[2] || '').trim();
                if (colIdx === 3) {
                    let colE = String(row[4] || '').trim();
                    colE = colE.replace(/อุบลอุบลราชธานี/g, 'อุบลราชธานี');
                    return colE;
                }
                if (colIdx === 4) return String(row[5] || '').trim();
                if (colIdx === 5) return String(row[6] || '').trim();
                if (colIdx === 6) return String(row[7] || '').trim();
                if (colIdx === 7) return String(row[8] || '').trim();
                if (colIdx === 8) return String(row[9] || '').trim();
                if (colIdx === 9) return String(row[10] || '').trim();
                if (colIdx === 10) return String(row[11] || '').trim();
                if (colIdx === 11) return String(row[16] || '').trim();
                if (colIdx === 12) return String(row[17] || '').trim();
                if (colIdx === 14) return String(row[19] || '').trim();
                if (colIdx === 15) return String(row[20] || '').trim();
                return '';
            };

            const valA = getVal(a, window.currentVisitSortCol);
            const valB = getVal(b, window.currentVisitSortCol);
            
            let cmp = 0;
            if (typeof valA === 'number' && typeof valB === 'number') {
                cmp = valA - valB;
            } else {
                cmp = String(valA).localeCompare(String(valB), 'th');
            }
            return window.currentVisitSortAsc ? cmp : -cmp;
        });
        
        window.updateVisitDetailTable(false);
    };

    window.renderVisitDetailPopup = function(filteredRows, titleHtml) {
        window.currentVisitPopupData = filteredRows;
        window.currentVisitPopupTitle = titleHtml;
        window.currentVisitSortCol = -1; 
        window.currentVisitSortAsc = true;
        
        const parseDate = (dStr) => {
            if (!dStr) return 0;
            const parts = String(dStr).split(' ')[0].split('/');
            if (parts.length < 3) return 0;
            return parseInt(parts[2] + parts[1].padStart(2, '0') + parts[0].padStart(2, '0'), 10);
        };

        window.currentVisitPopupData.sort((a,b) => {
            const zipA = String(a[5] || '').trim();
            const zipB = String(b[5] || '').trim();
            if (zipA !== zipB) return zipA.localeCompare(zipB);
            
            const teamA = String(a[6] || '').trim();
            const teamB = String(b[6] || '').trim();
            if (teamA !== teamB) return teamA.localeCompare(teamB);
            
            const dateA = parseDate(a[0]);
            const dateB = parseDate(b[0]);
            if (dateA !== dateB) return dateA - dateB;
            
            const topicA = String(a[1] || '').trim();
            const topicB = String(b[1] || '').trim();
            return topicA.localeCompare(topicB, 'th');
        });
        
        Swal.fire({
            title: titleHtml,
            html: '<div id="visitDetailTableContainer"></div>',
            width: '95%',
            showCloseButton: true,
            showConfirmButton: false,
            customClass: {
                popup: 'rounded-2xl shadow-2xl p-0 overflow-hidden',
                htmlContainer: 'text-left m-0 p-4'
            },
            didOpen: () => {
                window.updateVisitDetailTable(true);
            }
        });
    };


    window.openProvVisitDetailPopup = function(provinceName, isYesterday) {
        if (!window.allFetchedRows || window.allFetchedRows.length === 0) return;
        
        let today = new Date();
        let yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        let endDay = yesterday.getDate();
        
        const predicate = (d) => {
            if (isYesterday) {
                return d.getFullYear() === yesterday.getFullYear() && 
                       d.getMonth() === yesterday.getMonth() && 
                       d.getDate() === yesterday.getDate();
            } else {
                return d.getFullYear() === yesterday.getFullYear() && 
                       d.getMonth() === yesterday.getMonth() && 
                       d.getDate() >= 1 && d.getDate() <= endDay;
            }
        };

        const customProvOrder = ["ศรีสะเกษ", "อุบลราชธานี", "ยโสธร", "อำนาจเจริญ", "สกลนคร", "นครพนม", "มุกดาหาร", "ศป.อุบลราชธานี", "ศป.สกลนคร"];
        
        let filteredRows = window.allFetchedRows.filter(row => {
            const dateStr = row[0] ? String(row[0]).split(' ')[0] : '';
            if (!dateStr) return false;
            const parts = dateStr.split('/');
            if (parts.length < 3) return false;
            
            const rDay = parseInt(parts[0], 10);
            const rMonth = parseInt(parts[1], 10) - 1;
            const rYear = parseInt(parts[2], 10);
            const rYearCE = rYear > 2500 ? rYear - 543 : rYear;
            const rDate = new Date(rYearCE, rMonth, rDay);
            
            if (!predicate(rDate)) return false;
            
            const teamFull = String(row[6] || '').trim();
            const zip = String(row[5] || '').trim().replace(/^'/, "");
            
            let prov = "ไม่ระบุ";
            let foundProv = customProvOrder.find(p => teamFull.includes(p));
            if (foundProv) {
                prov = foundProv;
            } else if (zip.startsWith('33')) prov = 'ศรีสะเกษ';
            else if (zip.startsWith('34')) prov = 'อุบลราชธานี';
            else if (zip.startsWith('35')) prov = 'ยโสธร';
            else if (zip.startsWith('37')) prov = 'อำนาจเจริญ';
            else if (zip.startsWith('47')) prov = 'สกลนคร';
            else if (zip.startsWith('48')) prov = 'นครพนม';
            else if (zip.startsWith('49')) prov = 'มุกดาหาร';
            
            if (teamFull.includes('ศป.อุบลราชธานี') || zip === '34010') prov = 'ศป.อุบลราชธานี';
            if (teamFull.includes('ศป.สกลนคร') || zip === '47010') prov = 'ศป.สกลนคร';
            
            return prov === provinceName;
        });

        

        let titleDateStr = isYesterday ? 'รายวัน (เมื่อวาน)' : 'สะสมรายเดือน';
        let titleHtml = `<div class="text-lg font-bold text-gray-800 border-b pb-2 text-left">ข้อมูลเข้าพบลูกค้า${titleDateStr} - ${provinceName}</div>`;

        window.renderVisitDetailPopup(filteredRows, titleHtml);
    };
