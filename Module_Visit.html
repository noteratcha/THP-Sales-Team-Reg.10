        };

        const externalTooltipHandler = (context) => {
            const { chart, tooltip } = context;
            const tooltipEl = getOrCreateTooltip(chart);

            if (tooltip.opacity === 0) {
                tooltipEl.style.opacity = 0;
                tooltipEl.style.transform = tooltipEl.style.transform.replace('scale(1)', 'scale(0.95)');
                return;
            }

            if (tooltip.body) {
                const titleLines = tooltip.title || [];
                const dataPoints = tooltip.dataPoints;
                const tableRoot = tooltipEl.querySelector('div');
                tableRoot.innerHTML = '';

                let headerHtml = '';
                titleLines.forEach(title => {
                    headerHtml += `
                        <div class="text-center mb-3">
                            <div class="inline-flex items-center bg-gradient-to-r from-orange-500 to-orange-600 text-white font-prompt text-[12px] font-semibold tracking-wide px-4 py-1.5 rounded-full shadow-[0_4px_12px_rgba(234,88,12,0.25)]">
                                <i class="far fa-calendar-alt mr-2 text-[13px] opacity-90"></i> เดือน: ${title}
                            </div>
                        </div>
                    `;
                });

                if (!dataPoints || dataPoints.length === 0) return;

                const monthKey = sortedKeys[dataPoints[0].dataIndex];
                let totalActualForMonth = 0;
                let totalTargetForMonth = 0;
                let teamDetails = [];

                sortedSalesNames.forEach((salesName) => {
                    const actual = salesStats[monthKey] ? (salesStats[monthKey][salesName] || 0) : 0;
                    const target = (targetMap[salesName] && targetMap[salesName][monthKey]) ? targetMap[salesName][monthKey] : 0;

                    const ds = chart.data.datasets.find(d => d.label === salesName);
                    const color = ds ? ds.backgroundColor : '#ddd';

                    totalActualForMonth += actual;
                    totalTargetForMonth += target;

                    teamDetails.push({ name: salesName, actual: actual, target: target, color: color });
                });

                teamDetails.sort((a, b) => typeof sortTeams === 'function' ? sortTeams(a.name, b.name) : 0);

                const CHUNK_SIZE = 10;
                const chunks = [];
                for (let i = 0; i < teamDetails.length; i += CHUNK_SIZE) {
                    chunks.push(teamDetails.slice(i, i + CHUNK_SIZE));
                }

                let columnsHtml = '<div class="flex gap-4 overflow-x-auto pb-2 custom-scrollbar">';
                chunks.forEach(chunk => {
                    let tableHtml = '<table class="w-full text-left border-collapse"><tbody>';
                    chunk.forEach(t => {
                        let tPct = t.target > 0 ? Math.round((t.actual / t.target) * 100) : (t.actual > 0 ? 100 : 0);
                        let tColor = tPct >= 100 ? 'text-green-600' : (tPct >= 50 ? 'text-orange-500' : 'text-red-500');
                        tableHtml += `
                            <tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors group">
                                <td class="py-1.5 text-left text-[11px] text-gray-700 truncate max-w-[140px]" title="${t.name}">
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-2.5 h-2.5 rounded-full shrink-0 shadow-sm border border-white" style="background-color: ${t.color}"></span>
                                        <span class="truncate font-medium">${t.name}</span>
                                    </div>
                                </td>
                                <td class="py-1.5 text-right pl-3">
                                    <div class="flex flex-col items-end leading-tight">
                                        <span class="text-[12px] font-bold text-theme-orange">${t.actual.toLocaleString()}</span>
                                        <span class="text-[9px] text-gray-400">เป้า: ${t.target.toLocaleString()}</span>
                                    </div>
                                </td>
                                <td class="py-1.5 text-right pl-3 pr-1">
                                    <div class="bg-gray-50 px-1.5 py-0.5 rounded border border-gray-100 inline-block min-w-[36px] text-center shadow-sm">
                                        <span class="text-[10px] font-bold ${tColor}">${tPct}%</span>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                    tableHtml += '</tbody></table>';
                    columnsHtml += `<div class="flex-1 shrink-0 min-w-[220px]">${tableHtml}</div>`;
                });
                columnsHtml += '</div>';

                if (teamDetails.length === 0) {
                    columnsHtml = `<div class="text-center text-[10px] text-gray-400 py-4"><i class="fas fa-users mb-1 text-lg opacity-50 block"></i>ไม่มีข้อมูลทีม</div>`;
                }

                tableRoot.innerHTML = `
                    <div class="flex flex-col gap-3 w-full">
                        ${headerHtml}
                        <div class="bg-gradient-to-br from-gray-50 to-gray-100 p-3 rounded-xl border border-gray-200 shadow-inner">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1"><i class="fas fa-check-circle text-theme-orange mr-1"></i>เข้าพบจริง</span>
                                    <span class="text-lg font-bold text-theme-orange leading-none">${totalActualForMonth.toLocaleString()} <span class="text-[10px] text-gray-400 font-normal">ครั้ง</span></span>
                                </div>
                                <div class="h-8 w-px bg-gray-200 mx-2"></div>
                                <div class="flex flex-col items-end text-right">
                                    <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1"><i class="fas fa-bullseye text-red-500 mr-1"></i>เป้าหมายรวม</span>
                                    <span class="text-lg font-bold text-red-500 leading-none">${totalTargetForMonth.toLocaleString()} <span class="text-[10px] text-gray-400 font-normal">ครั้ง</span></span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-1">
                            <div class="text-[10px] font-bold text-gray-500 mb-1.5 uppercase tracking-wider flex items-center gap-1.5 bg-gray-50 p-1.5 rounded-md border border-gray-100">
                                <i class="fas fa-list-ul text-gray-400"></i> แยกตามทีม (ทั้งหมด)
                            </div>
                            <div class="max-w-[70vw] lg:max-w-[800px]">
                                ${columnsHtml}
                            </div>
                        </div>
                        <div class="text-center mt-1 text-[9px] text-gray-400 border-t border-gray-100 pt-2">
                            <i class="fas fa-hand-pointer text-theme-orange mr-1"></i> คลิกที่กราฟเพื่อดูรายละเอียดระดับที่ทำการ
                        </div>
                    </div>
                `;
            }

            const { offsetLeft: positionX, offsetTop: positionY } = chart.canvas;
            tooltipEl.style.opacity = 1;

            let xPos = positionX + tooltip.caretX;
            let yPos = positionY + tooltip.caretY;

            let transformStyle = '';
            if (tooltip.caretX > chart.width / 2) {
                transformStyle = 'translate(calc(-100% - 20px), -50%) scale(1)';
            } else {
                transformStyle = 'translate(20px, -50%) scale(1)';
            }

            tooltipEl.style.transform = transformStyle;
            tooltipEl.style.left = xPos + 'px';
            tooltipEl.style.top = yPos + 'px';
        };

        dashboardChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                onClick: (event, elements, chart) => {
                    if (elements.length > 0) {
                        const dataIndex = elements[0].index;
                        const monthLabel = chart.data.labels[dataIndex];
                        const monthKey = sortedKeys[dataIndex];

                        // เรียกฟังก์ชัน Popup จาก Script_Visit_Chart_Popup.html
                        if (typeof window.openMonthDetailPopup === 'function') {
                            window.openMonthDetailPopup(monthLabel, monthKey, sortedSalesNames, extendedColors, dataRows, officeTargetMap);
                        }
                    }
                },
                onHover: (event, elements) => {
                    event.native.target.style.cursor = elements.length ? 'pointer' : 'default';
                },
                scales: {
                    y: { stacked: true, suggestedMax: ySuggestedMax },
                    x: { 
                        stacked: true, 
                        grid: { display: false },
                        ticks: {
                            maxRotation: window.innerWidth < 640 ? 90 : 0,
                            minRotation: window.innerWidth < 640 ? 90 : 0
                        }
                    }
                },
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        enabled: false,
                        position: 'nearest',
                        external: externalTooltipHandler
                    },
                    datalabels: {
                        display: c => {
                            if (c.dataset.type === 'line') return true;
                            let lastVisibleBarIdx = -1;
                            c.chart.data.datasets.forEach((d, i) => {
                                if (d.type !== 'line' && d.data[c.dataIndex] > 0) {
                                    lastVisibleBarIdx = i;
                                }
                            });
                            if (lastVisibleBarIdx === -1 && c.datasetIndex === 0) return true;
                            return c.datasetIndex === lastVisibleBarIdx;
                        },
                        anchor: c => c.dataset.type === 'line' ? 'center' : 'end',
                        align: c => {
                            if (c.dataset.type === 'line') {
                                let actualVal = 0;
                                c.chart.data.datasets.forEach(d => {
                                    if (d.type !== 'line') actualVal += (d.data[c.dataIndex] || 0);
                                });
                                let targetVal = c.dataset.data[c.dataIndex];
                                if (Math.abs(targetVal - actualVal) <= (Math.max(targetVal, actualVal) * 0.2) || targetVal <= actualVal) {
                                    return 'bottom';
                                }
                                return 'top';
                            }
                            return 'top';
                        },
                        offset: c => c.dataset.type === 'line' ? 6 : 4,
                        color: c => c.dataset.type === 'line' ? '#ef4444' : '#6b7280',
                        font: { weight: 'bold', family: "'Prompt', sans-serif", size: 10 },
                        backgroundColor: c => c.dataset.type === 'line' ? 'rgba(255, 255, 255, 0.85)' : 'transparent',
                        borderRadius: 4,
                        padding: c => c.dataset.type === 'line' ? 4 : 0,
                        formatter: (v, c) => {
                            if (c.dataset.type === 'line') {
                                return v > 0 ? v.toLocaleString() : '';
                            }
                            let s = 0;
                            c.chart.data.datasets.forEach(d => {
                                if (d.type !== 'line') s += (d.data[c.dataIndex] || 0);
                            });
                            return s > 0 ? s.toLocaleString() : '';
                        }
                    }
                }
            }
        });
    }
</script>

<!-- 📦 Script: Script_Visit_Chart_Popup.html -->
<script>
    // ==========================================
    // ฟังก์ชันจัดการ UI ส่วนเสริมแบบ Global สำหรับ Popup
    // ==========================================
    window.toggleTeamAccordionPopup = function (index) {
        const targets = document.querySelectorAll(`.team-accordion-${index}`);
        const icon = document.getElementById(`icon-acc-${index}`);

        let isHidden = false;
        if (targets.length > 0) {
            isHidden = targets[0].classList.contains('hidden');
        }

        // ซ่อนทั้งหมดก่อน
        document.querySelectorAll('.team-accordion-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('[id^="icon-acc-"]').forEach(el => el.style.transform = 'rotate(0deg)');

        // แสดงเป้าหมายที่ถูกคลิก
        if (isHidden) {
            targets.forEach(el => el.classList.remove('hidden'));
            if (icon) icon.style.transform = 'rotate(180deg)';
        }
    };

    // ==========================================
    // ฟังก์ชันสร้าง Popup (Modal) กราฟแยกแต่ละทีมและตารางที่ทำการในเดือนที่คลิก
    // ==========================================
    window.openMonthDetailPopup = function (monthLabel, monthKey, teams, colors, rawDataRows, officeTargets) {
        const thaiMonthToNum = { "มกราคม": 1, "กุมภาพันธ์": 2, "มีนาคม": 3, "เมษายน": 4, "พฤษภาคม": 5, "มิถุนายน": 6, "กรกฎาคม": 7, "สิงหาคม": 8, "กันยายน": 9, "ตุลาคม": 10, "พฤศจิกายน": 11, "ธันวาคม": 12 };
        const currentUser = typeof currentUserInfo !== 'undefined' ? currentUserInfo.user : '';
        const userLocFilter = typeof getUserLocationFilter === 'function' ? getUserLocationFilter(currentUser) : null;

        // สร้างแผนผังข้อมูลที่รวบรวมความสัมพันธ์ระหว่าง ทีม -> ที่ทำการ -> (ยอดจริง/เป้าหมาย) ประจำเดือนนั้น
        const teamOfficeDetails = {};

        // 1. ดึงยอดเป้าหมายมาใส่ตามโครงสร้าง
        if (typeof globalVisitTargets !== 'undefined' && globalVisitTargets.length > 0) {
            globalVisitTargets.forEach(r => {
                let y = parseInt(r[0]); if (y > 2500) y -= 543;
                let m = thaiMonthToNum[r[1] ? String(r[1]).trim() : ''];

                if (`${m}/${y}` === monthKey) {
                    let zip = r[2] ? String(r[2]).trim() : '';
                    let office = r[3] ? String(r[3]).trim() : '';
                    let targetVal = parseInt(r[4]) || 0;
                    let team = r[5] ? String(r[5]).trim() : '';
                    let prov = r[6] ? String(r[6]).trim() : '';

                    // กรองเป้าหมายระดับที่ทำการด้วยที่ทำการ/จังหวัดของผู้ใช้งาน
                    let allowOffice = true;
                    if (userLocFilter) {
                        if (userLocFilter.type === 'zipcode' && zip !== userLocFilter.value) allowOffice = false;
                        if (userLocFilter.type === 'province') {
                            if (prov && !prov.includes(userLocFilter.value)) allowOffice = false;
                            if (userLocFilter.excludeZip && zip === userLocFilter.excludeZip) allowOffice = false;
                        }
                    }

                    if (allowOffice && team && zip) {
                        if (!teamOfficeDetails[team]) teamOfficeDetails[team] = {};
                        if (!teamOfficeDetails[team][zip]) teamOfficeDetails[team][zip] = { name: office, actual: 0, target: 0 };
                        teamOfficeDetails[team][zip].target += targetVal;
                    }
                }
            });
        }

        // 2. ดึงยอดเข้าพบจริงมาบวกเพิ่มตามโครงสร้าง
        rawDataRows.forEach(row => {
            try {
                const datePart = row[0].split(' ')[0];
                const parts = datePart.split('/');
                if (parts.length >= 3) {
                    const m = parseInt(parts[1]);
                    const y = parseInt(parts[2]);
                    if (`${m}/${y}` === monthKey) {
                        const team = String(row[6]).trim() || 'ไม่ระบุ';
                        const office = String(row[4]).trim() || 'ไม่ระบุ';
                        const zip = String(row[5]).replace(/^'/, "").trim() || 'ไม่ระบุ';

                        const group = String(row[2] || '').trim();
                        let ecomCount = 0;
                        if (group.includes('e-Commerce')) ecomCount++;
                        if (group.includes('ไปรษณียภัณฑ์')) ecomCount++;
                        let interCount = group.includes('ระหว่างประเทศ') ? 1 : 0;
                        let fuzeCount = group.includes('Fuze') ? 1 : 0;
                        let totalCount = ecomCount + interCount + fuzeCount;
                        if (totalCount === 0) totalCount = 1;

                        if (!teamOfficeDetails[team]) teamOfficeDetails[team] = {};
                        if (!teamOfficeDetails[team][zip]) teamOfficeDetails[team][zip] = { name: office, actual: 0, target: 0 };
                        teamOfficeDetails[team][zip].actual += totalCount;
                    }
                }
            } catch (e) { }
        });

        // เตรียมข้อมูลกราฟและตารางสรุปรายทีม
        let filteredTeams = [];
        let actualData = [];
        let targetData = [];
        let bgColors = [];
        let totalActual = 0;
        let totalTarget = 0;

        teams.forEach((teamName, index) => {
            let tActual = 0;
            let tTarget = 0;

            if (teamOfficeDetails[teamName]) {
                Object.values(teamOfficeDetails[teamName]).forEach(o => {
                    tActual += o.actual;
                    tTarget += o.target;
                });
            }

            if (tActual > 0 || tTarget > 0) {
                filteredTeams.push(teamName);
                actualData.push(tActual);
                targetData.push(tTarget);
                bgColors.push(colors[index % colors.length]);
                totalActual += tActual;
                totalTarget += tTarget;
            }
        });

        const pct = totalTarget > 0 ? Math.round((totalActual / totalTarget) * 100) : 0;
        const pctColor = pct >= 100 ? '#10b981' : '#f59e0b';

        // 1. สร้าง HTML สำหรับตารางสรุปรายทีม (Accordion แสดงที่ทำการ)
        let tableHtml = '';
        filteredTeams.forEach((teamName, index) => {
            const actual = actualData[index];
            const target = targetData[index];
            const color = bgColors[index];
            const teamPct = target > 0 ? Math.round((actual / target) * 100) : 0;
            const teamPctColor = teamPct >= 100 ? 'text-green-600' : (teamPct >= 50 ? 'text-orange-500' : 'text-red-500');
            const barColorClass = teamPct >= 100 ? 'bg-green-500' : (teamPct >= 50 ? 'bg-orange-500' : 'bg-red-500');
            const barWidth = Math.min(teamPct, 100);

            // แถวหลัก (ชื่อทีม)
            tableHtml += `
                <tr class="border-b border-gray-50 hover:bg-blue-50/40 transition cursor-pointer group" onclick="toggleTeamAccordionPopup('${index}')">
                    <td class="py-3 px-4 text-center align-middle font-bold text-gray-500 text-xs">${index + 1}</td>
                    <td class="py-3 px-4 align-middle">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full shadow-sm shrink-0" style="background-color: ${color}"></span>
                            <span class="font-medium text-gray-800 text-[13px] truncate max-w-[120px]" title="${teamName}">${teamName}</span>
                            <i class="fas fa-chevron-down text-[10px] text-gray-300 group-hover:text-theme-orange ml-1 transition-all" id="icon-acc-${index}"></i>
                        </div>
                    </td>
                    <td class="py-3 px-4 text-right text-gray-500 text-[13px] align-middle">${target.toLocaleString()}</td>
                    <td class="py-3 px-4 text-right font-bold text-theme-orange text-[13px] align-middle">${actual.toLocaleString()}</td>
                    <td class="py-3 px-4 text-right align-middle">
                        <div class="flex flex-col items-end gap-1.5 w-full min-w-[70px]">
                            <span class="font-bold text-[11px] ${teamPctColor} leading-none">${teamPct}%</span>
                            <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden flex-shrink-0">
                                <div class="${barColorClass} h-full rounded-full transition-all duration-500" style="width: ${barWidth}%"></div>
                            </div>
                        </div>
                    </td>
                </tr>
            `;

            // จัดเตรียมรายชื่อที่ทำการย่อยภายใต้ทีม
            let subOffices = teamOfficeDetails[teamName] ? Object.keys(teamOfficeDetails[teamName]).map(z => ({ zip: z, ...teamOfficeDetails[teamName][z] })) : [];
            subOffices.sort((a, b) => parseInt(a.zip) - parseInt(b.zip));

            if (subOffices.length > 0) {
                subOffices.forEach(o => {
                    if (o.actual > 0 || o.target > 0) {
                        const subTeamPct = o.target > 0 ? Math.round((o.actual / o.target) * 100) : 0;
                        const subTeamPctColor = subTeamPct >= 100 ? 'text-green-600' : 'text-orange-500';

                        // แถวซ่อน (รายละเอียดที่ทำการ)
                        tableHtml += `
                            <tr class="team-accordion-content team-accordion-${index} hidden bg-gray-50/80 shadow-inner border-b border-gray-100/50 hover:bg-gray-100 transition">
                                <td></td>
                                <td class="py-2.5 px-4 text-left pl-8 text-[11px] text-gray-600 truncate max-w-[150px] align-middle" title="${o.name} (${o.zip})">- ${o.name} (${o.zip})</td>
                                <td class="py-2.5 px-4 text-right text-[11px] text-gray-500 align-middle">${o.target.toLocaleString()}</td>
                                <td class="py-2.5 px-4 text-right text-[11px] text-theme-orange font-bold align-middle">${o.actual.toLocaleString()}</td>
                                <td class="py-2.5 px-4 text-right text-[11px] font-bold ${subTeamPctColor} align-middle">${subTeamPct}%</td>
                            </tr>
                        `;
                    }
                });
            } else {
                tableHtml += `
                    <tr class="team-accordion-content team-accordion-${index} hidden bg-gray-50/80 shadow-inner border-b border-gray-100/50">
                        <td colspan="5" class="py-4 px-4 text-center text-[11px] text-gray-400 align-middle">ไม่มีข้อมูลที่ทำการ</td>
                    </tr>
                `;
            }
        });

        // 2. สร้าง HTML สำหรับตารางรายที่ทำการทั้งหมด (+ นับผลการเสนอขาย และ กลุ่มลูกค้า)
        const officeActuals = {};
        const officeSuccess = {};
        const officeFail = {};
        const officeGroups = {};
        const zipToNameMap = {};

        let globalTotalSuccess = 0;
        let globalTotalFail = 0;
        let globalGroupINT = 0; // ระหว่างประเทศ
        let globalGroupECO = 0; // e-Commerce
        let globalGroupRET = 0; // ไปรษณียภัณฑ์/การเงิน/ค้าปลีก
        let globalGroupFUZ = 0; // Fuze Post

        rawDataRows.forEach(row => {
            try {
                const datePart = row[0].split(' ')[0];
                const parts = datePart.split('/');
                if (parts.length >= 3) {
                    const m = parseInt(parts[1]);
                    const y = parseInt(parts[2]);
                    if (`${m}/${y}` === monthKey) {
                        const officeName = String(row[4]).trim() || 'ไม่ระบุ';
                        const zipCode = String(row[5]).replace(/^'/, "").trim() || 'ไม่ระบุ';
                        const customerGroup = String(row[2] || '').trim(); // คอลัมน์ C (Index 2) - กลุ่มลูกค้า
                        const offerResult = String(row[19] || '').trim(); // คอลัมน์ T (Index 19) - ผลการนำเสนอ

                        let ecomCount = 0;
                        if (customerGroup.includes('e-Commerce')) ecomCount++;
                        if (customerGroup.includes('ไปรษณียภัณฑ์')) ecomCount++;
                        let interCount = customerGroup.includes('ระหว่างประเทศ') ? 1 : 0;
                        let fuzeCount = customerGroup.includes('Fuze') ? 1 : 0;
                        let totalCount = ecomCount + interCount + fuzeCount;
                        if (totalCount === 0) totalCount = 1;

                        zipToNameMap[zipCode] = officeName;
                        officeActuals[zipCode] = (officeActuals[zipCode] || 0) + totalCount;

                        // จัดกลุ่มลูกค้าและนับยอดรวม
                        if (!officeGroups[zipCode]) {
                            officeGroups[zipCode] = { 'ขร': 0, 'ขล': 0, 'ขป': 0, 'fuze': 0 };
                        }
                        if (customerGroup.includes('ระหว่างประเทศ')) {
                            officeGroups[zipCode]['ขร']++;
                            globalGroupINT++;
                        }
                        if (customerGroup.includes('e-Commerce')) {
                            officeGroups[zipCode]['ขล']++;
                            globalGroupECO++;
                        }
                        if (customerGroup.includes('ไปรษณียภัณฑ์')) {
                            officeGroups[zipCode]['ขป']++;
                            globalGroupRET++;
                        }
                        if (customerGroup.includes('Fuze Post')) {
                            officeGroups[zipCode]['fuze']++;
                            globalGroupFUZ++;

                                            <th style="width: 55px;" class="py-2.5 px-1.5 text-white font-semibold border-b border-slate-700 text-center align-middle text-[10px] tracking-wider whitespace-normal leading-tight">Fuze</th>
                                            
                                            <th style="width: 65px;" class="py-2.5 px-2 text-white font-semibold border-b border-slate-700 text-right align-middle text-[10px] uppercase tracking-wider">เป้าหมาย</th>
                                            <th style="width: 65px;" class="py-2.5 px-2 text-white font-semibold border-b border-slate-700 text-right align-middle text-[10px] uppercase tracking-wider">เข้าพบ</th>
                                            <th style="width: 70px;" class="py-2.5 px-2 text-white font-semibold border-b border-slate-700 text-right align-middle text-[10px] uppercase tracking-wider">% เข้าพบ</th>
                                            <th style="width: 60px;" class="py-2.5 px-2 text-green-400 font-semibold border-b border-slate-700 text-right align-middle text-[10px] uppercase tracking-wider border-l border-slate-600">ปิดได้</th>
                                            <th style="width: 60px;" class="py-2.5 px-2 text-red-400 font-semibold border-b border-slate-700 text-right align-middle text-[10px] uppercase tracking-wider rounded-tr-lg">ปิดไม่ได้</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white">
                                        ${officeTableHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            width: '98vw',
            showCloseButton: false,
            showConfirmButton: false,
            backdrop: 'rgba(17, 24, 39, 0.4)',
            customClass: {
                container: 'custom-swal-container z-[9999] backdrop-blur-sm',
                popup: 'custom-swal-popup bg-white w-full max-w-[98vw] h-[96vh] max-h-[96vh] border border-gray-100 shadow-2xl !rounded-2xl'
            },
            didOpen: () => {
                const ctxPopup = document.getElementById('popupMonthChart').getContext('2d');
                new Chart(ctxPopup, {
                    type: 'bar',
                    data: {
                        labels: filteredTeams,
                        datasets: [
                            {
                                label: 'ยอดเข้าพบจริง',
                                data: actualData,
                                backgroundColor: bgColors,
                                borderRadius: 6,
                                order: 2
                            },
                            {
                                type: 'line',
                                label: 'เป้าหมาย',
                                data: targetData,
                                borderColor: '#ef4444',
                                backgroundColor: '#ffffff',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                pointRadius: 4,
                                pointHoverRadius: 7,
                                pointBorderWidth: 2,
                                pointBackgroundColor: '#ffffff',
                                pointBorderColor: '#ef4444',
                                fill: false,
                                tension: 0.2,
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'nearest', intersect: true },
                        onClick: (event, elements, chart) => {
                            if (elements.length > 0) {
                                const element = elements[0];
                                if (chart.data.datasets[element.datasetIndex].type === 'line') return;

                                const clickedTeamName = chart.data.labels[element.index];
                                const popupChartEl = document.getElementById('popupMonthChart');
                                const isAlreadyFiltered = popupChartEl.getAttribute('data-filtered-team') === clickedTeamName;

                                const rows = document.querySelectorAll('.popup-office-row');
                                const filterStatusEl = document.getElementById('officeTableFilterStatus');

                                if (isAlreadyFiltered) {
                                    rows.forEach(r => r.style.display = '');
                                    popupChartEl.removeAttribute('data-filtered-team');
                                    if (filterStatusEl) {
                                        filterStatusEl.innerText = '';
                                        filterStatusEl.classList.add('hidden');
                                    }
                                } else {
                                    rows.forEach(r => {
                                        if (r.getAttribute('data-team') === clickedTeamName) r.style.display = '';
                                        else r.style.display = 'none';
                                    });
                                    popupChartEl.setAttribute('data-filtered-team', clickedTeamName);
                                    if (filterStatusEl) {
                                        filterStatusEl.innerHTML = `<i class="fas fa-filter mr-1"></i> กรอง: ${clickedTeamName}`;
                                        filterStatusEl.classList.remove('hidden');
                                        filterStatusEl.classList.add('inline-flex', 'items-center');
                                    }
                                }
                            }
                        },
                        onHover: (event, elements) => {
                            event.native.target.style.cursor = elements.length ? 'pointer' : 'default';
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                suggestedMax: Math.max(...actualData, ...targetData) * 1.2,
                                grid: { color: '#f3f4f6' },
                                ticks: { font: { family: "'Prompt', sans-serif" } }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { font: { family: "'Prompt', sans-serif", size: 10 } }
                            }
                        },
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { font: { family: "'Prompt', sans-serif", size: 11 } }
                            },
                            datalabels: {
                                display: true,
                                anchor: c => c.dataset.type === 'line' ? 'center' : 'end',
                                align: c => {
                                    if (c.dataset.type === 'line') {
                                        let actualVal = 0;
                                        c.chart.data.datasets.forEach(d => {
                                            if (d.type !== 'line') actualVal += d.data[c.dataIndex] || 0;
                                        });
                                        let targetVal = c.dataset.data[c.dataIndex];
                                        if (Math.abs(targetVal - actualVal) <= (Math.max(targetVal, actualVal) * 0.2) || targetVal <= actualVal) {
                                            return 'bottom';
                                        }
                                        return 'top';
                                    }
                                    return 'top';
                                },
                                color: c => c.dataset.type === 'line' ? '#ef4444' : '#6b7280',
                                font: { weight: 'bold', family: "'Prompt', sans-serif", size: 10 },
                                backgroundColor: c => c.dataset.type === 'line' ? 'rgba(255, 255, 255, 0.85)' : 'transparent',
                                borderRadius: 4,
                                padding: c => c.dataset.type === 'line' ? 4 : 0,
                                formatter: (v) => v > 0 ? v.toLocaleString() : ''
                            }
                        }
                    }
                });
            }
        });
    };
</script>

<!-- 📦 Script: Script_Visit_Chart_PDF.html -->
<script>
    // ==========================================
    // ฟังก์ชันจัดการ UI ส่วนเสริมแบบ Global สำหรับ Popup
    // ==========================================
    window.toggleTeamAccordionPopup = function (index) {
        const targets = document.querySelectorAll(`.team-accordion-${index}`);
        const icon = document.getElementById(`icon-acc-${index}`);

        let isHidden = false;
        if (targets.length > 0) {
            isHidden = targets[0].classList.contains('hidden');
        }

        // ซ่อนทั้งหมดก่อน
        document.querySelectorAll('.team-accordion-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('[id^="icon-acc-"]').forEach(el => el.style.transform = 'rotate(0deg)');

        // แสดงเป้าหมายที่ถูกคลิก
        if (isHidden) {
            targets.forEach(el => el.classList.remove('hidden'));
            if (icon) icon.style.transform = 'rotate(180deg)';
        }
    };

    // ==========================================
    // ฟังก์ชัน Export PDF (ผสมแนวตั้งและแนวนอน + Dynamic Stretch)
    // ==========================================
    window.exportMonthVisitToPDF = async function (monthLabel) {
        const exportArea = document.getElementById('monthVisitExportArea');
        if (!exportArea) return;

        // ฟังก์ชันสร้างและจัดการ Loader แบบฝังใน Popup
        const popupEl = document.querySelector('.custom-swal-popup');
        let loaderEl = document.getElementById('localPdfLoader');

        if (popupEl && !loaderEl) {
            loaderEl = document.createElement('div');
            loaderEl.id = 'localPdfLoader';
            loaderEl.className = 'absolute inset-0 bg-white/80 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center rounded-2xl transition-opacity duration-300';
            loaderEl.innerHTML = `
                <i class="fas fa-circle-notch fa-spin text-theme-orange text-5xl mb-4"></i>
                <p id="localPdfLoaderText" class="text-lg font-bold text-gray-800">กำลังเตรียมระบบสร้าง PDF...</p>
            `;
            popupEl.appendChild(loaderEl);
        } else if (loaderEl) {
            loaderEl.classList.remove('hidden');
            loaderEl.style.opacity = '1';
        }

        const updateLoader = (text) => {
            if (loaderEl) {
                const textEl = loaderEl.querySelector('#localPdfLoaderText');
                if (textEl) textEl.innerText = text;
            } else if (typeof showGlobalLoader === 'function') {
                showGlobalLoader(text);
            }
        };

        const hideLoader = () => {
            if (loaderEl) {
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.classList.add('hidden'), 300);
            } else if (typeof hideGlobalLoader === 'function') {
                hideGlobalLoader();
            }
        };

        const showToast = (icon, title, message) => {
            if (popupEl) {
                const toast = document.createElement('div');
                toast.className = `absolute top-4 right-4 bg-white px-5 py-3 rounded-xl shadow-2xl border-l-4 ${icon === 'success' ? 'border-green-500' : 'border-red-500'} flex items-center gap-3 z-[10000] transition-all duration-300 transform translate-x-10 opacity-0`;
                toast.innerHTML = `
                    <i class="fas ${icon === 'success' ? 'fa-check-circle text-green-500' : 'fa-times-circle text-red-500'} text-2xl"></i>
                    <div>
                        <p class="font-bold text-gray-800 text-sm">${title}</p>
                        ${message ? `<p class="text-xs text-gray-500">${message}</p>` : ''}
                    </div>
                `;
                popupEl.appendChild(toast);

                setTimeout(() => { toast.classList.remove('translate-x-10', 'opacity-0'); }, 10);
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-x-10');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            } else {
                Swal.fire({ icon: icon, title: title, text: message, toast: true, position: 'top-end', timer: 3000, showConfirmButton: false });
            }
        };

        updateLoader('กำลังเตรียมระบบสร้าง PDF...');
        await new Promise(r => setTimeout(r, 50));

        if (typeof window.jspdf === 'undefined') {
            const script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            script.onload = () => processCleanMonthVisitPDF(exportArea, monthLabel, updateLoader, hideLoader, showToast);
            document.head.appendChild(script);
        } else {
            processCleanMonthVisitPDF(exportArea, monthLabel, updateLoader, hideLoader, showToast);
        }
    };

    window.processCleanMonthVisitPDF = async function (exportArea, monthLabel, updateLoader, hideLoader, showToast) {
        try {
            updateLoader('กำลังรวบรวมข้อมูลจากตาราง...');
            await new Promise(r => setTimeout(r, 50));

            // ----------------------------------------------------
            // 1. สกัดข้อมูล (Extract Data) จาก UI ปัจจุบัน
            // ----------------------------------------------------
            const rawTables = exportArea.querySelectorAll('table');

            const top5Tbl = rawTables[0];
            const teamTbl = rawTables[1];
            const officeTbl = rawTables[2];

            const getStatText = (iconClass) => {
                try {
                    const iconEl = exportArea.querySelector(iconClass);
                    if (!iconEl) return '-';
                    const container = iconEl.closest('.flex-col.items-center') || iconEl.closest('.text-center');
                    if (!container) return '-';
                    const valueEl = container.querySelector('.text-xl, .text-2xl, .text-lg, .text-base');
                    if (!valueEl) return '-';
                    return Array.from(valueEl.childNodes)
                        .filter(node => node.nodeType === Node.TEXT_NODE)
                        .map(node => node.textContent.trim())
                        .join('');
                } catch (e) { return '-'; }
            };

            const statActual = getStatText('.fa-users');
            const statTarget = getStatText('.fa-bullseye');
            const statPct = getStatText('.fa-percentage');
            const statSuccess = getStatText('.fa-check-circle');
            const statFail = getStatText('.fa-times-circle');

            const statINT = getStatText('.fa-globe');
            const statECO = getStatText('.fa-shopping-cart');
            const statRET = getStatText('.fa-store');
            const statFUZ = getStatText('.fa-shipping-fast');

            const cleanText = (text) => text ? text.replace(/\s+/g, ' ').trim() : '-';
            const extractPct = (text) => {
                const match = text ? text.match(/\d+%/) : null;
                return match ? match[0] : '0%';
            };
            const getOfficeTeamText = (td) => {
                const spans = td.querySelectorAll('span');
                if (spans.length >= 2) {
                    return cleanText(spans[0].textContent) + ' - ' + cleanText(spans[1].textContent);
                }
                return cleanText(td.textContent);
            };

            const top5Rows = Array.from(top5Tbl.querySelectorAll('tbody tr')).map(tr => {
                const tds = tr.querySelectorAll('td');
                if (tds.length <= 1) return [cleanText(tds[0].textContent)];
                return [cleanText(tds[0].textContent), cleanText(tds[1].textContent), cleanText(tds[2].textContent)];
            });

            const teamRows = Array.from(teamTbl.querySelectorAll('tbody tr:not(.team-accordion-content)')).map((tr) => {
                const tds = tr.querySelectorAll('td');
                if (tds.length <= 1) return [cleanText(tds[0].textContent)];
                return [
                    cleanText(tds[0].textContent),
                    cleanText(tds[1].textContent),
                    cleanText(tds[2].textContent),
                    cleanText(tds[3].textContent),
                    extractPct(tds[4].textContent)
                ];
            });

            const officeRows = Array.from(officeTbl.querySelectorAll('tbody tr')).map((tr) => {
                const tds = tr.querySelectorAll('td');
                if (tds.length <= 1) return [cleanText(tds[0].textContent)];
                return [
                    cleanText(tds[0].textContent),
                    getOfficeTeamText(tds[1]),
                    cleanText(tds[2].textContent),
                    cleanText(tds[3].textContent),
                    cleanText(tds[4].textContent),
                    cleanText(tds[5].textContent),
                    cleanText(tds[6].textContent),
                    cleanText(tds[7].textContent),
                    extractPct(tds[8].textContent),
                    cleanText(tds[9].textContent),
                    cleanText(tds[10].textContent)
                ];
            });

            updateLoader('กำลังจัดโครงสร้างหน้ากระดาษ (Layout)...');
            await new Promise(r => setTimeout(r, 50));

            // ----------------------------------------------------
            // 2. สร้าง DOM เสมือน (Off-Screen) สำหรับ PDF 
            // ----------------------------------------------------
            const offScreen = document.createElement('div');
            offScreen.style.cssText = "position: absolute; left: -9999px; top: 0; width: 1200px; background-color: #ffffff; font-family: 'Prompt', sans-serif;";
            document.body.appendChild(offScreen);

            let currentPageNum = 1;
            let currentPageDiv, currentContentArea;
            let currentOrientation = 'p';
            const pages = [];

            let displayMonthLabel = monthLabel;
            try {
                let parts = monthLabel.split(' ');
                if (parts.length >= 2) {
                    let year = parseInt(parts[parts.length - 1]);
                    if (!isNaN(year) && year < 2500) {
                        parts[parts.length - 1] = year + 543;
                        displayMonthLabel = parts.join(' ');
                    }
                }
            } catch (e) { }

            function startNewPage(orientation = currentOrientation) {
                currentOrientation = orientation;
                currentPageDiv = document.createElement('div');

                if (orientation === 'p') {
                    currentPageDiv.style.cssText = "width: 800px; height: 1131px; padding: 40px 40px 100px 40px; box-sizing: border-box; background-color: #ffffff; position: relative; margin-bottom: 20px; overflow: hidden;";
                    const pgNum = document.createElement('div');
                    pgNum.className = 'pdf-page-number';
                    pgNum.dataset.page = currentPageNum;
                    pgNum.style.cssText = "position: absolute; top: 25px; right: 40px; font-size: 13px; color: #6b7280; font-weight: bold; text-align: right; z-index: 10;";
                    currentPageDiv.appendChild(pgNum);
                } else {
                    currentPageDiv.style.cssText = "width: 1131px; height: 800px; padding: 40px 40px 120px 40px; box-sizing: border-box; background-color: #ffffff; position: relative; margin-bottom: 20px; overflow: hidden;";
                    const pgNum = document.createElement('div');
                    pgNum.className = 'pdf-page-number';
                    pgNum.dataset.page = currentPageNum;
                    pgNum.style.cssText = "position: absolute; top: 25px; right: 40px; font-size: 13px; color: #6b7280; font-weight: bold; text-align: right; z-index: 10;";
                    currentPageDiv.appendChild(pgNum);
                }

                const header = document.createElement('div');
                header.innerHTML = `<h2 style="font-size: 24px; font-weight: bold; color: #062e21; margin-bottom: 20px; border-bottom: 2px solid #e27d3d; padding-bottom: 12px; text-align: center;">รายงานสรุปการเข้าพบลูกค้า ประจำเดือน ${displayMonthLabel}</h2>`;
                currentPageDiv.appendChild(header);

                currentContentArea = document.createElement('div');
                currentContentArea.style.cssText = "display: block; width: 100%;";
                currentPageDiv.appendChild(currentContentArea);

                offScreen.appendChild(currentPageDiv);
                pages.push({ element: currentPageDiv, orientation: orientation });
                currentPageNum++;
            }

            const stretchTable = (tbody) => {
                const MAX_CONTENT_HEIGHT = currentOrientation === 'p' ? 950 : 640;
                let remaining = MAX_CONTENT_HEIGHT - currentContentArea.offsetHeight;

                if (remaining > 5 && remaining < 400 && tbody.children.length > 0) {
                    const wrapper = tbody.parentElement.parentElement;
                    wrapper.style.height = (wrapper.offsetHeight + remaining) + 'px';
                }
            };

            function addElementToPage(el, type, requiredOrientation = null, maxRows = null) {
                if (requiredOrientation && requiredOrientation !== currentOrientation) {
                    startNewPage(requiredOrientation);
                }

                el.style.marginBottom = '20px';

                const MAX_CONTENT_HEIGHT = currentOrientation === 'p' ? 950 : 640;
                const MIN_SPACE_REQUIRED = currentOrientation === 'p' ? 180 : 160;

                if (type === 'table') {
                    let remainingSpace = MAX_CONTENT_HEIGHT - currentContentArea.offsetHeight;
                    if (remainingSpace < MIN_SPACE_REQUIRED && currentContentArea.children.length > 0) {
                        startNewPage(currentOrientation);
                    }
                }

                currentContentArea.appendChild(el);
                void currentContentArea.offsetHeight;

                if (currentContentArea.offsetHeight > MAX_CONTENT_HEIGHT || (maxRows !== null && type === 'table')) {
                    currentContentArea.removeChild(el);

                    if (type === 'table') {
                        const originalTitle = el.childNodes[0];
                        const originalTable = el.childNodes[1];
                        const originalThead = originalTable.querySelector('thead');
                        const originalRows = Array.from(originalTable.querySelector('tbody').children);

                        const appendEmptyTable = (targetArea) => {
                            const wrapper = document.createElement('div');
                            wrapper.style.width = '100%';
                            wrapper.style.border = '1px solid #e5e7eb';
                            wrapper.style.borderRadius = '8px';
                            wrapper.style.overflow = 'hidden';
                            wrapper.style.backgroundColor = '#ffffff';
                            wrapper.style.marginBottom = '20px';
                            wrapper.style.pageBreakInside = 'avoid';
                            wrapper.style.display = 'flex';
                            wrapper.style.flexDirection = 'column';

                            if (originalTitle) wrapper.appendChild(originalTitle.cloneNode(true));

                            const table = document.createElement('table');
                            table.style.width = '100%';
                            table.style.borderCollapse = 'collapse';
                            table.style.tableLayout = 'fixed';

                            if (maxRows === null) {
                                table.style.flex = '1';
                            }

                            if (originalThead) table.appendChild(originalThead.cloneNode(true));

                            const tbody = document.createElement('tbody');
                            table.appendChild(tbody);
                            wrapper.appendChild(table);

                            targetArea.appendChild(wrapper);
                            return tbody;
                        };

                        let currentTbody = appendEmptyTable(currentContentArea);
                        void currentContentArea.offsetHeight;

                        if (currentContentArea.offsetHeight > MAX_CONTENT_HEIGHT && currentContentArea.children.length > 1) {
                            currentContentArea.removeChild(currentContentArea.lastChild);
                            startNewPage(currentOrientation);
                            currentTbody = appendEmptyTable(currentContentArea);
                            void currentContentArea.offsetHeight;
                        }

                        let rowCount = 0;

                        for (let i = 0; i < originalRows.length; i++) {
                            if (maxRows !== null && rowCount >= maxRows) {
                                startNewPage(currentOrientation);
                                currentTbody = appendEmptyTable(currentContentArea);
                                rowCount = 0;
                                void currentContentArea.offsetHeight;
                            }

                            const rowClone = originalRows[i].cloneNode(true);
                            currentTbody.appendChild(rowClone);
                            rowCount++;

                            void currentContentArea.offsetHeight;

                            if (currentContentArea.offsetHeight > MAX_CONTENT_HEIGHT) {
                                currentTbody.removeChild(rowClone);
                                if (maxRows === null) {
                                    stretchTable(currentTbody);
                                }
                                startNewPage(currentOrientation);
                                currentTbody = appendEmptyTable(currentContentArea);
                                currentTbody.appendChild(rowClone);
                                rowCount = 1;
                                void currentContentArea.offsetHeight;
                            }
                        }
                    } else {
                        if (currentContentArea.children.length > 0) {
                            startNewPage(currentOrientation);
                        }
                        currentContentArea.appendChild(el);
                        void currentContentArea.offsetHeight;
                    }
                }
            }

            function createCleanTable(title, headers, rows, aligns, widths) {
                const wrapper = document.createElement('div');
                wrapper.style.width = '100%';
                wrapper.style.border = '1px solid #e5e7eb';
                wrapper.style.borderRadius = '8px';
                wrapper.style.overflow = 'hidden';
                wrapper.style.backgroundColor = '#ffffff';
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';

                const titleDiv = document.createElement('div');
                titleDiv.style.cssText = 'background-color: #f8fafc; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; font-weight: bold; font-size: 14px; color: #1f2937; vertical-align: middle;';
                titleDiv.innerHTML = title;
                wrapper.appendChild(titleDiv);

                const table = document.createElement('table');
                table.style.cssText = 'width: 100%; border-collapse: collapse; table-layout: fixed;';

                const isDense = headers.length > 8;
                const thPadding = isDense ? '10px 4px 12px 4px' : '12px 12px 16px 12px';
                const thFontSize = isDense ? '10.5px' : '12px';
                const tdPadding = isDense ? '8px 4px 10px 4px' : '10px 12px 16px 12px';
                const tdFontSize = isDense ? '10.5px' : '11.5px';

                const thead = document.createElement('thead');
                const thr = document.createElement('tr');
                thr.style.cssText = 'background-color: #062e21; color: #ffffff;';
                headers.forEach((h, i) => {
                    const th = document.createElement('th');
                    th.innerHTML = h;
                    th.style.cssText = `padding: ${thPadding}; font-size: ${thFontSize}; font-weight: bold; text-align: ${aligns[i] || 'left'}; vertical-align: middle; line-height: 1.5; overflow: hidden; word-wrap: break-word;`;
                    if (widths && widths[i]) th.style.width = widths[i];
                    thr.appendChild(th);
                });
                thead.appendChild(thr);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                rows.forEach((r, idx) => {
                    const tr = document.createElement('tr');
                    tr.style.cssText = `background-color: ${idx % 2 === 0 ? '#ffffff' : '#f9fafb'}; border-bottom: 1px solid #e5e7eb;`;

                    if (r.length === 1) {
                        const td = document.createElement('td');
                        td.innerText = r[0];
                        td.colSpan = headers.length;
                        td.style.cssText = `padding: 12px; text-align: center; color: #6b7280; font-size: ${thFontSize}; vertical-align: middle; line-height: 1.5;`;
                        tr.appendChild(td);
                    } else {
                        r.forEach((cell, i) => {
                            const td = document.createElement('td');
                            td.innerText = cell;
                            td.style.cssText = `padding: ${tdPadding}; font-size: ${tdFontSize}; color: #374151; vertical-align: middle; line-height: 1.5; text-align: ${aligns[i] || 'left'}; overflow: hidden; word-wrap: break-word;`;

                });

                wrapper.appendChild(table);
                return wrapper;
            }

            // --- เริ่มสร้างเนื้อหา (แนวตั้ง) ---
            startNewPage('p');

            // 1. กล่องสถิติ
            const statsDiv = document.createElement('div');
            statsDiv.style.cssText = "display: flex; flex-direction: column; background-color: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 10px; gap: 12px;";

            const statsRow1 = document.createElement('div');
            statsRow1.style.cssText = "display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; font-size: 14px; font-weight: bold; color: #374151; gap: 8px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px;";
            statsRow1.innerHTML = `
                <div>รวมเข้าพบ: <span style="color:#e27d3d; font-size: 18px;">${statActual}</span> ครั้ง</div>
                <div>เป้าหมายรวม: <span style="color:#ef4444; font-size: 18px;">${statTarget}</span> ครั้ง</div>
                <div>% เข้าพบลูกค้า: <span style="color:#10b981; font-size: 18px;">${statPct}</span></div>
                <div>ปิดได้: <span style="color:#10b981; font-size: 18px;">${statSuccess}</span></div>
                <div>ปิดไม่ได้: <span style="color:#ef4444; font-size: 18px;">${statFail}</span></div>
            `;

            const statsRow2 = document.createElement('div');
            statsRow2.style.cssText = "display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; font-size: 13px; font-weight: bold; color: #475569; gap: 8px;";
            statsRow2.innerHTML = `
                <div>ระหว่างประเทศ: <span style="color:#3b82f6; font-size: 16px;">${statINT}</span></div>
                <div>e-Commerce: <span style="color:#a855f7; font-size: 16px;">${statECO}</span></div>
                <div>ไปรษณียภัณฑ์/การเงิน/ค้าปลีก: <span style="color:#ca8a04; font-size: 16px;">${statRET}</span></div>
                <div>Fuze Post: <span style="color:#ec4899; font-size: 16px;">${statFUZ}</span></div>
            `;

            statsDiv.appendChild(statsRow1);
            statsDiv.appendChild(statsRow2);
            addElementToPage(statsDiv, 'block');

            // 2. กราฟแสดงเป้าหมายและยอดเข้าพบจริง
            const chartCanvas = exportArea.querySelector('canvas');
            if (chartCanvas) {
                const chartImg = document.createElement('img');
                chartImg.src = chartCanvas.toDataURL('image/png', 1.0);
                chartImg.style.cssText = "width: 100%; max-height: 260px; object-fit: contain; margin-top: 10px;";

                const chartWrap = document.createElement('div');
                chartWrap.style.cssText = "width: 100%; background-color: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; padding: 16px; box-sizing: border-box; page-break-inside: avoid;";

                const chartTitle = document.createElement('div');
                chartTitle.style.cssText = "font-size: 14px; font-weight: bold; color: #1f2937; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 10px;";
                chartTitle.innerText = "กราฟแสดงเป้าหมายและยอดเข้าพบจริง";

                chartWrap.appendChild(chartTitle);
                chartWrap.appendChild(chartImg);

                addElementToPage(chartWrap, 'block');
            }

            // 3. ตาราง 5 อันดับ
            const top5Clean = createCleanTable(
                '5 อันดับ (เข้าพบสูงสุด)',
                ['อันดับ', 'ที่ทำการ', 'เข้าพบ (ครั้ง)'],
                top5Rows,
                ['center', 'left', 'center'],
                ['15%', '60%', '25%']

            addElementToPage(top5Clean, 'table');

            // บังคับขึ้นหน้าใหม่สำหรับตารางรายทีม

            // 4. ตารางสรุปรายทีม
            const teamClean = createCleanTable(
                'สรุปรายทีม',
                ['ลำดับ', 'ทีม', 'เป้าหมาย', 'เข้าพบ', '% เข้าพบ'],
                teamRows,
                ['center', 'left', 'center', 'center', 'center'],
                ['10%', '30%', '20%', '20%', '20%']
            );

            // ยกเลิกการจำกัดความสูงและการบีบอัด ให้ใช้ Padding ปกติเสมอ
            teamClean.querySelectorAll('td').forEach(cell => {
                cell.style.padding = '10px 12px';
                cell.style.fontSize = '11.5px';
                cell.style.lineHeight = '1.5';
                cell.style.verticalAlign = 'middle';
            });
            teamClean.querySelectorAll('th').forEach(cell => {
                cell.style.padding = '12px 12px';
                cell.style.fontSize = '12px';
                cell.style.lineHeight = '1.5';
                cell.style.verticalAlign = 'middle';
            });

            // 💡 ส่ง maxRows = 20 เพื่อตัดขึ้นหน้าใหม่ทุก 20 รายการ
            addElementToPage(teamClean, 'table', 'p', 20);

            // --- เปลี่ยนเป็นแนวนอน (Landscape) สำหรับตารางที่ทำการ ---

            // 5. ตารางสรุปรายที่ทำการ (มี 11 คอลัมน์) 
            const officeClean = createCleanTable(
                'สรุปรายที่ทำการ',
                ['ลำดับ', 'ที่ทำการ', 'ระหว่างประเทศ', 'e-Commerce', 'ไปรษณียภัณฑ์/<br>การเงิน/ค้าปลีก', 'Fuze', 'เป้าหมาย', 'เข้าพบ', '% เข้าพบ', 'ปิดได้', 'ปิดไม่ได้'],
                officeRows,
                ['center', 'left', 'center', 'center', 'center', 'center', 'center', 'center', 'center', 'center', 'center'],
                ['4%', '20%', '10%', '9%', '13%', '6%', '8%', '8%', '8%', '7%', '7%']
            );

            addElementToPage(officeClean, 'table', 'l', 14);

            // ----------------------------------------------------
            // 3. อัปเดตเลขหน้า และ แคปเจอร์ภาพลง PDF
            // ----------------------------------------------------
            const totalPgs = pages.length;

            async function createPageNumberImage(text) {
                var div = document.createElement('div');
                div.style.position = 'absolute';
                div.style.top = '-9999px';
                div.style.left = '-9999px';
                div.style.padding = '5px 15px';
                div.style.whiteSpace = 'nowrap';
                div.style.fontFamily = "'Prompt', sans-serif";
                div.style.fontSize = '16px';
                div.style.fontWeight = 'normal';
                div.style.color = '#6b7280';
                div.style.backgroundColor = 'transparent';
                div.innerText = text;
                document.body.appendChild(div);
                var canvas = await html2canvas(div, { backgroundColor: null, scale: 3 });
                document.body.removeChild(div);
                return { data: canvas.toDataURL('image/png'), width: canvas.width, height: canvas.height };
            }

            offScreen.querySelectorAll('.pdf-page-number').forEach(el => {
                el.style.display = 'none';
            });

            updateLoader('กำลังรอเรนเดอร์ภาพก่อนแปลง PDF...');
            await new Promise(resolve => setTimeout(resolve, 500));

            const jsPDF = window.jspdf.jsPDF;
            const initialOrientation = pages.length > 0 ? pages[0].orientation : 'p';
            const pdf = new jsPDF(initialOrientation, 'mm', 'a4');

            for (let i = 0; i < pages.length; i++) {
                updateLoader(`กำลังแคปเจอร์หน้า ${i + 1} จาก ${totalPgs}...`);
                await new Promise(r => setTimeout(r, 50));

                const pageObj = pages[i];

                const canvas = await html2canvas(pageObj.element, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                const imgData = canvas.toDataURL('image/jpeg', 1.0);

                if (i > 0) {
                    pdf.addPage('a4', pageObj.orientation);
                }

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

                // แปะรูปเลขหน้า
                const pageNumStr = `${i + 1}`;
                const pageImgObj = await createPageNumberImage(pageNumStr);
                const targetH = 6.0;
                const targetW = (pageImgObj.width * targetH) / pageImgObj.height;
                const marginX = 14;
                pdf.addImage(pageImgObj.data, 'PNG', pdfWidth - marginX - targetW, 8, targetW, targetH);
            }

            updateLoader('กำลังบันทึกและดาวน์โหลดไฟล์...');
            await new Promise(r => setTimeout(r, 50));

            const date = new Date();
            const timestamp = date.getFullYear() + String(date.getMonth() + 1).padStart(2, '0') + String(date.getDate()).padStart(2, '0');
            pdf.save(`Visit_Report_${monthLabel}_${timestamp}.pdf`);

            document.body.removeChild(offScreen);

            hideLoader();
            showToast('success', 'ดาวน์โหลด PDF สำเร็จ!', 'ไฟล์ถูกบันทึกลงในเครื่องของคุณแล้ว');

        } catch (e) {
            const offScreenEl = document.getElementById('pdfOffScreenContent');
            if (offScreenEl) document.body.removeChild(offScreenEl);

            hideLoader();
            showToast('error', 'ข้อผิดพลาด', 'ไม่สามารถสร้าง PDF ได้: ' + e.message);
        }
    };
</script>

<script>

    // ==========================================
    // ฟังก์ชัน Export ข้อมูลสรุปรายทีมและที่ทำการเป็น Excel
    // ==========================================
    window.exportPopupTeamDetailsToExcel = function () {
        if (!window.currentPopupOfficeList || window.currentPopupOfficeList.length === 0) {
            Swal.fire('ข้อผิดพลาด', 'ไม่มีข้อมูลสำหรับดาวน์โหลด', 'warning');
            return;
        }

        // กรองเอาเฉพาะที่มีเป้าหมายหรือยอดเข้าพบจริง
        const data = [...window.currentPopupOfficeList].filter(o => o.actual > 0 || o.target > 0);

        const monthLabel = window.currentPopupMonthLabel || 'เดือน';
        const excelData = [];

        // Header
        excelData.push([
            'ทีม',
            'ที่ทำการ',
            'รหัสไปรษณีย์',
            'เป้าหมาย (ครั้ง)',
            'ยอดเข้าพบจริง (ครั้ง)',
            '% เข้าพบ',
            'ระหว่างประเทศ',
            'e-Commerce',
            'ไปรษณียภัณฑ์/การเงิน/ค้าปลีก',
            'Fuze Post',
            'ปิดได้',
            'ปิดไม่ได้'
        ]);

        // จัดกลุ่มตามทีม
        const teamsMap = {};
        data.forEach(o => {
            const t = o.team || 'ไม่ระบุ';
            if (!teamsMap[t]) teamsMap[t] = [];
            teamsMap[t].push(o);
        });

        // ฟังก์ชันจัดเรียงทีม (ล้อตามหลักการในหน้าจอ)
        const PROVINCE_ORDER = [
            "ทีมศรีสะเกษ", "ทีมอุบลราชธานี", "ทีมยโสธร", "ทีมอำนาจเจริญ",
            "ทีมสกลนคร", "ทีมนครพนม", "ทีมมุกดาหาร", "ทีม ศป.อุบลราชธานี", "ทีม ศป.สกลนคร"
        ];

        function sortTeams(a, b) {
            const strA = String(a).trim(); const strB = String(b).trim();
            const matchA = strA.match(/\d+$/); const matchB = strB.match(/\d+$/);
            const numA = matchA ? parseInt(matchA[0], 10) : 0; const numB = matchB ? parseInt(matchB[0], 10) : 0;
            const baseA = strA.replace(/\d+$/, '').trim(); const baseB = strB.replace(/\d+$/, '').trim();
            const indexA = PROVINCE_ORDER.indexOf(baseA); const indexB = PROVINCE_ORDER.indexOf(baseB);

            if (indexA !== -1 && indexB !== -1) {
                if (indexA === indexB) return numA - numB;
                return indexA - indexB;
            }
            if (indexA !== -1) return -1;
            if (indexB !== -1) return 1;
            if (baseA === baseB) return numA - numB;
            return baseA.localeCompare(baseB, 'th');
        }

        const sortedTeams = Object.keys(teamsMap).sort(sortTeams);

        sortedTeams.forEach(teamName => {
            const offices = teamsMap[teamName];

            // คำนวณสรุปรวมของทีม
            let teamTarget = 0, teamActual = 0, teamInt = 0, teamEco = 0, teamRet = 0, teamFuz = 0, teamSuccess = 0, teamFail = 0;
            offices.forEach(o => {
                teamTarget += (o.target || 0);
                teamActual += (o.actual || 0);
                teamInt += (o.groups['ขร'] || 0);
                teamEco += (o.groups['ขล'] || 0);
                teamRet += (o.groups['ขป'] || 0);
                teamFuz += (o.groups['fuze'] || 0);
                teamSuccess += (o.success || 0);
                teamFail += (o.fail || 0);
            });

            const teamPct = teamTarget > 0 ? Math.round((teamActual / teamTarget) * 100) : (teamActual > 0 ? 100 : 0);

            // ใส่บรรทัดสรุปทีม (หัวข้อใหญ่)
            excelData.push([
                `[สรุป] ${teamName}`,
                'รวมทั้งหมดในทีม',
                '',
                teamTarget,
                teamActual,
                `${teamPct}%`,
                teamInt,
                teamEco,
                teamRet,
                teamFuz,
                teamSuccess,
                teamFail
            ]);

            // เรียงที่ทำการภายใต้ทีมตามรหัสไปรษณีย์
            offices.sort((a, b) => parseInt(a.zip) - parseInt(b.zip));

            // ใส่บรรทัดที่ทำการย่อย
            offices.forEach(o => {
                const pct = o.target > 0 ? Math.round((o.actual / o.target) * 100) : (o.actual > 0 ? 100 : 0);
                excelData.push([
                    teamName,
                    o.name,
                    o.zip,
                    o.target || 0,
                    o.actual || 0,
                    `${pct}%`,
                    o.groups['ขร'] || 0,
                    o.groups['ขล'] || 0,
                    o.groups['ขป'] || 0,
                    o.groups['fuze'] || 0,
                    o.success || 0,
                    o.fail || 0
                ]);
            });

            // ใส่บรรทัดว่าง 1 บรรทัด เพื่อเว้นระยะระหว่างทีม ให้อ่านง่าย
            excelData.push(['', '', '', '', '', '', '', '', '', '', '', '']);
        });

        if (excelData.length <= 1) {
            Swal.fire('ข้อผิดพลาด', 'ไม่มีข้อมูลสำหรับการดาวน์โหลด', 'warning');
            return;
        }

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(excelData);

        // กำหนดความกว้างของคอลัมน์ (Column Widths)
        ws['!cols'] = [
            { wch: 25 }, // ทีม
            { wch: 35 }, // ที่ทำการ
            { wch: 15 }, // รหัสไปรษณีย์
            { wch: 15 }, // เป้าหมาย
            { wch: 20 }, // ยอดเข้าพบจริง
            { wch: 12 }, // % เข้าพบ
            { wch: 15 }, // ระหว่างประเทศ
            { wch: 15 }, // e-Commerce
            { wch: 25 }, // ไปรษณียภัณฑ์/การเงิน/ค้าปลีก
            { wch: 12 }, // Fuze Post
            { wch: 10 }, // ปิดได้
            { wch: 12 }  // ปิดไม่ได้
        ];

        XLSX.utils.book_append_sheet(wb, ws, "สรุปรายทีม");

        const date = new Date();
        const timestamp = date.getFullYear() + String(date.getMonth() + 1).padStart(2, '0') + String(date.getDate()).padStart(2, '0');

        XLSX.writeFile(wb, `Team_Summary_${monthLabel}_${timestamp}.xlsx`);
    };

    // ==========================================
    // ฟังก์ชัน Export ข้อมูลสรุปรายที่ทำการเป็น Excel (ใหม่)
    // ==========================================
    window.exportPopupOfficeSummaryToExcel = function () {
        if (!window.currentPopupOfficeList || window.currentPopupOfficeList.length === 0) {
            Swal.fire('ข้อผิดพลาด', 'ไม่มีข้อมูลสำหรับดาวน์โหลด', 'warning');
            return;
        }

        // กรองเอาเฉพาะที่ทำการที่มีเป้าหมายหรือมียอดเข้าพบจริง
        const data = [...window.currentPopupOfficeList].filter(o => o.actual > 0 || o.target > 0);

        // เรียงลำดับตามรหัสไปรษณีย์จากน้อยไปมาก

        const monthLabel = window.currentPopupMonthLabel || 'เดือน';

        // Header
        excelData.push([
