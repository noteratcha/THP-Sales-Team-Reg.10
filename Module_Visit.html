<!-- PAGE: FORM -->
<div id="page-form" class="hidden animate-fade-in w-full pb-10">
    <div class="bg-white custom-radius shadow-xl overflow-hidden border-t-4 border-theme-orange max-w-5xl mx-auto">
        <div class="p-4 sm:p-8">
            <form id="mainForm" onsubmit="handleSave(event)">
                <input type="hidden" id="officeRegion" value="ปข.10">
                <input type="hidden" id="officeName">
                <input type="hidden" id="zipCode">
                <input type="hidden" id="salesName">

                <div class="mb-6">
                    <label class="form-label">1. หัวข้อเรื่อง *</label>
                    <select id="subject" class="form-input bg-white font-sans" required>
                        <option value="" disabled selected>- กรุณาเลือก -</option>
                        <option value="ติดตามลูกค้าใหม่">ติดตามลูกค้าใหม่</option>
                        <option value="นัดโทรหาลูกค้า">นัดโทรหาลูกค้า</option>
                        <option value="ส่งใบเสนอราคา">ส่งใบเสนอราคา</option>
                        <option value="ติดตามลูกค้าที่หายไป">ติดตามลูกค้าที่หายไป</option>
                        <option value="ติดตามลูกค้าที่หายไป (ปก.)">ติดตามลูกค้าที่หายไป (ปก.)</option>
                        <option value="เข้าพบลูกค้ารายเดือน">เข้าพบลูกค้ารายเดือน</option>
                        <option value="ติดตามลูกค้ารายสำคัญ">ติดตามลูกค้ารายสำคัญ</option>
                        <option value="การติดตามผลจากการสนทนาก่อนหน้านี้">การติดตามผลจากการสนทนาก่อนหน้านี้</option>
                    </select>
                </div>
                <div class="mb-6"><label class="form-label">2. กลุ่มลูกค้า *</label>
                    <div class="checkbox-group grid grid-cols-1 md:grid-cols-2 gap-2"><label><input type="checkbox"
                                name="customerGroup" value="ระหว่างประเทศ (ขร.)"> ระหว่างประเทศ</label><label><input
                                type="checkbox" name="customerGroup" value="ไปรษณียภัณฑ์/การเงิน/ค้าปลีก (ขป.)">
                            ไปรษณียภัณฑ์/การเงิน/ค้าปลีก</label><label><input type="checkbox" name="customerGroup"
                                value="e-Commerce (ขล.)"> e-Commerce</label><label><input type="checkbox"
                                name="customerGroup" value="Fuze Post"> Fuze Post</label></div>
                </div>

                <div class="mb-6 relative">
                    <label class="form-label">3. ชื่อ-นามสกุล ผู้ประกอบการ *</label>
                    <input type="text" id="entrepreneurName" class="form-input font-sans" autocomplete="off" required>
                    <div id="pkCustomerDropdown"
                        class="hidden absolute z-50 w-full bg-white border border-gray-200 rounded-lg shadow-xl mt-1 max-h-60 overflow-y-auto custom-scrollbar">
                    </div>
                </div>

                <div class="mb-6"><label class="form-label">4. เบอร์โทรศัพท์ ผู้ประกอบการ *</label><input type="tel"
                        id="entrepreneurPhone" class="form-input font-sans" required oninput="validatePhone(this)"
                        maxlength="10"></div>

                <div class="mb-6">
                    <label class="form-label">5. ประเภทสินค้า *</label>
                    <input type="text" id="productType" class="form-input font-sans" list="productTypeList"
                        placeholder="ระบุหรือเลือกประเภทสินค้า" required>
                    <datalist id="productTypeList"></datalist>
                </div>

                <div class="mb-6">
                    <label class="form-label">6. ช่องทางการจำหน่าย *</label>
                    <input type="text" id="salesChannel" class="form-input font-sans" list="salesChannelList"
                        placeholder="ระบุหรือเลือกช่องทางการจำหน่าย" required>
                    <datalist id="salesChannelList"></datalist>
                </div>

                <div class="mb-6">
                    <label class="form-label">7. ปริมาณชิ้นงานฝากส่ง (ชิ้น/เดือน) *</label>
                    <select id="shippingVolume" class="form-input bg-white font-sans" required>
                        <option value="" disabled selected>- กรุณาเลือก -</option>
                        <option value="0 - 49">0 - 49</option>
                        <option value="50 - 99">50 - 99</option>
                        <option value="100 - 199">100 - 199</option>
                        <option value="200 - 999">200 - 999</option>
                        <option value="1,000 - 3,999">1,000 - 3,999</option>
                        <option value="4,000 - 5,999">4,000 - 5,999</option>
                        <option value="6,000 - 7,999">6,000 - 7,999</option>
                        <option value="8,000 - 9,999">8,000 - 9,999</option>
                        <option value="10,000 ขึ้นไป">10,000 ขึ้นไป</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="form-label">8. ผู้ขนส่งที่ใช้ปัจจุบัน *</label>
                    <input type="text" id="currentCarrier" class="form-input font-sans" list="currentCarrierList"
                        placeholder="ระบุหรือเลือกผู้ขนส่ง" required>
                    <datalist id="currentCarrierList"></datalist>
                </div>

                <div class="mb-6">
                    <label class="form-label">9. สิ่งที่ลูกค้าต้องการรับสนับสนุน *</label>
                    <input type="text" id="needs" class="form-input font-sans" list="needsList"
                        placeholder="ระบุบริการที่นำเสนอ หรือ สิ่งที่ลูกค้าต้องการรับสนับสนุน" required>
                    <datalist id="needsList"></datalist>
                </div>

                <div class="mb-6">
                    <label class="form-label">10. ปัญหาที่พบระหว่างการแนะนำบริการ</label>
                    <input type="text" id="problems" class="form-input font-sans" list="problemsList"
                        placeholder="ระบุปัญหา (ไม่ระบุก็ได้)">
                    <datalist id="problemsList"></datalist>
                </div>

                <div class="mb-6">
                    <label class="form-label">11. ข้อเสนอแนะของปัญหาที่พบ</label>
                    <input type="text" id="suggestions" class="form-input font-sans" list="suggestionsList"
                        placeholder="ระบุข้อเสนอแนะ (ไม่ระบุก็ได้)">
                    <datalist id="suggestionsList"></datalist>
                </div>

                <div class="mb-6"><label class="form-label">12. Post Family</label>
                    <div class="radio-group flex gap-6"><label><input type="radio" name="postFamilyStatus"
                                value="ไม่เป็นสมาชิก" onclick="togglePostFamily(false)" checked>
                            ไม่เป็นสมาชิก</label><label><input type="radio" name="postFamilyStatus" value="เป็นสมาชิก"
                                onclick="togglePostFamily(true)"> เป็นสมาชิก</label></div>
                    <div id="postFamilyIDWrapper" class="hidden mt-2"><input type="text" id="postFamilyID"
                            class="form-input font-sans" placeholder="THP-XXXXXXXX" oninput="validatePostFamily(this)"
                            maxlength="12"></div>
                </div>

                <div class="mb-6">
                    <label class="form-label">13. ผลการนำเสนอบริการ *</label>
                    <div class="radio-group flex gap-6">
                        <label><input type="radio" name="offerResult" value="ปิดไม่ได้" required> ปิดไม่ได้</label>
                        <label><input type="radio" name="offerResult" value="ปิดได้" required> ปิดได้</label>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="form-label">14. บริการที่แนะนำ *</label>
                    <select id="recommendedService" class="form-input bg-white font-sans" required>
                        <option value="" disabled selected>- กรุณาเลือก -</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="form-label">15. สาเหตุที่ยอดขายลดลงหรือลูกค้าหายไป</label>
                    <select id="lostReason" class="form-input bg-white font-sans"
                        onchange="toggleLostReasonOther(this.value === 'อื่น ๆ')">
                        <option value="" selected>- เลือกสาเหตุ -</option>
                        <option value="ราคาคู่แข่งต่ำกว่า คู่แข่งมอบสิทธิประโยชน์,สนับสนุนอุปกรณ์การฝากส่งดีกว่า">
                            ราคาคู่แข่งต่ำกว่า คู่แข่งมอบสิทธิประโยชน์,สนับสนุนอุปกรณ์การฝากส่งดีกว่า</option>
                        <option value="คุณภาพบริการ (สิ่งของแตกหัก เสียหาย สูญหายบ่อยครั้ง )">คุณภาพบริการ
                            (สิ่งของแตกหัก เสียหาย สูญหายบ่อยครั้ง )</option>
                        <option value="เลิกกิจการ">เลิกกิจการ</option>
                        <option value="เสียชีวิต">เสียชีวิต</option>
                        <option value="เปลี่ยนที่อยู่">เปลี่ยนที่อยู่</option>
                        <option value="ติดต่อไม่ได้">ติดต่อไม่ได้</option>
                        <option value="ฝากส่งตามฤดูกาล (seasonal)/ไม่ได้ส่งเป็นประจำ">ฝากส่งตามฤดูกาล
                            (seasonal)/ไม่ได้ส่งเป็นประจำ</option>
                        <option value="กิจการลูกค้ามีออเดอร์ลดลง">กิจการลูกค้ามีออเดอร์ลดลง</option>
                        <option value="ลูกค้าเป็นเจ้าหน้าที่บริษัทฯ ลาออกจากงานแล้ว">ลูกค้าเป็นเจ้าหน้าที่บริษัทฯ
                            ลาออกจากงานแล้ว</option>
                        <option value="ทดลองฝากส่งระยะแรกและไม่พึงพอใจในระบบงาน">
                            ทดลองฝากส่งระยะแรกและไม่พึงพอใจในระบบงาน</option>
                        <option value="สิ่งของต้องห้ามส่งทางไปรษณีย์หรือสิ่งของผิดกฎหมาย (Grey Area)">
                            สิ่งของต้องห้ามส่งทางไปรษณีย์หรือสิ่งของผิดกฎหมาย (Grey Area)</option>
                        <option value="สิ่งของติดภาษีอากรปลายทาง">สิ่งของติดภาษีอากรปลายทาง</option>
                        <option value="สิ่งของที่ฝากส่งเกินหลักเกณฑ์ที่กำหนด (เช่น Dimension เกินกำหนด เป็นต้น)">
                            สิ่งของที่ฝากส่งเกินหลักเกณฑ์ที่กำหนด (เช่น Dimension เกินกำหนด เป็นต้น)</option>
                        <option value="ลูกค้าเปลี่ยนไปใช้บริการที่ราคาต่อชิ้นถูกลง/ปณท กำหนดราคาต่อชิ้นเพิ่มขึ้น">
                            ลูกค้าเปลี่ยนไปใช้บริการที่ราคาต่อชิ้นถูกลง/ปณท กำหนดราคาต่อชิ้นเพิ่มขึ้น</option>
                        <option value="Marketplace Platform ปิดกั้น/ซ่อน การเลือก ปณท เป็นผู้ฝากส่ง">Marketplace
                            Platform ปิดกั้น/ซ่อน การเลือก ปณท เป็นผู้ฝากส่ง</option>
                        <option value="หลักเกณฑ์การให้ส่วนลดอ้างอิงชิ้นงานสูง/คู่แข่งมีหลักเกณฑ์ที่ยืดหยุ่นมากกว่า">
                            หลักเกณฑ์การให้ส่วนลดอ้างอิงชิ้นงานสูง/คู่แข่งมีหลักเกณฑ์ที่ยืดหยุ่นมากกว่า</option>
                        <option value="เปลี่ยนการฝากส่งไปใช้ชื่อบัญชีอื่น">เปลี่ยนการฝากส่งไปใช้ชื่อบัญชีอื่น</option>
                        <option value="ข้อมูลนำเข้า Salesforce ไม่ครบถ้วน">ข้อมูลนำเข้า Salesforce ไม่ครบถ้วน</option>
                        <option value="มีการแบ่งส่งไปยังคู่แข่งมากขึ้น">มีการแบ่งส่งไปยังคู่แข่งมากขึ้น</option>
                        <option value="มีการแบ่งส่งไปยัง ปณ. อื่น">มีการแบ่งส่งไปยัง ปณ. อื่น</option>
                        <option value="อื่น ๆ">อื่น ๆ</option>
                    </select>
                    <div id="lostReasonOtherWrapper" class="hidden mt-2">
                        <input type="text" id="lostReasonOther" class="form-input font-sans"
                            placeholder="โปรดระบุสาเหตุอื่น ๆ">
                    </div>
                </div>

                <div class="mb-6 border border-gray-100 p-4 rounded-xl bg-gray-50/50 relative">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                        <label class="form-label mb-0">16. รูปภาพการเข้าพบลูกค้า *</label>
                        <button type="button" onclick="openMergeModal()"
                            class="text-[10px] bg-blue-50 text-blue-600 hover:bg-blue-500 hover:text-white border border-blue-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm font-medium">
                            <i class="fas fa-layer-group"></i> รวมรูปภาพ
                        </button>
                    </div>

                    <div class="flex items-center justify-center w-full">
                        <label id="dropZone" for="imageUpload"
                            class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-white hover:bg-gray-50 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <i class="fas fa-cloud-upload-alt text-2xl text-gray-500 mb-2"></i>
                                <p class="text-sm text-gray-500">คลิกหรือลากไฟล์มาวาง</p>
                            </div>
                            <input id="imageUpload" type="file" class="hidden" accept="image/*"
                                onchange="previewImage(this)" />
                        </label>
                    </div>
                    <div id="imagePreviewContainer" class="hidden mt-4 text-center relative w-fit mx-auto">
                        <img id="imagePreview"
                            class="max-h-48 rounded-lg shadow-md border border-gray-200 object-contain" src="">
                        <button type="button" onclick="removeImage()"
                            class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg hover:bg-red-600 transition">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button type="button" onclick="resetForm()"
                        class="mr-4 px-6 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">ล้างข้อมูล</button>
                    <button type="submit" id="btnSave"
                        class="px-8 py-2 rounded-lg bg-theme-orange text-white font-bold hover:bg-orange-600 shadow-lg transform active:scale-95 transition">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- PAGE: DATA -->
<div id="page-data" class="hidden animate-fade-in w-full pb-10">
    <div
        class="bg-white p-5 rounded-2xl shadow-md border border-gray-150/80 mb-6 w-full focus-within:shadow-lg focus-within:border-theme-orange/20 transition-all duration-300">
        <div
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 border-b border-gray-100 pb-3">
            <div class="cursor-pointer group" onclick="document.getElementById('visitFiltersContainer').classList.toggle('hidden'); this.querySelector('.fa-chevron-up').classList.toggle('rotate-180')">
                <h4 class="text-base sm:text-lg font-bold text-gray-800 flex items-center gap-2 group-hover:text-theme-orange transition-colors"><span
                        class="bg-theme-black text-white p-1.5 rounded-lg text-xs shadow-sm"><i
                            class="fas fa-filter"></i></span> ตัวกรองข้อมูล <i class="fas fa-chevron-up text-gray-400 text-sm ml-1 transition-transform duration-300"></i></h4>
                <p class="text-[10px] sm:text-xs text-gray-400 mt-0.5 group-hover:text-gray-500 transition-colors">
                    จำกัดขอบเขตข้อมูลการเข้าพบลูกค้าที่คุณต้องการตรวจสอบ (คลิกเพื่อซ่อน/แสดง)</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="loadVisitData()"
                    class="text-xs bg-theme-green hover:bg-green-400 text-theme-black px-4 py-2 rounded-full font-bold shadow-sm transition transform hover:scale-105 active:scale-98 flex items-center gap-1.5 cursor-pointer border-0"><i
                        class="fas fa-sync-alt"></i> รีเฟรช</button>
                <button onclick="resetVisitFilters()"
                    class="text-xs bg-red-50 hover:bg-red-500 text-red-600 hover:text-white border border-red-100 hover:border-red-500 px-4 py-2 rounded-full font-bold shadow-sm transition transform hover:scale-105 active:scale-98 flex items-center gap-1.5 cursor-pointer"><i
                        class="fas fa-times-circle"></i> ล้างตัวกรอง</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4" id="visitFiltersContainer">
            <!-- Date Range Filter -->
            <div class="group-filter flex flex-col justify-end col-span-1 sm:col-span-2 md:col-span-2 lg:col-span-2">
                <label class="text-[10px] font-bold text-gray-400 mb-1.5 block uppercase tracking-wider"><i
                        class="far fa-calendar-alt text-theme-orange mr-1"></i> ช่วงวันที่</label>
                <div class="flex flex-col sm:flex-row items-center gap-2">
                    <input type="date" id="filterDateStart" onchange="updateDateDisplay(this); applyFilters()"
                        class="w-full text-xs p-2 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-1 focus:ring-theme-orange/40 focus:border-theme-orange transition outline-none font-sans custom-date-th"
                        data-date="วว/ดด/ปปปป">
                    <span class="text-gray-400 text-xs font-light hidden sm:inline">-</span>
                    <input type="date" id="filterDateEnd" onchange="updateDateDisplay(this); applyFilters()"
                        class="w-full text-xs p-2 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-1 focus:ring-theme-orange/40 focus:border-theme-orange transition outline-none font-sans custom-date-th"
                        data-date="วว/ดด/ปปปป">
                </div>
            </div>

            <!-- Customer Name Filter [NEW] -->
            <div class="group-filter">
                <label class="text-[10px] font-bold text-gray-400 mb-1.5 block uppercase tracking-wider"><i
                        class="fas fa-user-tie text-theme-orange mr-1"></i> ชื่อลูกค้า</label>
                <input type="text" id="filterCustomer" oninput="applyFilters()" placeholder="ระบุชื่อลูกค้า"
                    class="w-full text-xs p-2 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-1 focus:ring-theme-orange/40 focus:border-theme-orange transition outline-none font-sans">
            </div>

            <!-- Subject Filter Dropdown -->
            <div class="group-filter relative">
                <label class="text-[10px] font-bold text-gray-400 mb-1.5 block uppercase tracking-wider"><i
                        class="fas fa-handshake text-theme-orange mr-1"></i> หัวข้อการพบ</label>
                <button type="button" id="filterSubjectBtn" onclick="toggleDropdown('filterSubjectDropdown')"
                    class="w-full text-xs p-2 border border-gray-200 rounded-lg bg-gray-50 hover:bg-white text-left flex justify-between items-center relative focus:ring-1 focus:ring-theme-orange/40 focus:border-theme-orange outline-none transition cursor-pointer">
                    <span id="filterSubjectText" class="truncate font-sans pr-4">ทั้งหมด</span>
                    <i
                        class="fas fa-chevron-down text-gray-400 text-[10px] absolute right-3 transition-transform duration-200"></i>
                </button>
                <div id="filterSubjectDropdown"
                    class="hidden absolute z-50 w-full min-w-[220px] bg-white border border-gray-200/80 rounded-xl shadow-2xl mt-1.5 max-h-60 overflow-y-auto custom-scrollbar backdrop-blur-md bg-white/95">
                    <label
                        class="flex items-center px-3 py-2.5 hover:bg-gray-50 cursor-pointer border-b border-gray-100 sticky top-0 bg-white/95 backdrop-blur z-10">
                        <input type="checkbox" value="ALL" checked onchange="toggleFilterSubjectAll(this)"
                            class="mr-2 accent-theme-orange w-3.5 h-3.5 rounded">
                        <span class="text-xs font-bold text-gray-700">เลือกทั้งหมด</span>
                    </label>
                    <label class="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer"><input type="checkbox"
                            value="ติดตามลูกค้าใหม่" checked onchange="updateFilterSubjectText()"
                            class="subj-checkbox mr-2 accent-theme-orange w-3.5 h-3.5 rounded"><span
                            class="text-xs text-gray-600">ติดตามลูกค้าใหม่</span></label>

<script>
    // 🔊 นำเข้าเสียงแจ้งเตือนจากระบบส่วนกลาง (Core Module)
    var successSound = window.successSound;
    var errorSound = window.errorSound;

    // ==========================================
    // 1. VISIT DATA GLOBALS
    // ==========================================
    var allFetchedRows = [];
    var globalAllFetchedRows = [];
    var filteredRows = [];
    let currentPage = 1;
    let rowsPerPage = 10;
    let columnToHideIndex = -1;
    let dashboardChart;

    let currentNewsData = null;
    let mergedFiles = [];
    let mergedImageElements = [];

    // 💡 ตัวแปรเก็บข้อมูลรายชื่อลูกค้า ปก.
    let pkCustomersData = [];

    // ลำดับจังหวัดสำหรับจัดกลุ่มทีม
    const PROVINCE_ORDER = [
        "ทีมศรีสะเกษ",
        "ทีมอุบลราชธานี",
        "ทีมยโสธร",
        "ทีมอำนาจเจริญ",
        "ทีมสกลนคร",
        "ทีมนครพนม",
        "ทีมมุกดาหาร",
        "ทีม ศป.อุบลราชธานี",
        "ทีม ศป.สกลนคร"
    ];

    function sortTeams(a, b) {
        const strA = String(a).trim();
        const strB = String(b).trim();
        const matchA = strA.match(/\d+$/);
        const matchB = strB.match(/\d+$/);
        const numA = matchA ? parseInt(matchA[0], 10) : 0;
        const numB = matchB ? parseInt(matchB[0], 10) : 0;
        const baseA = strA.replace(/\d+$/, '').trim();
        const baseB = strB.replace(/\d+$/, '').trim();
        const indexA = PROVINCE_ORDER.indexOf(baseA);
        const indexB = PROVINCE_ORDER.indexOf(baseB);

        if (indexA !== -1 && indexB !== -1) {
            if (indexA === indexB) return numA - numB;
            return indexA - indexB;
        }
        if (indexA !== -1) return -1;
        if (indexB !== -1) return 1;
        if (baseA === baseB) return numA - numB;
        return baseA.localeCompare(baseB, 'th');
    }

    // ==========================================
    // 2. INITIALIZATION
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        populateDatalists();
        setupVisitDragAndDrop();
        setDefaultDateRange();
        setupPKCustomerLogic();

        // ผูก Event ให้ทั้งหน้าฟอร์มหลักและหน้าต่างแก้ไข
        const subjectEl = document.getElementById('subject');
        if (subjectEl) subjectEl.addEventListener('change', () => window.updateFormValidationUI('subject'));

        const editSubjectEl = document.getElementById('editSubject');
        if (editSubjectEl) editSubjectEl.addEventListener('change', () => window.updateFormValidationUI('editSubject'));

        window.updateFormValidationUI('subject');

        checkGoogleAndLoad();
    });

    // 💡 ปรับปรุงฟังก์ชันให้รองรับทั้ง ID ของฟอร์มหลัก และฟอร์มแก้ไข
    window.updateFormValidationUI = function (triggerId) {
        const sourceEl = document.getElementById(triggerId);
        if (!sourceEl) return;
        const val = sourceEl.value;
        const isEdit = triggerId === 'editSubject';

        let reqList = [];
        const rulePK = ["1", "2", "3", "4", "5", "6", "7", "8", "13", "14", "15"];
        const ruleNormal = ["1", "2", "3", "4", "5", "6", "7", "8", "12", "13", "14", "16"];
        const normalSubjects = ["ติดตามลูกค้าใหม่", "นัดโทรหาลูกค้า", "ส่งใบเสนอราคา", "ติดตามลูกค้าที่หายไป", "เข้าพบลูกค้ารายเดือน", "ติดตามลูกค้ารายสำคัญ", "การติดตามผลจากการสนทนาก่อนหน้านี้"];

        if (val === "ติดตามลูกค้าที่หายไป (ปก.)") {
            reqList = rulePK;
        } else if (normalSubjects.includes(val)) {
            reqList = ruleNormal;
        }

        const allIds = {
            "1": "subject", "3": "entrepreneurName", "4": "entrepreneurPhone",
            "5": "productType", "6": "salesChannel", "7": "shippingVolume",
            "8": "currentCarrier", "9": "needs", "10": "problems", "11": "suggestions",
            "14": "recommendedService", "15": "lostReason"
        };

        // เลือกอัปเดตเฉพาะ Form ที่ทำงานอยู่
        for (let num in allIds) {
            const targetId = isEdit ? 'edit' + allIds[num].charAt(0).toUpperCase() + allIds[num].slice(1) : allIds[num];
            const el = document.getElementById(targetId);
            if (el) {
                if (reqList.includes(num)) el.setAttribute('required', 'required');
                else el.removeAttribute('required');
            }
        }

        // จัดการฟิลด์ประเภท Radio/Checkbox
        const offerResultName = isEdit ? 'editOfferResult' : 'offerResult';
        if (reqList.includes("13")) {
            document.querySelectorAll(`input[name="${offerResultName}"]`).forEach(el => el.setAttribute('required', 'required'));
        } else {
            document.querySelectorAll(`input[name="${offerResultName}"]`).forEach(el => el.removeAttribute('required'));
        }

        // อัปเดตเครื่องหมาย * (ดึงเฉพาะฟอร์มที่กำลังใช้งาน)
        const targetFormSelector = isEdit ? '#editForm .form-label' : '#mainForm .form-label';
        document.querySelectorAll(targetFormSelector).forEach(label => {
            let text = label.innerHTML.replace(/\s*<span.*?>.*?<\/span>/gi, '').replace(/\s*\*/g, '').trim();
            const match = text.match(/^(\d+)\./);
            if (match) {
                const num = match[1];
                if (reqList.includes(num)) {
                    label.innerHTML = text + ' <span class="text-red-500">*</span>';
                } else {
                    label.innerHTML = text;
                }
            }
        });
    }

    function checkGoogleAndLoad() {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            loadDropdownOptions();
            loadServicesDropdown();
        } else {
            setTimeout(checkGoogleAndLoad, 50);
        }
    }

    function setupPKCustomerLogic() {
        const setupForInput = (subjectId, nameId, dropdownId, phoneId, pfRadioName, pfIdInputId) => {
            const subjectEl = document.getElementById(subjectId);
            const nameEl = document.getElementById(nameId);
            const dropdown = document.getElementById(dropdownId);

            document.addEventListener('click', function (e) {
                if (nameEl && dropdown && !nameEl.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });

            if (subjectEl) {
                subjectEl.addEventListener('change', function () {
                    if (this.value === 'ติดตามลูกค้าที่หายไป (ปก.)') {
                        if (nameEl) nameEl.setAttribute('placeholder', 'พิมพ์ค้นหารายชื่อลูกค้า ปก.');
                        if (pkCustomersData.length === 0) {
                            Swal.fire({ title: 'กำลังโหลดรายชื่อลูกค้า (ปก.)...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                            google.script.run.withSuccessHandler(res => {
                                Swal.close();
                                if (res.status === 'success') { pkCustomersData = res.data; }
                                else { Swal.fire('เกิดข้อผิดพลาด', res.message, 'error'); }
                            }).getInactiveCustomersPK();
                        }
                    } else {
                        if (nameEl) nameEl.removeAttribute('placeholder');
                        if (dropdown) dropdown.classList.add('hidden');
                    }
                });
            }

            if (nameEl) {
                nameEl.addEventListener('focus', function () {
                    const subject = document.getElementById(subjectId);
                    if (subject && subject.value === 'ติดตามลูกค้าที่หายไป (ปก.)') {
                        renderPKDropdown(this.value, dropdownId, nameId);
                        if (dropdown) dropdown.classList.remove('hidden');
                    }
                });

                nameEl.addEventListener('input', function () {
                    const subject = document.getElementById(subjectId);
                    if (subject && subject.value === 'ติดตามลูกค้าที่หายไป (ปก.)') {
                        renderPKDropdown(this.value, dropdownId, nameId);
                        if (dropdown) dropdown.classList.remove('hidden');
                    }
                });

                nameEl.addEventListener('change', function () {
                    const subject = document.getElementById(subjectId);
                    if (!subject || subject.value !== 'ติดตามลูกค้าที่หายไป (ปก.)') return;

                    const selectedName = this.value.trim();
                    const customer = pkCustomersData.find(c => c.name === selectedName);

                    if (customer) {
                        if (customer.isUpdated) {
                            Swal.fire('ไม่สามารถเลือกได้', 'ลูกค้ารายนี้ได้รับการติดตามและบันทึกสาเหตุแล้ว', 'warning');
                            this.value = '';
                            return;
                        }

                        const phoneEl = document.getElementById(phoneId);
                        if (phoneEl) {
                            let phoneStr = customer.phone.replace(/[^0-9]/g, '');
                            if (phoneStr.length === 9) phoneStr = '0' + phoneStr;
                            phoneEl.value = phoneStr.substring(0, 10);
                            if (typeof validatePhone === 'function') validatePhone(phoneEl);
                        }

                        const memberCode = customer.memberCode;
                        if (memberCode && memberCode !== '-' && memberCode !== '') {
                            const radioYes = document.querySelector(`input[name="${pfRadioName}"][value="เป็นสมาชิก"]`);
                            if (radioYes) {
                                radioYes.checked = true;
                                const isEdit = subjectId === 'editSubject';
                                if (isEdit) {
                                    if (typeof toggleEditPostFamily === 'function') toggleEditPostFamily(true);
                                } else {
                                    if (typeof togglePostFamily === 'function') togglePostFamily(true);
                                }

                                const pfIdEl = document.getElementById(pfIdInputId);
                                if (pfIdEl) pfIdEl.value = memberCode.startsWith('THP-') ? memberCode : 'THP-' + memberCode;
                            }
                        }
                    }
                });
            }
        };

        setupForInput('subject', 'entrepreneurName', 'pkCustomerDropdown', 'entrepreneurPhone', 'postFamilyStatus', 'postFamilyID');
        setupForInput('editSubject', 'editEntrepreneurName', 'editPkCustomerDropdown', 'editEntrepreneurPhone', 'editPostFamilyStatus', 'editPostFamilyID');
    }

    function renderPKDropdown(filterText, dropdownId, nameInputId) {
        const dropdown = document.getElementById(dropdownId);
        if (!dropdown) return;
        dropdown.innerHTML = '';

        const userZip = (typeof currentUserInfo !== 'undefined' && currentUserInfo.zipcode) ? String(currentUserInfo.zipcode).trim() : '';
        const userRole = (typeof currentUserInfo !== 'undefined' && currentUserInfo.user) ? String(currentUserInfo.user).trim().toLowerCase() : '';
        const isAdmin = (userRole === 'admin' || userRole === 'viewer');

        let hasVisible = false;
        pkCustomersData.forEach(c => {
            if (!isAdmin && c.zipcode !== userZip) return;
            if (filterText && !c.name.toLowerCase().includes(filterText.toLowerCase())) return;

            hasVisible = true;
            const div = document.createElement('div');
            div.className = "px-4 py-2.5 border-b border-gray-50 last:border-0 truncate text-sm font-medium transition-colors ";

            if (c.isUpdated) {
                div.className += "text-gray-300 bg-gray-50 cursor-not-allowed flex justify-between items-center";
                div.innerHTML = `<span>${c.name}</span> <span class="text-[10px] text-red-400 bg-red-50 px-2 py-0.5 rounded border border-red-100"><i class="fas fa-lock mr-1"></i>อัปเดตแล้ว</span>`;
                div.onclick = function (e) { e.stopPropagation(); };
            } else {
                div.className += "text-gray-700 hover:bg-theme-orange/10 hover:text-theme-orange cursor-pointer";
                div.innerText = c.name;
                div.onclick = function (e) {
                    e.stopPropagation();

    function compressImageClientSide(file, maxWidth, maxHeight, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > height) { if (width > maxWidth) { height = Math.round(height *= maxWidth / width); width = maxWidth; } }
                    else { if (height > maxHeight) { width = Math.round(width *= maxHeight / height); height = maxHeight; } }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

    async function submitData() {
        const btn = document.getElementById('btnSave'); if (btn) btn.disabled = true;
        const getVal = (id) => { const el = document.getElementById(id); return el ? el.value : ''; }
        const getRadio = (name) => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; };
        const getChecks = (name) => { return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value).join(', '); };

        let lostReasonVal = getVal('lostReason');
        if (lostReasonVal === 'อื่น ๆ') {
            const otherVal = getVal('lostReasonOther');
            if (otherVal.trim() === '') {
                Swal.fire('แจ้งเตือน', 'กรุณาระบุสาเหตุอื่น ๆ', 'warning');
                if (btn) btn.disabled = false;
                return;
            }
            lostReasonVal = 'อื่น ๆ: ' + otherVal;
        }

        Swal.fire({ title: 'กำลังเตรียมข้อมูลรูปภาพ...', text: 'รอสักครู่ ระบบกำลังปรับขนาดให้เหมาะสม', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const fileInput = document.getElementById('imageUpload'); let fileData = ""; let fileName = "";
        if (fileInput && fileInput.files.length > 0) {
            const file = fileInput.files[0]; fileName = file.name;
            try {
                fileData = await compressImageClientSide(file, 1200, 1200, 0.7);
            } catch (err) {
                console.warn("การบีบอัดภาพล้มเหลว", err);
                fileData = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = error => reject(error); reader.readAsDataURL(file); });
            }
        }

        const payload = {
            subject: getVal('subject'),
            customerGroup: getChecks('customerGroup'),
            officeRegion: getVal('officeRegion') || 'ปข.10',
            officeName: getVal('officeName') || (typeof currentUserInfo !== 'undefined' ? currentUserInfo.name : ''),
            zipCode: getVal('zipCode') || (typeof currentUserInfo !== 'undefined' ? currentUserInfo.zipcode : ''),
            salesName: getVal('salesName') || (typeof currentUserInfo !== 'undefined' ? (currentUserInfo.team || currentUserInfo.name + " (ทีมขาย)") : ''),
            entrepreneurName: getVal('entrepreneurName'),
            entrepreneurPhone: getVal('entrepreneurPhone'),
            productType: getVal('productType'),
            salesChannel: getVal('salesChannel'),
            shippingVolume: getVal('shippingVolume'),
            currentCarrier: getVal('currentCarrier'),
            needs: getVal('needs'),
            problems: getVal('problems'),
            suggestions: getVal('suggestions'),
            postFamilyStatus: getRadio('postFamilyStatus'),
            postFamilyID: getVal('postFamilyID'),
            fileData: fileData,
            fileName: fileName,
            offerResult: getRadio('offerResult'),
            recommendedService: getVal('recommendedService'),
            lostReason: lostReasonVal
        };

        Swal.fire({ title: 'กำลังบันทึกข้อมูลลงฐานข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        google.script.run.withSuccessHandler(saveSuccess).withFailureHandler(saveFailed).saveData(payload);
    }

                html: `
                    <div class="text-left text-sm mt-2">
                        <p class="mb-2 text-red-600 font-semibold">ระบบไม่สามารถบันทึกรูปภาพได้เนื่องจากไม่ได้รับอนุญาตให้เข้าถึง Drive</p>

                            <li>หากยังพบปัญหา กรุณาติดต่อ Admin เพื่อตรวจสอบสิทธิ์</li>

                `,

            });
        } else {

<!-- 📦 Script: Script_Visit_Table.html -->
<script>
    // ==========================================
    // 4. VISIT DATA TABLE & FILTER
    // ==========================================

    function loadVisitData() {
        const tbody = document.getElementById('tableBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="100%" class="text-center py-8">กำลังโหลดข้อมูล...</td></tr>';

        const pagControls = document.getElementById('paginationControls');
        const noDataMsg = document.getElementById('noDataMessage');
        if (pagControls) pagControls.classList.add('hidden');
        if (noDataMsg) noDataMsg.classList.add('hidden');

        if (typeof showGlobalLoader === 'function') showGlobalLoader('กำลังดึงข้อมูลการเข้าพบลูกค้า...');

        google.script.run
            .withSuccessHandler((res) => {
                if (typeof hideGlobalLoader === 'function') hideGlobalLoader();
                renderTable(res);
            })
            .withFailureHandler((err) => {
                if (typeof hideGlobalLoader === 'function') hideGlobalLoader();
                dataLoadFailed(err);
            })
            .getDataForTable();

        google.script.run.withSuccessHandler(res => {
            if (res.status === 'success') {
                globalVisitTargets = res.data;
                if (typeof filteredRows !== 'undefined' && filteredRows.length > 0 && typeof updateChartFromData === 'function') {
                    updateChartFromData(filteredRows);
                }
            }
        }).getVisitTargets();
    }

    function renderTable(response) {
        if (response.status !== 'success') { dataLoadFailed(response.message); return; }
        const data = response.data;
        const theadRow = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        const noDataMsg = document.getElementById('noDataMessage');

        if (theadRow) {
            theadRow.innerHTML = '';
            const thAction = document.createElement('th'); thAction.className = "py-3 px-4 text-center font-semibold text-sm whitespace-nowrap sticky left-0 bg-theme-black z-30 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.3)]"; thAction.textContent = "จัดการ"; theadRow.appendChild(thAction);
            const thSeq = document.createElement('th'); thSeq.className = "py-3 px-4 text-left font-semibold text-sm whitespace-nowrap"; thSeq.textContent = "ลำดับที่"; theadRow.appendChild(thSeq);
            if (data.length > 0) {
                const headers = data[0]; columnToHideIndex = headers.indexOf("ปน./ปข.");
                headers.forEach((h, index) => {
                    if (index === columnToHideIndex) return;
                    const th = document.createElement('th'); th.className = "py-3 px-4 text-left font-semibold text-sm whitespace-nowrap"; th.textContent = (h === 'พนักงานขาย') ? 'ทีม' : h; theadRow.appendChild(th);
                });
            }
        }

        if (!data || data.length <= 1) {
            if (tbody) tbody.innerHTML = ''; if (noDataMsg) noDataMsg.classList.remove('hidden');
            return;
        }

        window.allFetchedRows = []; window.globalAllFetchedRows = []; const uniqueTeams = new Set();
        const currentUser = (typeof currentUserInfo !== 'undefined' && currentUserInfo.user) ? String(currentUserInfo.user).trim().toLowerCase() : '';

        for (let i = data.length - 1; i >= 1; i--) {
            const row = data[i].slice(); row.push(i + 1);
            let isAllowed = true; const rowZip = String(row[5]).trim();

            // Admin และ Viewer มองเห็นข้อมูลทั้งหมด
            if (currentUser !== 'admin' && currentUser !== 'viewer') {
                if (rowZip !== currentUser) isAllowed = false; 
            }
            if (isAllowed) { window.allFetchedRows.push(row); if (row[6]) uniqueTeams.add(String(row[6]).trim()); }
            window.globalAllFetchedRows.push(row);
        }

        const salesDropdown = document.getElementById('filterSalesDropdown');
        if (salesDropdown) {
            let salesHtml = `<label class="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer border-b border-gray-100 sticky top-0 bg-white z-10"><input type="checkbox" value="ALL" checked onchange="toggleFilterSalesAll(this)" class="mr-2 accent-theme-orange"><span class="text-xs font-bold text-gray-700">เลือกทั้งหมด</span></label>`;

            Array.from(uniqueTeams).sort(typeof sortTeams === 'function' ? sortTeams : undefined).forEach(team => {
                salesHtml += `<label class="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer"><input type="checkbox" value="${team}" checked onchange="updateFilterSalesText()" class="sales-checkbox mr-2 accent-theme-orange"><span class="text-xs text-gray-600">${team}</span></label>`;
            });
            salesDropdown.innerHTML = salesHtml;
            const filterSalesText = document.getElementById('filterSalesText'); if (filterSalesText) filterSalesText.textContent = "ทั้งหมด";
        }

        applyFilters();
        if (allFetchedRows.length > 0 && typeof populatePostNewsSelector === 'function') populatePostNewsSelector();
    }


    function getUserLocationFilter(userId) {
        if (!userId || String(userId).toLowerCase() === 'admin' || String(userId).toLowerCase() === 'viewer') return null;
        return { type: 'zipcode', value: String(userId).trim() };
    }

    window.updateDateDisplay = function (input) {
        if (input.value) {
            const parts = input.value.split('-');
            if (parts.length === 3) {
                let y = parseInt(parts[0], 10);
                let thY = y > 2500 ? y : y + 543;
                input.setAttribute('data-date', `${parts[2]}/${parts[1]}/${thY}`);
            }
        } else {
            input.setAttribute('data-date', 'วว/ดด/ปปปป');
        }
    };

    function applyFilters() {
        const dateStartEl = document.getElementById('filterDateStart'); const fDateStart = dateStartEl ? dateStartEl.value : '';
        const dateEndEl = document.getElementById('filterDateEnd'); const fDateEnd = dateEndEl ? dateEndEl.value : '';
        const selectedSubjects = Array.from(document.querySelectorAll('.subj-checkbox:checked')).map(cb => cb.value);
        const selectedGroups = Array.from(document.querySelectorAll('.cg-checkbox:checked')).map(cb => cb.value);
        const selectedSales = Array.from(document.querySelectorAll('.sales-checkbox:checked')).map(cb => cb.value);
        const zipEl = document.getElementById('filterZip'); const fZip = zipEl ? zipEl.value.toLowerCase().trim() : '';
        const customerEl = document.getElementById('filterCustomer'); const fCustomer = customerEl ? customerEl.value.toLowerCase().trim() : '';

        const allSubjChecked = document.querySelector('#filterSubjectDropdown input[value="ALL"]')?.checked;
        const allGrpChecked = document.querySelector('#filterCustomerGroupDropdown input[value="ALL"]')?.checked;
        const allSalesChecked = document.querySelector('#filterSalesDropdown input[value="ALL"]')?.checked;

        filteredRows = allFetchedRows.filter(row => {
            const dateParts = row[0].split(' ')[0].split('/');
            if (dateParts.length >= 3) {
                const rDay = parseInt(dateParts[0], 10);
                const rMonth = parseInt(dateParts[1], 10) - 1;
                let rYear = parseInt(dateParts[2], 10);
                if (rYear > 2500) rYear -= 543;
                const rowDate = new Date(rYear, rMonth, rDay);

                if (fDateStart) {
                    const sParts = fDateStart.split('-');
                    const sDate = new Date(parseInt(sParts[0]), parseInt(sParts[1]) - 1, parseInt(sParts[2]), 0, 0, 0);
                    if (rowDate < sDate) return false;
                }
                if (fDateEnd) {
                    const eParts = fDateEnd.split('-');
                    const eDate = new Date(parseInt(eParts[0]), parseInt(eParts[1]) - 1, parseInt(eParts[2]), 23, 59, 59);
                    if (rowDate > eDate) return false;
                }
            }
            if (!allSubjChecked) { if (selectedSubjects.length === 0 || !selectedSubjects.includes(String(row[1]).trim())) return false; }
            if (!allGrpChecked) {
                if (selectedGroups.length === 0) return false;
                const rowGroups = String(row[2]).split(',').map(s => s.trim());
                if (!selectedGroups.some(g => rowGroups.includes(g))) return false;
            }
            if (!allSalesChecked) { if (selectedSales.length === 0 || !selectedSales.includes(String(row[6]).trim())) return false; }
            if (fZip && !String(row[5]).toLowerCase().includes(fZip)) return false;
            if (fCustomer && !String(row[7]).toLowerCase().includes(fCustomer)) return false;
            return true;
        });

        window.filteredRows = filteredRows;

        if (typeof updateChartFromData === 'function') updateChartFromData(filteredRows);
        currentPage = 1;

        const tbody = document.getElementById('tableBody'); const noDataMsg = document.getElementById('noDataMessage'); const pagControls = document.getElementById('paginationControls');
        if (filteredRows.length === 0) {
            if (tbody) tbody.innerHTML = ''; if (noDataMsg) noDataMsg.classList.remove('hidden'); if (pagControls) pagControls.classList.add('hidden');
        } else {
            if (noDataMsg) noDataMsg.classList.add('hidden'); if (pagControls) pagControls.classList.remove('hidden'); renderPage();
        }

        // ----------------------------------------------------
        // VISUAL ACTIVE HIGHLIGHTS FOR ACTIVE FILTERS
        // ----------------------------------------------------
        const toggleHighlight = (elementId, isActive, isDropdown = false) => {
            const el = document.getElementById(elementId);
            if (el) {
                if (isActive) {
                    el.classList.add('border-theme-orange/40', 'bg-orange-50/5', 'ring-1', 'ring-theme-orange/10');
                    if (isDropdown) {
                        const icon = el.querySelector('.fa-chevron-down');
                        if (icon) icon.classList.add('text-theme-orange');
                    }
                } else {
                    el.classList.remove('border-theme-orange/40', 'bg-orange-50/5', 'ring-1', 'ring-theme-orange/10');
                    if (isDropdown) {
                        const icon = el.querySelector('.fa-chevron-down');
                        if (icon) icon.classList.remove('text-theme-orange');
                    }
                }
            }
        };

        toggleHighlight('filterDateStart', !!fDateStart);
        toggleHighlight('filterDateEnd', !!fDateEnd);
        toggleHighlight('filterCustomer', !!fCustomer);
        toggleHighlight('filterZip', !!fZip);
        toggleHighlight('filterSubjectBtn', !allSubjChecked, true);
        toggleHighlight('filterSalesBtn', !allSalesChecked, true);
        toggleHighlight('filterCustomerGroupBtn', !allGrpChecked, true);
    }

    window.resetVisitFilters = function () {
        if (typeof setDefaultDateRange === 'function') setDefaultDateRange();

        const zipInput = document.getElementById('filterZip');
        if (zipInput) zipInput.value = '';

        const customerInput = document.getElementById('filterCustomer');
        if (customerInput) customerInput.value = '';

        const resetDropdown = (dropdownId, checkboxClass, textId) => {
            const dd = document.getElementById(dropdownId);
            if (dd) {
                const allCb = dd.querySelector('input[value="ALL"]');
                if (allCb) allCb.checked = true;
                dd.querySelectorAll(checkboxClass).forEach(cb => cb.checked = true);
                const textEl = document.getElementById(textId);
                if (textEl) textEl.textContent = 'ทั้งหมด';
            }
        };

        resetDropdown('filterSubjectDropdown', '.subj-checkbox', 'filterSubjectText');
        resetDropdown('filterSalesDropdown', '.sales-checkbox', 'filterSalesText');
        resetDropdown('filterCustomerGroupDropdown', '.cg-checkbox', 'filterCustomerGroupText');

        applyFilters();
    };

    function toggleFilterSalesAll(source) { document.querySelectorAll('.sales-checkbox').forEach(cb => cb.checked = source.checked); updateFilterSalesText(); }
    function updateFilterSalesText() { updateFilterTextGeneral('filterSalesDropdown', '.sales-checkbox', 'filterSalesText'); applyFilters(); }
    function toggleFilterSubjectAll(source) { document.querySelectorAll('.subj-checkbox').forEach(cb => cb.checked = source.checked); updateFilterSubjectText(); }
    function updateFilterSubjectText() { updateFilterTextGeneral('filterSubjectDropdown', '.subj-checkbox', 'filterSubjectText'); applyFilters(); }
    function toggleFilterCustomerGroupAll(source) { document.querySelectorAll('.cg-checkbox').forEach(cb => cb.checked = source.checked); updateFilterCustomerGroupText(); }
    function updateFilterCustomerGroupText() { updateFilterTextGeneral('filterCustomerGroupDropdown', '.cg-checkbox', 'filterCustomerGroupText'); applyFilters(); }

    function updateFilterTextGeneral(dropdownId, checkboxClass, textId) {
        const dropdown = document.getElementById(dropdownId); if (!dropdown) return;
        const allCb = dropdown.querySelector('input[value="ALL"]'); const checkboxes = dropdown.querySelectorAll(checkboxClass);
        const checked = Array.from(checkboxes).filter(cb => cb.checked);
        if (checked.length === checkboxes.length && checkboxes.length > 0) { if (allCb) allCb.checked = true; } else { if (allCb) allCb.checked = false; }
        const btnText = document.getElementById(textId);
        if (btnText) {
            if (allCb && allCb.checked) btnText.textContent = "ทั้งหมด";
            else if (checked.length === 0) btnText.textContent = "ไม่ได้เลือก";
            else if (checked.length === 1) btnText.textContent = checked[0].nextElementSibling ? checked[0].nextElementSibling.textContent.trim() : checked[0].value;
            else btnText.textContent = `${checked.length} รายการ`;
        }
    }

    window.addEventListener('click', function (e) {
        const dropdowns = ['filterCustomerGroupDropdown', 'filterSalesDropdown', 'filterSubjectDropdown'];
        const btns = ['filterCustomerGroupBtn', 'filterSalesBtn', 'filterSubjectBtn'];
        dropdowns.forEach((ddId, index) => {
            const dd = document.getElementById(ddId); const btn = document.getElementById(btns[index]);
            if (btn && dd && !btn.contains(e.target) && !dd.contains(e.target)) dd.classList.add('hidden');
        });
    });

    function renderPage() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;

        tbody.innerHTML = '';
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = filteredRows.slice(startIndex, endIndex);

        const fragment = document.createDocumentFragment();

        pageData.forEach((rowData, index) => {
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-100 hover:bg-green-50 transition group";
            const sheetRowIndex = rowData[rowData.length - 1];
            const bgClass = (index % 2 === 1) ? "bg-[#f9fafb]" : "bg-white";
            const tdAction = document.createElement('td');
            tdAction.className = `py-3 px-4 text-center whitespace-nowrap sticky left-0 ${bgClass} group-hover:bg-green-50 transition border-r border-gray-100 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]`;

            const absoluteIndex = startIndex + index;
            const currentUserStr = (typeof currentUserInfo !== 'undefined' && currentUserInfo.user) ? String(currentUserInfo.user).trim().toLowerCase() : '';

            const isViewer = currentUserStr === 'viewer';
            const isOwner = currentUserStr === 'admin' || String(rowData[5]).trim() === currentUserStr;

            let actionButtons = '';

            if (isViewer) {
                actionButtons += `<button disabled class="text-gray-300 p-2 rounded-lg cursor-not-allowed" title="ไม่มีสิทธิ์ใช้งาน (Viewer)"><i class="fas fa-newspaper"></i></button>`;
                actionButtons += `<button disabled class="text-gray-300 p-2 rounded-lg cursor-not-allowed" title="ไม่มีสิทธิ์แก้ไข (Viewer)"><i class="fas fa-edit"></i></button>
                                  <button disabled class="text-gray-300 p-2 rounded-lg cursor-not-allowed" title="ไม่มีสิทธิ์ลบ (Viewer)"><i class="fas fa-trash-alt"></i></button>`;
            } else {
                actionButtons += `<button onclick="jumpToPostNews(${sheetRowIndex}, window.filteredRows[${absoluteIndex}])" class="text-green-600 hover:bg-green-100 p-2 rounded-lg transition" title="สร้างภาพข่าว (Post News)"><i class="fas fa-newspaper"></i></button>`;

                if (isOwner) {
                    actionButtons += `<button onclick="openEditModal(${sheetRowIndex}, window.filteredRows[${absoluteIndex}])" class="text-blue-500 hover:bg-blue-100 p-2 rounded-lg transition" title="แก้ไข"><i class="fas fa-edit"></i></button>
                                      <button onclick="confirmDelete(${sheetRowIndex})" class="text-red-500 hover:bg-red-100 p-2 rounded-lg transition" title="ลบ"><i class="fas fa-trash-alt"></i></button>`;
                } else {
                    actionButtons += `<button disabled class="text-gray-300 p-2 rounded-lg cursor-not-allowed" title="ไม่มีสิทธิ์แก้ไข"><i class="fas fa-edit"></i></button>
                                      <button disabled class="text-gray-300 p-2 rounded-lg cursor-not-allowed" title="ไม่มีสิทธิ์ลบ"><i class="fas fa-trash-alt"></i></button>`;
                }
            }
            tdAction.innerHTML = `<div class="flex items-center justify-center gap-1">${actionButtons}</div>`;
            tr.appendChild(tdAction);

            const tdSeq = document.createElement('td');
            tdSeq.className = "py-3 px-4 text-sm text-gray-700 whitespace-nowrap font-semibold text-theme-orange";
            tdSeq.textContent = absoluteIndex + 1;
            tr.appendChild(tdSeq);

            for (let cellIndex = 0; cellIndex < rowData.length - 1; cellIndex++) {
                if (cellIndex === columnToHideIndex) continue;
                const cell = rowData[cellIndex];
                const td = document.createElement('td');
                td.className = "py-3 px-4 text-sm text-gray-700 whitespace-nowrap";
                if (typeof cell === 'string' && cell.startsWith('http')) {
                    td.innerHTML = `<a href="${cell}" target="_blank" class="text-theme-orange underline hover:text-orange-600"><i class="fas fa-image"></i> ดูรูป</a>`;
                } else {
                    td.textContent = cell;
                }
                tr.appendChild(td);
            }

            fragment.appendChild(tr);
        });

        tbody.appendChild(fragment);
        updatePaginationControls();
    }

    function updatePaginationControls() {
        const totalRows = filteredRows.length; const totalPages = Math.ceil(totalRows / rowsPerPage);
        const startRange = totalRows === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1; const endRange = Math.min(currentPage * rowsPerPage, totalRows);
        const pageInfoEl = document.getElementById('pageInfo'); if (pageInfoEl) pageInfoEl.innerText = `แสดง ${startRange.toLocaleString()} ถึง ${endRange.toLocaleString()} จาก ${totalRows.toLocaleString()} รายการ`;
        const btnPrev = document.getElementById('btnPrev'); const btnNext = document.getElementById('btnNext');
        if (btnPrev) btnPrev.disabled = currentPage === 1; if (btnNext) btnNext.disabled = currentPage === totalPages || totalPages === 0;
    }

    window.changePage = function (direction) { currentPage += direction; renderPage(); }
    window.changeVisitRowsPerPage = function (val) { rowsPerPage = parseInt(val); currentPage = 1; renderPage(); }

    window.exportVisitDataToExcel = function () {
        if (!filteredRows || filteredRows.length === 0) { Swal.fire('ไม่มีข้อมูล', 'ไม่มีข้อมูลสำหรับดาวน์โหลด กรุณาตรวจสอบเงื่อนไขการกรอง', 'warning'); return; }
        const exportHeaders = ['วันที่', 'หัวข้อเรื่อง', 'กลุ่มลูกค้า', 'สำนักงาน (ปข./ปน.)', 'ชื่อที่ทำการ', 'รหัสไปรษณีย์', 'ทีม/พนักงานขาย', 'ชื่อผู้ประกอบการ', 'เบอร์โทรศัพท์', 'ประเภทสินค้า', 'ช่องทางการจำหน่าย', 'ปริมาณการจัดส่ง', 'ผู้ขนส่งปัจจุบัน', 'สิ่งที่ต้องการ', 'ปัญหา', 'ข้อเสนอแนะ', 'สถานะ Post Family', 'เลข Post Family', 'ลิงก์รูปภาพ', 'ผลการนำเสนอ', 'บริการที่แนะนำ', 'สาเหตุที่ยอดลดลง'];
        const exportData = filteredRows.map((row) => { let r = [...row]; r.pop(); if (r[8]) r[8] = String(r[8]).replace(/^'/, ""); return r; });
        const ws = XLSX.utils.aoa_to_sheet([exportHeaders, ...exportData]);
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Visit Data");
        const d = new Date(); const fileName = `ข้อมูลการเข้าพบลูกค้า_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.xlsx`;
        XLSX.writeFile(wb, fileName);
    }

    function dataLoadFailed(error) { const tbody = document.getElementById('tableBody'); if (tbody) tbody.innerHTML = `<tr><td colspan="100%" class="text-center py-4 text-red-500">Error: ${error}</td></tr>`; }

    // ==========================================
    // 6. EDIT MODAL LOGIC
    // ==========================================
    window.toggleEditLostReasonOther = function (show) {
        const wrapper = document.getElementById('editLostReasonOtherWrapper');
        const input = document.getElementById('editLostReasonOther');
        if (show) { wrapper.classList.remove('hidden'); }
        else { wrapper.classList.add('hidden'); input.value = ''; }
    }

    window.openEditModal = function (sheetRowIndex, rowData) {
        const trySetInput = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; }

    window.compressImageClientSide = function (file, maxWidth, maxHeight, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > height) { if (width > maxWidth) { height = Math.round(height *= maxWidth / width); width = maxWidth; } }
                    else { if (height > maxHeight) { width = Math.round(width *= maxHeight / height); height = maxHeight; } }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

<script>

    function updateChartFromData(dataRows) {
        const salesStats = {};
        const allSalesNames = new Set();

        for (let i = 0; i < dataRows.length; i++) {
            const row = dataRows[i];
            const salesName = String(row[6]).trim() || 'Unknown';
            allSalesNames.add(salesName);
            try {
                const datePart = row[0].split(' ')[0];
                const parts = datePart.split('/');
                if (parts.length >= 3) {
                    const month = parseInt(parts[1]);
                    const year = parseInt(parts[2]);
                    const group = String(row[2] || '').trim();
                    let ecomCount = 0;
                    if (group.includes('e-Commerce')) ecomCount++;
                    if (group.includes('ไปรษณียภัณฑ์')) ecomCount++;
                    let interCount = group.includes('ระหว่างประเทศ') ? 1 : 0;
                    let fuzeCount = group.includes('Fuze') ? 1 : 0;
                    let totalCount = ecomCount + interCount + fuzeCount;
                    if (totalCount === 0) totalCount = 1;

                    const key = `${month}/${year}`;
                    if (!salesStats[key]) salesStats[key] = {};
                    salesStats[key][salesName] = (salesStats[key][salesName] || 0) + totalCount;
                }
            } catch (e) { }
        }

        const sortedKeys = Object.keys(salesStats).sort((a, b) => {
            const [m1, y1] = a.split('/').map(Number);
            const [m2, y2] = b.split('/').map(Number);
            return (y1 - y2) || (m1 - m2);
        });

        let maxStackValue = 0;
        sortedKeys.forEach(k => {
            let stackSum = 0;
            Array.from(allSalesNames).forEach(salesName => { stackSum += (salesStats[k][salesName] || 0); });
            if (stackSum > maxStackValue) maxStackValue = stackSum;
        });

        const ySuggestedMax = maxStackValue > 0 ? Math.ceil(maxStackValue * 1.3) : 10;
        const labels = sortedKeys.map(k => {
            const [m, y] = k.split('/');
            return `${["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."][m - 1]} ${y}`;
        });

        const extendedColors = [
            '#e27d3d', '#062e21', '#93e9be', '#3b82f6', '#8b5cf6',
            '#ec4899', '#ef4444', '#f59e0b', '#10b981', '#06b6d4',
            '#6366f1', '#d946ef', '#f43f5e', '#84cc16', '#14b8a6',
            '#0284c7', '#4f46e5', '#c026d3', '#e11d48', '#ea580c',

        ];
