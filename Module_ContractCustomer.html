                    '<span class="cc-note">' + (it.src === 'list' ? 'ชีตรายชื่อแถว ' + it.listRow : 'ทะเบียนแถว ' + it.rowNo) + ' · บันทึกเมื่อ ' + esc(v['บันทึกเมื่อ'] || '-') + ' · ช่องที่เว้นว่างไม่เขียนทับข้อมูลเดิมในชีต</span></div></div>';
            }).join('');
            el.querySelectorAll('.cc-found').forEach(function (c) { setupManual(c, true); });
        };

        // ===== เพิ่มไฟล์แนบ: อัปโหลดทีละไฟล์ → Drive + ชิปในคอลัมน์ R =====
        var MIME_BY_EXT = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', doc: 'application/msword',
            docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
        var readB64 = function (file) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1] || ''); }; r.onerror = function () { no(r.error); }; r.readAsDataURL(file); }); };
        var callGs = function (fn, payload) { return new Promise(function (ok, no) { google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](payload, currentUserInfo); }); };
        var badFiles = function (list) { return list.filter(function (f) { var ext = (f.name.split('.').pop() || '').toLowerCase(); return !MIME_BY_EXT[ext] || f.size > 10 * 1024 * 1024 || !f.size; }); };
        var warnBad = function (bad) { Swal.fire({ icon: 'warning', title: 'เพิ่มไฟล์ไม่ได้', html: 'ไฟล์ต่อไปนี้ไม่ใช่ PDF/รูปภาพ/Word/Excel หรือใหญ่เกิน 10 MB:<br><b>' + bad.map(function (f) { return esc(f.name); }).join('<br>') + '</b>', returnFocus: false }); };
        var failHtml = function (fails) { return fails.map(function (x) { return '<div style="text-align:left"><b>' + esc(x[0]) + '</b>: ' + esc(x[1]) + '</div>'; }).join(''); };
        // อัปโหลดทีละไฟล์ → resolve { done, fails }
        var uploadFiles = function (list, listRow, v, year, onOk) {
            return new Promise(function (resolve) {
                var done = 0, fails = [];
                var step = function () {
                    if (done + fails.length >= list.length) { resolve({ done: done, fails: fails }); return; }
                    var file = list[done + fails.length];
                    Swal.fire({ title: 'กำลังอัปโหลดไฟล์แนบ ' + (done + fails.length + 1) + '/' + list.length, text: file.name, allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
                    readB64(file).then(function (b64) {
                        return callGs('uploadCustomerAttachment', { listRow: listRow, v: v, year: Number(year) || curBE(), fileName: file.name, mime: MIME_BY_EXT[(file.name.split('.').pop() || '').toLowerCase()], data: b64 });
                    }).then(function (res) {
                        if (res && res.status === 'success') { done++; if (onOk) onOk(res); }
                        else fails.push([file.name, (res && res.message) || 'ไม่ทราบสาเหตุ']);
                        step();
                    }).catch(function (err) { fails.push([file.name, err && err.message ? err.message : String(err)]); step(); });
                };
                step();
            });
        };
        window.thpCcUpload = function (inp) {
            var grp = inp.closest('.cc-files-group'), idx = Number(grp.getAttribute('data-i')), it = last.items[idx];
            var list = Array.prototype.slice.call(inp.files || []); inp.value = '';
            if (!it || !list.length) return;
            var bad = badFiles(list); if (bad.length) return warnBad(bad);
            var ys = grp.querySelector('.cc-year'); it.attachYear = ys ? ys.value : it.attachYear;
            uploadFiles(list, it.listRow, it.v, it.attachYear, function (res) {
                it.files = res.files || it.files; it.filesErr = res.filesErr || '';
                var g = document.querySelector('#ccResult .cc-files-group[data-i="' + idx + '"]');
                if (g) g.outerHTML = filesBox(it.files, it.listRow, it.filesErr, idx);
            }).then(function (r) {
                Swal.fire({ icon: r.fails.length ? (r.done ? 'warning' : 'error') : 'success', title: r.fails.length ? 'เพิ่มไฟล์ได้ ' + r.done + ' จาก ' + list.length + ' ไฟล์' : 'เพิ่มไฟล์แล้ว ' + r.done + ' ไฟล์',
                    html: r.fails.length ? failHtml(r.fails) : 'บันทึกลงคอลัมน์ "ไฟล์แนบ" ในชีตรายชื่อแล้ว', returnFocus: false });
            });
        };
        // ลบไฟล์แนบ (ผู้ใช้ขอ 2026-11-23): เอาออกจากคอลัมน์ "ไฟล์แนบ" + ย้ายไฟล์ไปถังขยะ Drive
        window.thpCcDelFile = function (btn) {
            var grp = btn.closest('.cc-files-group'), idx = Number(grp.getAttribute('data-i')), it = last.items[idx];
            var id = btn.getAttribute('data-id'), name = btn.getAttribute('data-name') || 'ไฟล์แนบ';
            if (!it || !id) return;
            Swal.fire({ icon: 'warning', title: 'ลบไฟล์แนบ?', html: '<b>' + esc(name) + '</b><br><small>เอาออกจากคอลัมน์ "ไฟล์แนบ" และย้ายไฟล์ไปถังขยะ Google Drive (กู้คืนได้ภายใน 30 วัน)</small>',
                showCancelButton: true, confirmButtonText: 'ลบไฟล์', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#dc2626', returnFocus: false }).then(function (a) {
                if (!a.isConfirmed) return;
                Swal.fire({ title: 'กำลังลบไฟล์...', allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
                callGs('deleteCustomerAttachment', { listRow: it.listRow, v: it.v, id: id }).then(function (res) {
                    if (!(res && res.status === 'success')) { Swal.fire('ลบไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                    it.files = res.files || []; it.filesErr = res.filesErr || '';
                    var g = document.querySelector('#ccResult .cc-files-group[data-i="' + idx + '"]');
                    if (g) g.outerHTML = filesBox(it.files, it.listRow, it.filesErr, idx);
                    Swal.fire({ icon: res.trashed ? 'success' : 'warning', title: 'ลบไฟล์แนบแล้ว',
                        html: res.trashed ? 'เอาออกจากคอลัมน์ "ไฟล์แนบ" และย้ายไฟล์ไปถังขยะแล้ว' : 'เอาออกจากคอลัมน์ "ไฟล์แนบ" แล้ว แต่ย้ายไฟล์ไปถังขยะไม่ได้: ' + esc(res.trashErr || '') + '<br><small>(ไฟล์ยังอยู่ใน Drive)</small>', returnFocus: false });
                }).catch(function (err) { Swal.fire('ลบไม่สำเร็จ', err && err.message ? err.message : String(err), 'error'); });
            });
        };
        // ฟอร์มลูกค้าใหม่: เลือกไฟล์ไว้ก่อน
        window.thpCcPick = function (inp) {
            var list = Array.prototype.slice.call(inp.files || []); inp.value = '';
            if (!list.length) return;
            var bad = badFiles(list); if (bad.length) warnBad(bad);
            pending = pending.concat(list.filter(function (f) { return bad.indexOf(f) === -1; }));
            var box2 = document.getElementById('ccPendingList'); if (box2) box2.innerHTML = pendingRows();
        };
        window.thpCcUnpick = function (i) {
            pending.splice(i, 1);
            var box2 = document.getElementById('ccPendingList'); if (box2) box2.innerHTML = pendingRows();
        };

        window.thpCcSearch = function () {
            if (!isAdmin()) { Swal.fire('เฉพาะผู้ดูแลระบบ', 'หน้านี้ใช้ได้เฉพาะ admin', 'warning'); return; }
            var inp = document.getElementById('ccQuery'), q = String(inp.value || '').replace(/\D/g, '');
            if (q.length !== 13 && q.length !== 8) { Swal.fire({ title: 'กรอกไม่ถูกต้อง', text: 'กรอกเลขบัตรประชาชน 13 หลัก หรือหมายเลข Post Family 8 หลัก', icon: 'warning', returnFocus: false }).then(function () { inp.focus(); }); return; }
            var btn = document.getElementById('ccSearchBtn'); btn.disabled = true;
            box().innerHTML = '<div class="cc-empty"><i class="fas fa-circle-notch fa-spin"></i> กำลังค้นหา...</div>';
            google.script.run.withSuccessHandler(function (res) {
                btn.disabled = false;
                if (!(res && res.status === 'success')) { box().innerHTML = ''; Swal.fire('ค้นหาไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                last = { q: q, items: res.items || [] }; render();
            }).withFailureHandler(function (err) {
                btn.disabled = false; box().innerHTML = '';
                Swal.fire('ค้นหาไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
            }).findCustomerForSheet({ q: q }, currentUserInfo);
        };

        var regMsg = function (res) {
            return res.regErr ? '<br><span style="color:#b91c1c">อัปเดตทะเบียนสัญญาปี 2570 ไม่สำเร็จ: ' + esc(res.regErr) + '</span>'
                : res.regRow ? '<br>' + (res.regAdded ? 'เพิ่ม' : 'อัปเดต') + 'ทะเบียนสัญญา "ปี 2570" แถว ' + res.regRow : '';
        };
        window.thpCcSave = function (btn) {
            var it = last.items[Number(btn.getAttribute('data-i'))]; if (!it) return;
            var card = btn.closest('.cc-card'), ex0 = collectExtra(card);
            card.querySelectorAll('.cc-invalid').forEach(function (x) { x.classList.remove('cc-invalid'); });
            var bad0 = function (k, msg) { var e = card.querySelector('.cc-fill[data-k="' + k + '"]'); if (e) e.classList.add('cc-invalid'); Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: msg, returnFocus: false }).then(function () { if (e) { e.scrollIntoView({ block: 'center', behavior: 'smooth' }); e.focus({ preventScroll: true }); } }); };
            if (ex0['หมายเลขสมาชิก THP-'] && !/^\d{8}$/.test(ex0['หมายเลขสมาชิก THP-'])) return bad0('หมายเลขสมาชิก THP-', 'หมายเลข Post Family ต้องเป็นตัวเลข 8 หลัก');
            if (ex0['รหัสที่ทำการ'] && !/^\d{5}$/.test(ex0['รหัสที่ทำการ'])) return bad0('รหัสที่ทำการ', 'รหัสไปรษณีย์ที่ทำการต้องเป็นตัวเลข 5 หลัก');
            if (ex0['Email'] && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ex0['Email'])) return bad0('Email', 'Email ไม่ถูกต้อง');
            if (ex0['เบอร์ Wallet@post'] && !/^\d{10}$/.test(ex0['เบอร์ Wallet@post'])) return bad0('เบอร์ Wallet@post', 'เบอร์ที่ลงทะเบียน Wallet@post ต้องเป็นตัวเลข 10 หลัก');
            var what = it.listRow > 0 ? 'อัปเดตแถว ' + it.listRow + ' ในชีต "รายชื่อ/สัญญา A1-A12"' : 'เพิ่มแถวในชีต "การตอบแบบฟอร์ม 1" แล้วบันทึกข้อมูลลงชีต "รายชื่อ/สัญญา A1-A12"';
            Swal.fire({ icon: 'question', title: 'บันทึกข้อมูล ' + (it.v['ชื่อลูกค้า'] || ''), text: what, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', returnFocus: false }).then(function (a) {
                if (!a.isConfirmed) return;
                var html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังบันทึก...';
                google.script.run.withSuccessHandler(function (res) {
                    btn.disabled = false; btn.innerHTML = html;
                    if (!(res && res.status === 'success')) { Swal.fire('บันทึกไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                    Swal.fire({ icon: 'success', title: 'บันทึกแล้ว', html: (res.formAdded ? 'เพิ่มแถว ' + res.formRow + ' ในชีต "การตอบแบบฟอร์ม 1"<br>' : '') + 'บันทึก ' + res.written + ' ช่อง ในชีต "รายชื่อ/สัญญา A1-A12" แถว ' + res.listRow + regMsg(res) });
                    window.thpCcSearch(); // แสดงสถานะล่าสุด
                }).withFailureHandler(function (err) {
                    btn.disabled = false; btn.innerHTML = html;
                    Swal.fire('บันทึกไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
                }).saveCustomerToSheets(it.src === 'list' ? { manual: true, extra: collectExtra(btn.closest('.cc-card')) } // ไม่อยู่ในทะเบียน → อัปเดตแถวในชีตรายชื่อ
                    : { q: last.q, rowNo: it.rowNo, extra: collectExtra(btn.closest('.cc-card')) }, currentUserInfo);
            });
        };

        window.thpCcSaveManual = function (btn) {
            var card = btn.closest('.cc-card'), ex = collectExtra(card);
            card.querySelectorAll('.cc-invalid').forEach(function (x) { x.classList.remove('cc-invalid'); });
            var bad = function (k, msg) { var e = card.querySelector('.cc-fill[data-k="' + k + '"]'); if (e) e.classList.add('cc-invalid'); Swal.fire({ icon: 'warning', title: 'กรอกไม่ครบ', text: msg, returnFocus: false }).then(function () { if (e) { e.scrollIntoView({ block: 'center', behavior: 'smooth' }); e.focus({ preventScroll: true }); } }); };
            if (!ex['ชื่อลูกค้า']) return bad('ชื่อลูกค้า', 'กรุณากรอกชื่อ-สกุลลูกค้า');
            if (!/^\d{5}$/.test(ex['รหัสที่ทำการ'] || '')) return bad('รหัสที่ทำการ', 'กรุณากรอกรหัสไปรษณีย์ที่ทำการ 5 หลัก');
            if (ex['หมายเลขสมาชิก THP-'] && !/^\d{8}$/.test(ex['หมายเลขสมาชิก THP-'])) return bad('หมายเลขสมาชิก THP-', 'หมายเลข Post Family ต้องเป็นตัวเลข 8 หลัก');
            if (ex['Email'] && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ex['Email'])) return bad('Email', 'Email ไม่ถูกต้อง');
            if (ex['เบอร์ Wallet@post'] && !/^\d{10}$/.test(ex['เบอร์ Wallet@post'])) return bad('เบอร์ Wallet@post', 'เบอร์ที่ลงทะเบียน Wallet@post ต้องเป็นตัวเลข 10 หลัก');
            Swal.fire({ icon: 'question', title: 'เพิ่มลูกค้าใหม่ ' + ex['ชื่อลูกค้า'], text: 'เพิ่มแถวในชีต "การตอบแบบฟอร์ม 1" แล้วบันทึกข้อมูลลงชีต "รายชื่อ/สัญญา A1-A12"', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', returnFocus: false }).then(function (a) {
                if (!a.isConfirmed) return;
                var html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังบันทึก...';
                google.script.run.withSuccessHandler(function (res) {
                    btn.disabled = false; btn.innerHTML = html;
                    if (!(res && res.status === 'success')) { Swal.fire('บันทึกไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                    var msg = (res.formAdded ? 'เพิ่มแถว ' + res.formRow + ' ในชีต "การตอบแบบฟอร์ม 1"<br>' : 'มีลูกค้าในชีตอยู่แล้ว (ไม่เพิ่มซ้ำ)<br>') + 'บันทึก ' + res.written + ' ช่อง ในชีต "รายชื่อ/สัญญา A1-A12" แถว ' + res.listRow + regMsg(res);
                    var files = pending.slice();
                    if (!files.length || !(res.listRow > 1)) {
                        Swal.fire({ icon: files.length ? 'warning' : 'success', title: 'บันทึกแล้ว', html: msg + (files.length ? '<br><br>ยังไม่ได้อัปโหลดไฟล์แนบ (ไม่ทราบแถวในชีตรายชื่อ) — ค้นหาลูกค้าอีกครั้งแล้วกด "เพิ่มไฟล์"' : '') });
                        if (res.listRow > 1) window.thpCcSearch(); // แสดงข้อมูลที่บันทึกจากชีตรายชื่อ
                        return;
                    }
                    pending = [];
                    var box2 = document.getElementById('ccPendingList'); if (box2) box2.innerHTML = pendingRows();
                    var ys = card.querySelector('.cc-pending .cc-year');
                    uploadFiles(files, res.listRow, ex, ys ? ys.value : 0).then(function (r) {
                        Swal.fire({ icon: r.fails.length ? 'warning' : 'success', title: 'บันทึกแล้ว',
                            html: msg + '<br>ไฟล์แนบ: อัปโหลดแล้ว ' + r.done + ' จาก ' + files.length + ' ไฟล์' + (r.fails.length ? '<br><br>' + failHtml(r.fails) + '<div style="margin-top:6px">ไฟล์ที่ไม่สำเร็จ: ค้นหาลูกค้าอีกครั้งแล้วกด "เพิ่มไฟล์"</div>' : '') });
                        window.thpCcSearch(); // แสดงข้อมูลที่บันทึก + ไฟล์แนบจากชีตรายชื่อ
                    });
                }).withFailureHandler(function (err) {
                    btn.disabled = false; btn.innerHTML = html;
                    Swal.fire('บันทึกไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
                }).saveCustomerToSheets({ manual: true, extra: ex }, currentUserInfo);
            });
        };

        // ช่องค้นหา: จัดรูปแบบเลขบัตร x-xxxx-xxxxx-xx-x ระหว่างพิมพ์ (8 หลัก = Post Family ไม่จัด)
        document.addEventListener('input', function (e) {
            if (!e.target || e.target.id !== 'ccQuery') return;
            var d = e.target.value.replace(/\D/g, '').slice(0, 13);
            if (d.length <= 8) { e.target.value = d; return; }
            var o = ''; [1, 4, 5, 2, 1].reduce(function (i, n) { if (d.length > i) o += (o ? '-' : '') + d.substr(i, n); return i + n; }, 0);
            e.target.value = o;
        });

        window.loadContractCustomerPage = function () {
            if (!isAdmin()) { Swal.fire('เฉพาะผู้ดูแลระบบ', 'หน้านี้ใช้ได้เฉพาะ admin', 'warning'); if (typeof switchPage === 'function') switchPage('home'); return; }
            var inp = document.getElementById('ccQuery'); if (inp) setTimeout(function () { inp.focus(); }, 50);
        };
        // ออกจากระบบ/สลับผู้ใช้: ล้างผลค้นหา (มีข้อมูลส่วนบุคคล)
        window.thpCcClear = function () { last = { q: '', items: [] }; var el = box(); if (el) el.innerHTML = ''; var i = document.getElementById('ccQuery'); if (i) i.value = ''; };
    })();
</script>
