            if (offices || officesLoading) return;
            officesLoading = true;
            google.script.run.withSuccessHandler(function (res) {
                officesLoading = false; offices = (res && res.status === 'success' && res.data) || [];
                var c = document.querySelector('#ccResult .cc-manual'); if (c) showOffice(c);
            }).withFailureHandler(function () { officesLoading = false; offices = []; }).getOfficesForSubstitute('admin');
        };
        var fmtTel = function (d) { d = String(d || '').replace(/\D/g, '').slice(0, 10); return d.length > 6 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : (d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d); };
        var setupManual = function (card) {
            var q = function (k) { return card.querySelector('.cc-fill[data-k="' + k + '"]'); };
            // 1) Post Family ตัวเลขอย่างเดียว
            var thp = q('หมายเลขสมาชิก THP-'); if (thp) thp.addEventListener('input', function () { thp.value = thp.value.replace(/\D/g, '').slice(0, 8); });
            // 2) รหัสที่ทำการ → ชื่อที่ทำการ
            var zip = q('รหัสที่ทำการ'); if (zip) { zip.addEventListener('input', function () { zip.value = zip.value.replace(/\D/g, '').slice(0, 5); showOffice(card); }); loadOffices(card); showOffice(card); }
            // 3) COD เริ่มต้น 3%
            var cod = q('ค่าธรรมเนียม COD(%)'); if (cod && !cod.value) cod.value = '3';
            // 4) วันที่เริ่มสัญญา = วันนี้
            var dt = q('วันที่เริ่มต้น'); if (dt && !dt.value) { var d = new Date(); dt.value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
            // 7) เบอร์ Wallet แสดงแบบเบอร์โทร (บันทึกเป็นตัวเลขล้วน — collectExtra ตัด - ออก)
            // 8) มีเบอร์ Wallet → ชื่อเจ้าของ = ชื่อ-สกุล (จนกว่าจะแก้เอง)
            var wt = q('เบอร์ Wallet@post'), wn = q('ชื่อเจ้าของ Wallet@post'), nm = q('ชื่อลูกค้า');
            var mirror = function () {
                if (!wn || !wt) return;
                var has = String(wt.value || '').replace(/\D/g, '').length > 0;
                if (!has) { if (wn.dataset.manual !== '1') wn.value = ''; return; }
                if (wn.dataset.manual !== '1') wn.value = nm ? nm.value.trim() : '';
            };
            if (wt) wt.addEventListener('input', function () { wt.value = fmtTel(wt.value); mirror(); });
            if (nm) nm.addEventListener('input', mirror);
            if (wn) wn.addEventListener('input', function () { wn.dataset.manual = wn.value ? '1' : ''; });
        };
        window.thpCcLabelPick = function (sel) {
            var inp = sel.parentNode.querySelector('.cc-fill[data-k]');
            if (sel.value === '__other') { inp.classList.remove('hidden'); inp.value = ''; inp.focus(); }
            else { inp.classList.add('hidden'); inp.value = sel.value; }
        };

        var render = function () {
            var el = box(); if (!el) return;
            if (!last.items.length) { el.innerHTML = manualForm(last.q); setupManual(el); var first = el.querySelector('.cc-fill[data-k="ชื่อลูกค้า"]'); if (first) setTimeout(function () { first.focus(); }, 50); return; }
            el.innerHTML = last.items.map(function (it, i) {
                var v = it.v;
                var st = it.listRow > 0 ? '<span class="cc-chip ok"><i class="fas fa-check"></i> มีในชีตรายชื่อแล้ว (แถว ' + it.listRow + ')</span>'
                    : '<span class="cc-chip new"><i class="fas fa-plus"></i> ยังไม่มีในชีตรายชื่อ — จะเพิ่มแถวในแบบฟอร์ม</span>';
                var formBox = it.listRow > 0 ? '' : '<div class="cc-box"><h4>ชีต "การตอบแบบฟอร์ม 1"' + (it.formRow > 0 ? ' · มีแล้ว แถว ' + it.formRow + ' (ไม่เพิ่มซ้ำ)' : ' · เพิ่มแถวใหม่') + '</h4><dl>' + dlRows(FORM_COLS, v, 2) + '</dl></div>';
                return '<div class="cc-card" data-i="' + i + '"><div class="cc-head"><b>' + esc(v['ชื่อลูกค้า'] || '-') + '</b>' +
                    '<span class="cc-chip">' + esc(v['รหัสบริการปัจจุบัน'] || '-') + '</span><span class="cc-chip">' + esc(v['ประเภทสัญญา'] || '') + '</span>' + st + '</div>' +
                    '<div class="cc-grid">' + formBox + '<div class="cc-box cc-wide"><h4>ชีต "รายชื่อ/สัญญา A1-A12"' + (it.listRow > 0 ? ' · แถว ' + it.listRow : '') + '</h4><dl>' + dlRows(LIST_COLS, v) + '</dl></div></div>' +
                    '<div class="cc-actions"><button type="button" class="cc-btn" data-i="' + i + '" onclick="thpCcSave(this)"><i class="fas fa-save"></i> บันทึกลงชีต</button>' +
                    '<span class="cc-note">ทะเบียนแถว ' + it.rowNo + ' · บันทึกเมื่อ ' + esc(v['บันทึกเมื่อ'] || '-') + ' · ช่องที่ว่างไม่เขียนทับข้อมูลเดิม</span></div></div>';
            }).join('');
        };

        window.thpCcSearch = function () {
            if (!isAdmin()) { Swal.fire('เฉพาะผู้ดูแลระบบ', 'หน้านี้ใช้ได้เฉพาะ admin', 'warning'); return; }
            var inp = document.getElementById('ccQuery'), q = String(inp.value || '').replace(/\D/g, '');
            if (q.length !== 13 && q.length !== 8) { Swal.fire({ title: 'กรอกไม่ถูกต้อง', text: 'กรอกเลขบัตรประชาชน 13 หลัก หรือหมายเลข Post Family 8 หลัก', icon: 'warning', returnFocus: false }).then(function () { inp.focus(); }); return; }
            var btn = document.getElementById('ccSearchBtn'); btn.disabled = true;
            box().innerHTML = '<div class="cc-empty"><i class="fas fa-circle-notch fa-spin"></i> กำลังค้นหา...</div>';
            google.script.run.withSuccessHandler(function (res) {
                btn.disabled = false;
                if (!(res && res.status === 'success')) { box().innerHTML = ''; Swal.fire('ค้นหาไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                last = { q: q, items: res.items || [] }; render();
            }).withFailureHandler(function (err) {
                btn.disabled = false; box().innerHTML = '';
                Swal.fire('ค้นหาไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
            }).findCustomerForSheet({ q: q }, currentUserInfo);
        };

        window.thpCcSave = function (btn) {
            var it = last.items[Number(btn.getAttribute('data-i'))]; if (!it) return;
            var what = it.listRow > 0 ? 'อัปเดตแถว ' + it.listRow + ' ในชีต "รายชื่อ/สัญญา A1-A12"' : 'เพิ่มแถวในชีต "การตอบแบบฟอร์ม 1" แล้วบันทึกข้อมูลลงชีต "รายชื่อ/สัญญา A1-A12"';
            Swal.fire({ icon: 'question', title: 'บันทึกข้อมูล ' + (it.v['ชื่อลูกค้า'] || ''), text: what, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', returnFocus: false }).then(function (a) {
                if (!a.isConfirmed) return;
                var html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังบันทึก...';
                google.script.run.withSuccessHandler(function (res) {
                    btn.disabled = false; btn.innerHTML = html;
                    if (!(res && res.status === 'success')) { Swal.fire('บันทึกไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                    Swal.fire({ icon: 'success', title: 'บันทึกแล้ว', html: (res.formAdded ? 'เพิ่มแถว ' + res.formRow + ' ในชีต "การตอบแบบฟอร์ม 1"<br>' : '') + 'บันทึก ' + res.written + ' ช่อง ในชีต "รายชื่อ/สัญญา A1-A12" แถว ' + res.listRow });
                    window.thpCcSearch(); // แสดงสถานะล่าสุด
                }).withFailureHandler(function (err) {
                    btn.disabled = false; btn.innerHTML = html;
                    Swal.fire('บันทึกไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
                }).saveCustomerToSheets({ q: last.q, rowNo: it.rowNo, extra: collectExtra(btn.closest('.cc-card')) }, currentUserInfo);
            });
        };

        window.thpCcSaveManual = function (btn) {
            var card = btn.closest('.cc-card'), ex = collectExtra(card);
            card.querySelectorAll('.cc-invalid').forEach(function (x) { x.classList.remove('cc-invalid'); });
            var bad = function (k, msg) { var e = card.querySelector('.cc-fill[data-k="' + k + '"]'); if (e) e.classList.add('cc-invalid'); Swal.fire({ icon: 'warning', title: 'กรอกไม่ครบ', text: msg, returnFocus: false }).then(function () { if (e) { e.scrollIntoView({ block: 'center', behavior: 'smooth' }); e.focus({ preventScroll: true }); } }); };
            if (!ex['ชื่อลูกค้า']) return bad('ชื่อลูกค้า', 'กรุณากรอกชื่อ-สกุลลูกค้า');
            if (!/^\d{5}$/.test(ex['รหัสที่ทำการ'] || '')) return bad('รหัสที่ทำการ', 'กรุณากรอกรหัสไปรษณีย์ที่ทำการ 5 หลัก');
            if (ex['หมายเลขสมาชิก THP-'] && !/^\d{8}$/.test(ex['หมายเลขสมาชิก THP-'])) return bad('หมายเลขสมาชิก THP-', 'หมายเลข Post Family ต้องเป็นตัวเลข 8 หลัก');
            if (ex['Email'] && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ex['Email'])) return bad('Email', 'Email ไม่ถูกต้อง');
            if (ex['เบอร์ Wallet@post'] && !/^\d{10}$/.test(ex['เบอร์ Wallet@post'])) return bad('เบอร์ Wallet@post', 'เบอร์ที่ลงทะเบียน Wallet@post ต้องเป็นตัวเลข 10 หลัก');
            Swal.fire({ icon: 'question', title: 'เพิ่มลูกค้าใหม่ ' + ex['ชื่อลูกค้า'], text: 'เพิ่มแถวในชีต "การตอบแบบฟอร์ม 1" แล้วบันทึกข้อมูลลงชีต "รายชื่อ/สัญญา A1-A12"', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', returnFocus: false }).then(function (a) {
                if (!a.isConfirmed) return;
                var html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังบันทึก...';
                google.script.run.withSuccessHandler(function (res) {
                    btn.disabled = false; btn.innerHTML = html;
                    if (!(res && res.status === 'success')) { Swal.fire('บันทึกไม่สำเร็จ', (res && res.message) || 'ไม่ทราบสาเหตุ', 'error'); return; }
                    Swal.fire({ icon: 'success', title: 'บันทึกแล้ว', html: (res.formAdded ? 'เพิ่มแถว ' + res.formRow + ' ในชีต "การตอบแบบฟอร์ม 1"<br>' : 'มีลูกค้าในชีตอยู่แล้ว (ไม่เพิ่มซ้ำ)<br>') + 'บันทึก ' + res.written + ' ช่อง ในชีต "รายชื่อ/สัญญา A1-A12" แถว ' + res.listRow });
                }).withFailureHandler(function (err) {
                    btn.disabled = false; btn.innerHTML = html;
                    Swal.fire('บันทึกไม่สำเร็จ', err && err.message ? err.message : String(err), 'error');
                }).saveCustomerToSheets({ manual: true, extra: ex }, currentUserInfo);
            });
        };

        // ช่องค้นหา: จัดรูปแบบเลขบัตร x-xxxx-xxxxx-xx-x ระหว่างพิมพ์ (8 หลัก = Post Family ไม่จัด)
        document.addEventListener('input', function (e) {
            if (!e.target || e.target.id !== 'ccQuery') return;
            var d = e.target.value.replace(/\D/g, '').slice(0, 13);
            if (d.length <= 8) { e.target.value = d; return; }
            var o = ''; [1, 4, 5, 2, 1].reduce(function (i, n) { if (d.length > i) o += (o ? '-' : '') + d.substr(i, n); return i + n; }, 0);
            e.target.value = o;
        });

        window.loadContractCustomerPage = function () {
            if (!isAdmin()) { Swal.fire('เฉพาะผู้ดูแลระบบ', 'หน้านี้ใช้ได้เฉพาะ admin', 'warning'); if (typeof switchPage === 'function') switchPage('home'); return; }
            var inp = document.getElementById('ccQuery'); if (inp) setTimeout(function () { inp.focus(); }, 50);
        };
        // ออกจากระบบ/สลับผู้ใช้: ล้างผลค้นหา (มีข้อมูลส่วนบุคคล)
        window.thpCcClear = function () { last = { q: '', items: [] }; var el = box(); if (el) el.innerHTML = ''; var i = document.getElementById('ccQuery'); if (i) i.value = ''; };
    })();
</script>
