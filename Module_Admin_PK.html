<!-- PAGE: PK ADMIN DASHBOARD -->
<!-- PAGE: PK ADMIN DASHBOARD (หน้าตรวจสอบและยืนยันข้อมูล ปก.) -->
<div id="page-pk-admin" class="hidden animate-fade-in w-full pb-10">
    <div
        class="bg-white custom-radius shadow-xl overflow-hidden border-t-4 border-red-500 max-w-7xl mx-auto my-4 sm:my-8">

        <!-- ส่วนหัว -->
        <div
            class="p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 bg-gray-50/50">
            <div>
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-user-shield text-red-500"></i> ตรวจสอบข้อมูลติดตามลูกค้า (ปก.)
                </h2>
                <p class="text-xs text-gray-500 mt-1">แสดงเฉพาะผู้ดูแลระบบ (Admin) เพื่อตรวจสอบและยืนยันการติดตามลูกค้า
                </p>
            </div>
            <button onclick="loadPKDashboardData()"
                class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-bold text-gray-600 hover:bg-gray-50 shadow-sm flex items-center gap-2 transition">
                <i class="fas fa-sync-alt"></i> รีเฟรชข้อมูล
            </button>
        </div>

        <!-- พื้นที่แสดงข้อมูล Card -->
        <div class="p-6 bg-gray-100/50 min-h-[500px]">
            <!-- Loading Indicator -->
            <div id="pkLoadingIndicator" class="hidden flex flex-col items-center justify-center py-10">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-500 mb-3"></div>
                <p class="text-gray-500 text-sm font-medium">กำลังโหลดข้อมูลลูกค้า...</p>
            </div>

            <!-- Container สำหรับ Cards -->
            <div id="pkCardContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- การ์ดจะถูกสร้างด้วย Script_Admin_PK -->
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 💡 PK ADMIN DASHBOARD LOGIC (Always Expanded, Undo, No Data Filter, Drilldown Chart & PDF Export)
    // ==========================================

    // ตัวแปรเก็บ Instance ของกราฟ
    window.pkPieChartInst = null;
    window.pkBarChartInst = null;
    window.pkZipBarChartInst = null; // สำหรับกราฟ Drilldown ระดับรหัส ปณ.

    document.addEventListener('DOMContentLoaded', () => {
        // ดึงหน้า View_Admin_PK เข้ามาในกรอบแสดงผลหลักอัตโนมัติ
        setTimeout(() => {
            const pagePkAdmin = document.getElementById('page-pk-admin');
            const mainContainer = document.querySelector('main > div.max-w-full.mx-auto');
            if (pagePkAdmin && mainContainer && pagePkAdmin.parentNode !== mainContainer) {
                mainContainer.appendChild(pagePkAdmin);
            }
        }, 100);

        // ระบบตรวจสอบสิทธิ์ Admin
        setInterval(() => {
            if (typeof currentUserInfo !== 'undefined' && currentUserInfo && currentUserInfo.user) {
                const userRole = String(currentUserInfo.user).trim().toLowerCase();
                const adminMenu = document.getElementById('menu-pk-admin');
                if (adminMenu) {
                    if (userRole === 'admin') adminMenu.classList.remove('hidden');
                    else adminMenu.classList.add('hidden');
                }
            }
        }, 1000);

        // Hook ระบบสลับหน้า
        setTimeout(() => {
            if (typeof window.originalSwitchPageForAdmin === 'undefined' && typeof window.switchPage === 'function') {
                window.originalSwitchPageForAdmin = window.switchPage;
                window.switchPage = function (pageId) {
                    window.originalSwitchPageForAdmin(pageId);
                    const pagePkAdmin = document.getElementById('page-pk-admin');
                    const menuPkAdmin = document.getElementById('menu-pk-admin');

                    // 💡 สร้างและจัดการปุ่ม กราฟข้อมูล ไว้บน Global Header อัตโนมัติ
                    let pkChartBtn = document.getElementById('headerPKChartBtn');
                    if (!pkChartBtn) {
                        const headerBtnContainer = document.querySelector('header .justify-end');
                        if (headerBtnContainer) {
                            pkChartBtn = document.createElement('button');
                            pkChartBtn.id = 'headerPKChartBtn';
                            pkChartBtn.type = 'button';
                            pkChartBtn.onclick = window.openPKChartModal;
                            pkChartBtn.className = 'hidden text-xs bg-white text-indigo-600 border border-indigo-200 hover:bg-indigo-600 hover:text-white px-3 py-1.5 rounded-full font-medium transition transform hover:scale-105 items-center gap-1 shadow-sm shrink-0';
                            pkChartBtn.innerHTML = '<i class="fas fa-chart-pie"></i> กราฟข้อมูล';
                            headerBtnContainer.appendChild(pkChartBtn);
                        }
                    }

                    if (pageId === 'pk-admin') {
                        if (pagePkAdmin) pagePkAdmin.classList.remove('hidden');
                        if (menuPkAdmin) menuPkAdmin.classList.add('bg-white/10', 'text-white', 'border-l-4', 'border-red-500');
                        const titleEl = document.getElementById('pageTitle');
                        if (titleEl) titleEl.innerText = 'ข้อมูลติดตามลูกค้า (ปก.)';

                        if (pkChartBtn) {
                            pkChartBtn.classList.remove('hidden');
                            pkChartBtn.classList.add('flex');
                        }

                        if (window.allPKData.length === 0) {
                            window.loadPKDashboardData();
                        }
                    } else {
                        if (pagePkAdmin) pagePkAdmin.classList.add('hidden');
                        if (menuPkAdmin) menuPkAdmin.classList.remove('bg-white/10', 'text-white', 'border-l-4', 'border-red-500');

                        if (pkChartBtn) {
                            pkChartBtn.classList.add('hidden');
                            pkChartBtn.classList.remove('flex');
                        }
                    }
                };
            }
        }, 500);
    });

    window.allPKData = [];
    window.currentPKFilter = 'all';

    window.setPKFilter = function (filterType) {
        window.currentPKFilter = filterType;
        window.renderPKCards();
    };

    window.loadPKDashboardData = function () {
        const container = document.getElementById('pkCardContainer');
        const loader = document.getElementById('pkLoadingIndicator');
        if (!container || !loader) return;

        container.innerHTML = '';
        loader.classList.remove('hidden');

        google.script.run
            .withSuccessHandler(res => {
                loader.classList.add('hidden');
                if (res.status === 'success') {
                    let rawData = res.data || [];

                    // บังคับจัดเรียงข้อมูลฝั่งหน้าเว็บ
                    rawData.sort((a, b) => {
                        const getState = (item) => {
                            if (item.status && item.status !== "") return 1;
                            if (item.updateDate && item.updateDate !== "") return 0;
                            return 2;
                        };

                        const stateA = getState(a);
                        const stateB = getState(b);

                        if (stateA !== stateB) return stateA - stateB;

                        const zipA = parseInt(a.zipcode) || 0;
                        const zipB = parseInt(b.zipcode) || 0;
                        if (zipA !== zipB) return zipA - zipB;

                        return (a.accName || '').localeCompare(b.accName || '');
                    });

                    window.allPKData = rawData;
                    window.renderPKCards();
                } else {
                    container.innerHTML = '<div class="col-span-full text-center text-red-500 py-10">' + res.message + '</div>';
                }
            })
            .withFailureHandler(err => {
                loader.classList.add('hidden');
                container.innerHTML = '<div class="col-span-full text-center text-red-500 py-10">Error: ' + err.message + '</div>';
            })
            .getPKDashboardData();
    };

    // 💡 ฟังก์ชันจัดการสีของกลุ่มบริการแยกตามประเภทที่ปรับปรุงใหม่ (ป้องกัน Syntax Error)
    window.formatPKGroupColors = function (groupString, isEmptyPlaceholder) {
        if (!isEmptyPlaceholder) isEmptyPlaceholder = 'รอดำเนินการ';
        if (!groupString || String(groupString).trim() === '') {
            return '<span class="text-gray-400 italic">' + isEmptyPlaceholder + '</span>';
        }
        return String(groupString).split(',').map(g => {
            let text = g.trim();
            if (text.includes('ไปรษณีย์') || text.includes('ไปรษณียภัณฑ์')) return '<span class="text-green-600 font-semibold">' + text + '</span>';
            if (text.includes('ขนส่ง') || text.includes('โลจิสติกส์') || text.includes('e-Commerce')) return '<span class="text-[#8b4513] font-semibold">' + text + '</span>'; // สีน้ำตาล
            if (text.includes('ฟิ้วซ์') || text.includes('Fuze')) return '<span class="text-blue-600 font-semibold">' + text + '</span>'; // สีน้ำเงิน
            if (text.includes('ระหว่างประเทศ') || text.includes('ขร.')) return '<span class="text-purple-600 font-semibold">' + text + '</span>'; // สีม่วง
            return '<span class="text-gray-700 font-semibold">' + text + '</span>';
        }).join('<span class="text-gray-400 font-normal">, </span>');
    };

    window.renderPKCards = function () {
        const container = document.getElementById('pkCardContainer');
        if (!container) return;

        let dataToRender = window.allPKData;

        if (window.currentPKFilter === 'nodata') {
            dataToRender = dataToRender.filter(item => item.updateDate === "");
        } else if (window.currentPKFilter === 'pending') {
            dataToRender = dataToRender.filter(item => item.updateDate !== "" && item.status === "");
        } else if (window.currentPKFilter === 'confirmed') {
            dataToRender = dataToRender.filter(item => item.status !== "");
        }

        let filterUI = document.getElementById('pkFilterUI');
        if (!filterUI) {
            filterUI = document.createElement('div');
            filterUI.id = 'pkFilterUI';
            filterUI.className = 'bg-gray-50/50 p-2.5 rounded-2xl border border-gray-200/60 shadow-sm w-full col-span-full mb-6 backdrop-blur-md';
            container.parentNode.insertBefore(filterUI, container);
        } else {
            filterUI.className = 'bg-gray-50/50 p-2.5 rounded-2xl border border-gray-200/60 shadow-sm w-full col-span-full mb-6 backdrop-blur-md';
        }

        const pendingCount = window.allPKData.filter(i => i.updateDate !== "" && i.status === "").length;
        const confirmedCount = window.allPKData.filter(i => i.status !== "").length;
        const nodataCount = window.allPKData.filter(i => i.updateDate === "").length;

        const baseBtnClass = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex items-center gap-2 shrink-0 cursor-pointer select-none hover:-translate-y-0.5 active:scale-[0.98]";
        const inactiveBtnClass = "bg-white/80 hover:bg-white text-gray-600 border border-gray-200 shadow-sm";

        let allBtn = '';
        if (window.currentPKFilter === 'all') {
            allBtn = '<button onclick="setPKFilter(\'all\')" class="' + baseBtnClass + ' bg-theme-black text-white border-0 shadow-[0_4px_12px_rgba(6,46,33,0.2)] scale-105">' +
                '<i class="fas fa-list-ul text-white"></i> ทั้งหมด (' + window.allPKData.length + ')' +
                '</button>';
        } else {
            allBtn = '<button onclick="setPKFilter(\'all\')" class="' + baseBtnClass + ' ' + inactiveBtnClass + '">' +
                '<i class="fas fa-list-ul text-gray-400"></i> ทั้งหมด (' + window.allPKData.length + ')' +
                '</button>';
        }

        let pendingBtn = '';
        if (window.currentPKFilter === 'pending') {
            pendingBtn = '<button onclick="setPKFilter(\'pending\')" class="' + baseBtnClass + ' bg-amber-500 text-white border-0 shadow-[0_4px_12px_rgba(245,158,11,0.3)] scale-105">' +
                '<i class="fas fa-clock text-white"></i> รอตรวจสอบ (' + pendingCount + ')' +
                '</button>';
        } else {
            pendingBtn = '<button onclick="setPKFilter(\'pending\')" class="' + baseBtnClass + ' ' + inactiveBtnClass + '">' +
                '<i class="fas fa-clock text-amber-500"></i> รอตรวจสอบ (' + pendingCount + ')' +
                '</button>';
        }

        let confirmedBtn = '';
        if (window.currentPKFilter === 'confirmed') {
            confirmedBtn = '<button onclick="setPKFilter(\'confirmed\')" class="' + baseBtnClass + ' bg-green-600 text-white border-0 shadow-[0_4px_12px_rgba(22,163,74,0.3)] scale-105">' +
                '<i class="fas fa-check-circle text-white"></i> บันทึกข้อมูลที่ Salesforce แล้ว (' + confirmedCount + ')' +
                '</button>';
        } else {
            confirmedBtn = '<button onclick="setPKFilter(\'confirmed\')" class="' + baseBtnClass + ' ' + inactiveBtnClass + '">' +
                '<i class="fas fa-check-circle text-green-500"></i> บันทึกข้อมูลที่ Salesforce แล้ว (' + confirmedCount + ')' +
                '</button>';
        }

        let nodataBtn = '';
        if (window.currentPKFilter === 'nodata') {
            nodataBtn = '<button onclick="setPKFilter(\'nodata\')" class="' + baseBtnClass + ' bg-slate-500 text-white border-0 shadow-[0_4px_12px_rgba(100,116,139,0.3)] scale-105">' +
                '<i class="fas fa-minus-circle text-white"></i> ยังไม่มีข้อมูล (' + nodataCount + ')' +
                '</button>';
        } else {
            nodataBtn = '<button onclick="setPKFilter(\'nodata\')" class="' + baseBtnClass + ' ' + inactiveBtnClass + '">' +
                '<i class="fas fa-minus-circle text-gray-400"></i> ยังไม่มีข้อมูล (' + nodataCount + ')' +
                '</button>';
        }

        // 💡 ลบการใช้ Backtick ออก เพื่อป้องกันบั๊ก HTML Parsing ของ Google
        filterUI.innerHTML = '<div class="flex flex-wrap gap-2 w-full">' + allBtn + pendingBtn + confirmedBtn + nodataBtn + '</div>';

        if (dataToRender.length === 0) {
            container.innerHTML = '<div class="col-span-full text-center py-16 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">ไม่พบข้อมูลในหมวดหมู่นี้</div>';
            return;
        }

        // 💡 แปลงการเรนเดอร์การ์ดทั้งหมดด้วยการต่อ String ปกติ
        container.innerHTML = dataToRender.map((item, index) => {
            const hasUpdate = item.updateDate !== "";
            const isConfirmed = item.status !== "";

            let statusBadge = '';
            let borderColor = '';
            let opacityClass = '';

            if (isConfirmed) {
                statusBadge = '<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold border border-green-200"><i class="fas fa-check-circle mr-1"></i> บันทึกข้อมูลที่ Salesforce แล้ว</span>';
                borderColor = 'border-green-400';
            } else if (hasUpdate) {
                statusBadge = '<span class="bg-orange-100 text-orange-700 px-2 py-1 rounded text-[10px] font-bold border border-orange-200"><i class="fas fa-clock mr-1"></i> รอตรวจสอบ</span>';
                borderColor = 'border-orange-400';
            } else {
                statusBadge = '<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded text-[10px] font-bold border border-gray-200"><i class="fas fa-minus-circle mr-1"></i> ยังไม่มีข้อมูล</span>';
                borderColor = 'border-gray-300';
                opacityClass = 'opacity-80 grayscale-[15%]';
            }

            let displayPhone = item.phone ? String(item.phone).replace(/\D/g, '') : '';
            if (displayPhone.length > 0 && displayPhone.length < 10 && !displayPhone.startsWith('0')) {
                displayPhone = '0' + displayPhone;
            }
            displayPhone = displayPhone || '-';

            let displayStatus = item.status ? item.status.replace('ยืนยันแล้ว', 'บันทึกข้อมูลที่ Salesforce แล้ว') : '';

            const safeAccName = (item.accName || '-').replace(/['"\\\n\r]/g, " ");
            const safePoName = (item.poName || '-').replace(/['"\\\n\r]/g, " ");
            const safeReason = (item.reason || '-').replace(/['"\\\n\r]/g, " ");

            let actionHtml = '';
            if (isConfirmed) {
                actionHtml = '<div class="flex gap-2">' +
                    '<div class="flex-1 bg-green-50 text-green-700 py-2.5 px-2 rounded-xl border border-green-100 flex items-center justify-center font-bold text-[11px] text-center leading-tight">' +
                    '<i class="fas fa-check-double mr-1 shrink-0"></i> ' + displayStatus.split(' (')[0] +
                    '</div>' +
                    '<button onclick="undoPKAction(' + item.row + ')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2.5 rounded-xl font-bold transition flex items-center justify-center shadow-sm border border-rose-200 shrink-0" title="ยกเลิกการบันทึก">' +
                    '<i class="fas fa-undo mr-1"></i> ยกเลิกการบันทึก' +
                    '</button>' +
                    '</div>';
            } else if (hasUpdate) {
                actionHtml = '<button onclick="confirmPKAction(' + item.row + ')" class="w-full bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-xl font-bold shadow-sm transition transform active:scale-95 flex items-center justify-center gap-2">' +
                    '<i class="fas fa-stamp"></i> ยืนยันการบันทึกข้อมูลที่ Salesforce แล้ว' +
                    '</button>';
            } else {
                actionHtml = '<button disabled class="w-full bg-slate-100 text-slate-500 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 border border-slate-300 border-dashed cursor-not-allowed shadow-inner">' +
                    '<i class="fas fa-user-times"></i> ยังไม่มีการเข้าพบลูกค้า' +
                    '</button>';
            }

            return '<div class="bg-white rounded-2xl shadow-sm border-t-4 ' + borderColor + ' flex flex-col relative group ' + opacityClass + '">' +
                '<div class="p-5 flex-1">' +
                '<div class="flex justify-between items-start mb-3 gap-2">' +
                '<div class="flex items-center gap-1.5 flex-1 min-w-0">' +
                '<span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-[10px] font-mono font-bold shrink-0">' + item.zipcode + '</span>' +
                '<span class="text-[11px] text-gray-500 truncate" title="' + safePoName + '"><i class="fas fa-building text-gray-400 mr-1"></i>' + (item.poName || '-') + '</span>' +
                '</div>' +
                '<div class="shrink-0">' + statusBadge + '</div>' +
                '</div>' +
                '<h3 class="font-bold text-gray-800 text-base mb-2 line-clamp-1" title="' + safeAccName + '">' +
                '<span class="text-theme-orange mr-1">#' + (index + 1) + '</span>' + (item.accName || '-') +
                '</h3>' +
                '<div class="space-y-2 mt-4">' +
                // 💡 ปรับปรุงให้ตัดคำและขึ้นบรรทัดใหม่
                '<p class="text-xs text-gray-500 flex items-start gap-2">' +
                '<i class="fas fa-tags w-4 ' + (hasUpdate ? 'text-theme-orange' : 'text-gray-400') + ' shrink-0 mt-0.5"></i> ' +
                '<span class="flex-1 whitespace-normal break-words"><b>กลุ่มบริการ:</b> ' + window.formatPKGroupColors(item.group, 'รอดำเนินการ') + '</span>' +
                '</p>' +
                // 💡 ปรับปรุงให้ตัดคำและขึ้นบรรทัดใหม่
                '<p class="text-xs ' + (item.reason ? 'text-red-500' : 'text-gray-500') + ' flex items-start gap-2">' +
                '<i class="fas fa-exclamation-circle w-4 shrink-0 mt-0.5"></i> ' +
                '<span class="flex-1 whitespace-normal break-words"><b>สาเหตุ:</b> <span class="' + (!item.reason ? 'text-gray-400 italic' : '') + '" title="' + safeReason + '">' + (item.reason || 'รอดำเนินการ') + '</span></span>' +
                '</p>' +
                '<p class="text-[10px] text-gray-400 flex items-center gap-2 mt-2">' +
                '<i class="fas fa-clock w-4 shrink-0"></i> <span>อัปเดตเมื่อ: ' + (item.updateDate || '-') + '</span>' +
                '</p>' +
                '</div>' +
                '</div>' +
                '<div class="p-5 bg-gray-50 border-t border-gray-100 text-xs space-y-1 rounded-b-2xl">' +
                '<div class="grid grid-cols-1 gap-3 text-xs text-gray-600">' +
                '<div class="flex justify-between items-center border-b border-gray-200 pb-2">' +
                '<div class="flex-1 min-w-0 pr-2 border-r border-gray-200">' +
                '<span class="text-[10px] text-gray-400 block mb-0.5">รหัสสมาชิก :</span>' +
                '<span class="font-bold text-gray-800 truncate block" title="' + (item.memberCode || '-') + '">' + (item.memberCode || '-') + '</span>' +
                '</div>' +
                '<div class="flex-1 min-w-0 text-right pl-2">' +
                '<span class="text-[10px] text-gray-400 block mb-0.5">เบอร์โทรศัพท์ :</span>' +
                '<span class="font-bold text-gray-800 truncate block">' + displayPhone + '</span>' +
                '</div>' +
                '</div>' +
                '<div class="pt-2 flex flex-col gap-2">' + actionHtml + '</div>' +
                '</div>' +
                '</div>' +
                '</div>';
        }).join('');
    };

    window.confirmPKAction = function (rowIndex) {
        const item = window.allPKData.find(i => i.row === rowIndex);
        const accName = item ? item.accName : 'ลูกค้าที่เลือก';

        Swal.fire({
            title: 'ยืนยันการตรวจสอบ?',
            text: `คุณต้องการบันทึกสถานะยืนยันให้แก่ "${accName}" ลงในคอลัมน์ W ใช่หรือไม่?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#10b981',
            confirmButtonText: 'ตกลง, ยืนยัน',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                google.script.run
                    .withSuccessHandler(res => {
                        if (res.status === 'success') {
                            Swal.fire('สำเร็จ!', 'ยืนยันข้อมูลเรียบร้อยแล้ว', 'success');
                            window.loadPKDashboardData();
                        } else {
                            Swal.fire('ผิดพลาด', res.message, 'error');
                        }
                    })
                    .withFailureHandler(err => Swal.fire('ผิดพลาด', err.toString(), 'error'))
                    .confirmPKCustomer(rowIndex);
            }
        });
    };

    window.undoPKAction = function (rowIndex) {
        const item = window.allPKData.find(i => i.row === rowIndex);
        const accName = item ? item.accName : 'ลูกค้าที่เลือก';

        Swal.fire({
            title: 'ยกเลิกการยืนยัน?',

    window.exportPKAdminToPDF = async function () {
        if (window.allPKData.length === 0) return;

            Swal.fire({ title: 'กำลังโหลดระบบ PDF...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            script.onload = () => { Swal.close(); processPKPDF(); };
            document.head.appendChild(script);
        } else {
            processPKPDF();
        }
    };

                    (index + 1).toString(),
                    item.accName || '-',
                    item.prov || '-',
                    item.poName || '-',
                    item.zipcode || '-',

                currentPageDiv.style.cssText = "width: 800px; height: 1131px; padding: 40px; box-sizing: border-box; background-color: #ffffff; position: relative; overflow: hidden;";

                const header = document.createElement('div');
                // 💡 ไม่ใช้ Backtick ใน innerHTML แบบฝัง
                header.innerHTML = '<h2 style="font-size: 20px; font-weight: bold; color: #374151; margin-bottom: 20px; border-bottom: 2px solid #6366f1; padding-bottom: 10px; text-align: center;"><i class="fas fa-chart-pie" style="color:#6366f1; margin-right:8px;"></i>สรุปข้อมูลติดตามลูกค้า (ปก.)</h2>';
                currentPageDiv.appendChild(header);

                currentContentArea = document.createElement('div');
                currentContentArea.style.cssText = "display: block; width: 100%;";
                currentPageDiv.appendChild(currentContentArea);

                offScreen.appendChild(currentPageDiv);
                pages.push(currentPageDiv);
                currentPageNum++;
            }

            startNewPage();

            const pieCanvas = document.getElementById('pkPieChart');
            const barCanvas = document.getElementById('pkBarChart');

            if (pieCanvas && barCanvas) {
                const chartsContainer = document.createElement('div');
                chartsContainer.style.cssText = "display: flex; gap: 20px; margin-bottom: 20px;";

                const pieWrapper = document.createElement('div');
                pieWrapper.style.cssText = "width: 35%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;";
                pieWrapper.innerHTML = '<div style="font-size:12px; font-weight:bold; margin-bottom:10px; color:#4b5563;">สัดส่วนสถานะ</div>';
                const pieImg = document.createElement('img');
                pieImg.src = pieCanvas.toDataURL('image/png', 1.0);
                // 💡 ปรับให้ความสูงเป็น auto และจำกัด max-height เพื่อรักษาสัดส่วน
                pieImg.style.cssText = "width: 100%; height: auto; max-height: 230px; object-fit: contain; margin: 0 auto;";
                pieWrapper.appendChild(pieImg);

                const barWrapper = document.createElement('div');
                barWrapper.style.cssText = "width: 65%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;";
                barWrapper.innerHTML = '<div style="font-size:12px; font-weight:bold; margin-bottom:10px; color:#4b5563;">จำนวนแต่ละสถานะแยกตามจังหวัด</div>';
                const barImg = document.createElement('img');
                barImg.src = barCanvas.toDataURL('image/png', 1.0);
                // 💡 ปรับให้ความสูงเป็น auto และจำกัด max-height เพื่อรักษาสัดส่วน
                barImg.style.cssText = "width: 100%; height: auto; max-height: 230px; object-fit: contain; margin: 0 auto;";
                barWrapper.appendChild(barImg);

                chartsContainer.appendChild(pieWrapper);
                chartsContainer.appendChild(barWrapper);
                currentContentArea.appendChild(chartsContainer);
            }

            const headers = ['#', 'ชื่อลูกค้า', 'จังหวัด', 'ที่ทำการ', 'รหัส ปณ.', 'รหัสสมาชิก', 'เบอร์โทร', 'กลุ่มบริการ', 'สาเหตุ', 'วันที่', 'สถานะ'];
            const aligns = ['center', 'left', 'left', 'left', 'center', 'center', 'center', 'left', 'left', 'center', 'center'];
            // 💡 ปรับความกว้างให้สมดุลขึ้น ชื่อลูกค้าและสาเหตุจะได้ไม่แคบเกินไป
            const widths = ['4%', '16%', '8%', '12%', '6%', '9%', '9%', '11%', '13%', '6%', '6%'];

            const createEmptyTable = () => {
                const wrapper = document.createElement('div');
                wrapper.style.cssText = "width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;";
                const table = document.createElement('table');
                table.style.cssText = "width: 100%; border-collapse: collapse; table-layout: fixed; word-wrap: break-word;";

                const thead = document.createElement('thead');
                const thr = document.createElement('tr');
                thr.style.cssText = "background-color: #1e293b; color: white;";
                headers.forEach((h, i) => {
                    const th = document.createElement('th');
                    th.innerHTML = h;
                    th.style.cssText = 'padding: 8px 4px; font-size: 10px; font-weight: bold; text-align: ' + aligns[i] + '; width: ' + widths[i] + ';';
                    thr.appendChild(th);
                });
                thead.appendChild(thr);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                table.appendChild(tbody);
                wrapper.appendChild(table);
                return { wrapper, tbody };
            };

            let tableObj = createEmptyTable();
            currentContentArea.appendChild(tableObj.wrapper);
            let currentTbody = tableObj.tbody;

            const MAX_HEIGHT = 920;

            for (let i = 0; i < tableRows.length; i++) {
                const rowData = tableRows[i];
                const tr = document.createElement('tr');
                tr.style.cssText = 'background-color: ' + (i % 2 === 0 ? '#ffffff' : '#f8fafc') + '; border-bottom: 1px solid #e5e7eb;';

                rowData.forEach((cell, idx) => {
                    const td = document.createElement('td');
                    td.style.cssText = 'padding: 6px 4px; font-size: 9.5px; color: #374151; text-align: ' + aligns[idx] + '; white-space: normal; word-break: break-word; overflow-wrap: break-word; vertical-align: top; line-height: 1.4;';

                    if (idx === 10) {
                        if (cell === 'บันทึกแล้ว') td.style.color = '#10b981';
                        else if (cell === 'รอตรวจสอบ') td.style.color = '#f59e0b';
                        else td.style.color = '#9ca3af';
                        td.style.fontWeight = 'bold';
                    }
                    if (idx === 8) {
                        if (cell !== '-' && cell !== 'รอดำเนินการ') td.style.color = '#ef4444';
                    }

                    td.innerText = cell;
                    tr.appendChild(td);
                });

                currentTbody.appendChild(tr);

                const currentHeight = currentContentArea.offsetHeight;

                if (currentHeight > MAX_HEIGHT) {
                    currentTbody.removeChild(tr);
                    startNewPage();
                    tableObj = createEmptyTable();
                    currentContentArea.appendChild(tableObj.wrapper);
                    currentTbody = tableObj.tbody;
                    currentTbody.appendChild(tr);
                }
            }

            await new Promise(r => setTimeout(r, 500));

            const jsPDF = window.jspdf.jsPDF;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const margin = 10;
            const printWidth = pdfWidth - (margin * 2);

            for (let i = 0; i < pages.length; i++) {
                Swal.update({ html: 'กำลังประมวลผลหน้า ' + (i + 1) + '/' + pages.length + '...' });
                const canvas = await html2canvas(pages[i], { scale: 2, useCORS: true });
                const imgData = canvas.toDataURL('image/jpeg', 1.0);

                const imgHeight = (canvas.height * printWidth) / canvas.width;

                if (i > 0) pdf.addPage();
                pdf.addImage(imgData, 'JPEG', margin, margin, printWidth, imgHeight);

                pdf.setFontSize(11);
                pdf.setTextColor(120);
                pdf.text(String(i + 1), pdfWidth - margin, margin + 5, { align: 'right' });
            }

            const d = new Date();
            const ts = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
            pdf.save('PK_Admin_Report_' + ts + '.pdf');

            document.body.removeChild(offScreen);
            Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'ดาวน์โหลด PDF เรียบร้อยแล้ว', timer: 2000, showConfirmButton: false });

        } catch (err) {
            console.error(err);
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถสร้าง PDF ได้: ' + err.message, 'error');
        }
    };
</script>
