<script>
    ;(function () {
        var esc = function (s) { return window.escapeHtml ? window.escapeHtml(String(s)) : String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var who = function () { try { return String((currentUserInfo || {}).user || ''); } catch (e) { return ''; } };
        var fmt = function (n) { return Math.round(Number(n) || 0).toLocaleString('th-TH'); };
        var short = function (n) { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + ' ล.' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + ' พ.' : fmt(n); };
        var pctOf = function (a, b) { return b ? Math.round(a * 100 / b) : 0; };
        var MO = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        var MO_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        var NOPKG = 'ไม่ระบุ Package', NOTEAM = 'ไม่ระบุทีม';
        var st = { data: null, forUser: null, seq: 0, f: { year: '', month: '', pkg: '', team: '', zip: '', q: '' }, limit: 100, sort: 'zip', view: 'pkg', metric: 'rev' };

        var pkgOf = function (c) { return c.pkg || NOPKG; };
        var teamOf = function (c) { return c.team || NOTEAM; };
        var pkgRank = function (p) { var m = /^A(\d+)/i.exec(p); return m ? Number(m[1]) : (p === NOPKG ? 999 : 500); };
        var pkgSort = function (a, b) { return pkgRank(a) - pkgRank(b) || String(a).localeCompare(String(b), 'th'); };
        var teamSort = function (a, b) { return a === NOTEAM ? 1 : b === NOTEAM ? -1 : a.localeCompare(b, 'th'); };
        var pkgLabel = function (p) { return p === NOPKG ? 'ไม่ระบุ' : (/พิเศษ/.test(p) ? 'อัตราพิเศษ' : p.replace(/\s*\(.*\)$/, '')); };
        var pkgBadge = function (p, n) {
            var cls = p === NOPKG ? ' is-none' : (/พิเศษ/.test(p) ? ' is-custom' : '');
            return '<span class="cp-pkg' + cls + '" title="' + esc(p) + '">' + esc(pkgLabel(p)) + (n != null ? '<b>' + fmt(n) + '</b>' : '') + '</span>';
        };
        var mVal = function (s) { return st.metric === 'pcs' ? s[0] : s[1]; };
        var mUnit = function () { return st.metric === 'pcs' ? 'ชิ้น' : 'บาท'; };

            if (notes.length) html += '<p class="cp-note"><i class="fas fa-info-circle"></i><span>' + notes.map(esc).join(' · ') + '</span></p>';
            html += statCard(D.stat);
            if (!list.length) { body.innerHTML = html + '<div class="cp-empty">ไม่พบลูกค้าที่ตรงกับตัวกรอง</div>'; return; }

            var seg = '<div class="cp-seg" role="group" aria-label="แสดงเป็น">' + [['rev', 'รายได้'], ['pcs', 'ชิ้นงาน']].map(function (o) {
                return '<button type="button" aria-pressed="' + (st.metric === o[0]) + '" onclick="thpCpMetric(\'' + o[0] + '\')">' + o[1] + '</button>'; }).join('') + '</div>';

            // ----- กราฟรายเดือน -----
            if (y) {
                var mo = []; for (var i = 0; i < 12; i++) mo.push([0, 0, 0]);
                var seenM = {};
                list.forEach(function (c) { var a = c.thp && !seenM[c.thp] && D.ship[c.thp] && D.ship[c.thp][y]; if (!a) return; seenM[c.thp] = 1; for (var i = 0; i < 12; i++) { mo[i][0] += a[i * 2]; mo[i][1] += a[i * 2 + 1]; if (a[i * 2] > 0 || a[i * 2 + 1] > 0) mo[i][2]++; } });
                var maxM = Math.max.apply(null, mo.map(function (x) { return mVal(x); }).concat([1]));
                html += '<section class="cp-card"><div class="cp-card-h"><h3><i class="fas fa-chart-bar"></i>ฝากส่งรายเดือน ปี ' + (Number(y) + 543) + '</h3><small>คลิกเดือนเพื่อกรอง</small><div class="cp-right">' + seg + '</div></div><div class="cp-months">' +
                    mo.map(function (x, i) {
                        var on = m === i, dim = m !== '' && !on, v = mVal(x);
                        return '<button type="button" class="cp-mo' + (on ? ' is-on' : '') + (dim ? ' is-dim' : '') + '" aria-pressed="' + on + '" onclick="thpCpSet(\'month\', \'' + i + '\')" title="' + MO_FULL[i] + ': ลูกค้าฝากส่ง ' + fmt(x[2]) + ' ราย · ' + fmt(x[0]) + ' ชิ้น · ' + fmt(x[1]) + ' บาท">' +
                            '<span class="cp-mo-v">' + (v ? short(v) : '') + '</span><span class="cp-mo-bar"><span style="height:' + (v ? Math.max(2, Math.round(v * 100 / maxM)) : 0) + '%"></span></span>' +
                            '<span class="cp-mo-l">' + MO[i] + '</span></button>';
                    }).join('') + '</div></section>';
            }

            // ----- สรุปแยกตาม (แท็บ: Package / ทีม / ที่ทำการ) — นับตามตัวกรองอื่น เห็นทุกรายการ แถวที่เลือกเน้นสี -----
            var V = st.view, gs, sel, head1, extraHead = '', extraCell = null;
            if (V === 'team') {
                gs = groupBy(all.filter(function (c) { return match(c, 'team'); }), teamOf, y, m).sort(function (a, b) { return teamSort(a.k, b.k); });
                gs.forEach(function (g) { g.label = '<span class="cp-lbl">' + esc(g.k) + '</span>'; }); sel = f.team; head1 = 'ทีม';
            } else if (V === 'zip') {
                gs = groupBy(all.filter(function (c) { return match(c, 'zip'); }), function (c) { return c.zip; }, y, m).sort(function (a, b) { return a.k.localeCompare(b.k); });
                gs.forEach(function (g) { g.label = '<span class="cp-lbl">' + esc(g.k) + '</span>'; var mix = {}; g.items.forEach(function (c) { var p = pkgOf(c); mix[p] = (mix[p] || 0) + 1; }); g.mix = mix; });
                sel = f.zip; head1 = 'รหัส'; extraHead = '<th>ที่ทำการ</th><th>ทีม</th><th>Package</th>';
                extraCell = function (g) { return '<td style="white-space:nowrap">' + esc(g.items[0].office) + '</td><td style="white-space:nowrap">' + esc(teamOf(g.items[0])) + '</td><td><div class="cp-mix">' + Object.keys(g.mix).sort(pkgSort).map(function (p) { return pkgBadge(p, g.mix[p]); }).join('') + '</div></td>'; };
            } else {
                gs = groupBy(all.filter(function (c) { return match(c, 'pkg'); }), pkgOf, y, m).sort(function (a, b) { return pkgSort(a.k, b.k); });
                gs.forEach(function (g) { g.label = pkgBadge(g.k) + (g.k !== NOPKG && /\(/.test(g.k) ? '<span class="cp-pkg-note">' + esc(g.k.replace(/^[^(]*/, '')) + '</span>' : ''); }); sel = f.pkg; head1 = 'Package';
            }
            var key = V, tot = gs.reduce(function (a, g) { a.n += g.n; a.a += g.a; return a; }, { n: 0, a: 0, p: 0, r: 0 });
            var ssT = shipSum([].concat.apply([], gs.map(function (g) { return g.items; })), y, m); tot.p = ssT[0]; tot.r = ssT[1];
            var totM = st.metric === 'pcs' ? tot.p : tot.r;
            var cell = function (v) { return v ? fmt(v) : '<span class="cp-zero">0</span>'; };
            var tabs = [['pkg', 'Package', Object.keys(pc).length], ['team', 'ทีม', Object.keys(tc).length], ['zip', 'ที่ทำการ', Object.keys(zc).length]];
            html += '<section class="cp-card"><div class="cp-card-h"><h3><i class="fas fa-layer-group"></i>สรุปแยกตาม</h3>' +
                '<div class="cp-seg" role="tablist" aria-label="สรุปแยกตาม">' + tabs.map(function (t) {
                    return '<button type="button" role="tab" data-view="' + t[0] + '" aria-selected="' + (V === t[0]) + '" tabindex="' + (V === t[0] ? 0 : -1) + '" onclick="thpCpView(\'' + t[0] + '\')" onkeydown="thpCpTabKey(event)">' + t[1] + '<b>' + fmt(t[2]) + '</b></button>'; }).join('') + '</div>' +
                '<div class="cp-right"><small>' + (V === 'zip' ? 'เรียงรหัสไปรษณีย์น้อยไปมาก · ' : '') + 'คลิกแถวเพื่อกรอง</small>' + seg + '</div></div>' +
                '<div class="cp-scroll" role="tabpanel"><table class="cp-t"><thead><tr><th>' + head1 + '</th>' + extraHead + '<th class="n">ลูกค้า</th><th>ฝากส่งในช่วงนี้</th><th class="n">ชิ้นงาน</th><th class="n">รายได้ (บาท)</th><th>สัดส่วน' + (st.metric === 'pcs' ? 'ชิ้นงาน' : 'รายได้') + '</th></tr></thead><tbody>' +
                gs.map(function (g) {
                    var on = sel === g.k, arg = esc(JSON.stringify(g.k));
                    return '<tr class="cp-click' + (on ? ' is-on' : '') + '" tabindex="0" role="button" aria-pressed="' + on + '" onclick="thpCpSet(\'' + key + '\', ' + arg + ')" onkeydown="thpCpKey(event, \'' + key + '\', ' + arg + ')">' +
                        '<td>' + g.label + '</td>' + (extraCell ? extraCell(g) : '') + '<td class="n">' + fmt(g.n) + '</td>' +
                        '<td><div class="cp-act"><span class="cp-frac"><b>' + fmt(g.a) + '</b><span>/' + fmt(g.n) + '</span></span>' + meter(pctOf(g.a, g.n), true) + '</div></td>' +
                        '<td class="n">' + cell(g.p) + '</td><td class="n">' + cell(g.r) + '</td><td>' + meter(pctOf(st.metric === 'pcs' ? g.p : g.r, totM)) + '</td></tr>';
                }).join('') + '</tbody><tfoot><tr><td>รวม</td>' + (extraHead ? '<td colspan="3"></td>' : '') + '<td class="n">' + fmt(tot.n) + '</td><td><span class="cp-frac"><b>' + fmt(tot.a) + '</b><span>/' + fmt(tot.n) + '</span></span></td><td class="n">' + fmt(tot.p) + '</td><td class="n">' + fmt(tot.r) + '</td><td></td></tr></tfoot></table></div></section>';

            // ----- รายชื่อลูกค้า -----
            var rows = list.map(function (c) { return { c: c, s: shipOf(c, y, m) }; });
            rows.sort(st.sort === 'rev' ? function (a, b) { return b.s[1] - a.s[1] || a.c.zip.localeCompare(b.c.zip); }
                : st.sort === 'pcs' ? function (a, b) { return b.s[0] - a.s[0] || a.c.zip.localeCompare(b.c.zip); }
                : function (a, b) { return a.c.zip.localeCompare(b.c.zip) || pkgSort(pkgOf(a.c), pkgOf(b.c)) || a.c.name.localeCompare(b.c.name, 'th'); });
            var shown = rows.slice(0, st.limit);
            html += '<section class="cp-card" id="cpCustomers"><div class="cp-card-h"><h3><i class="fas fa-address-book"></i>รายชื่อลูกค้า</h3><small>' + fmt(rows.length) + ' ราย · ฝากส่ง ' + esc(period) + ' ' + fmt(sum.a) + ' ราย</small>' +
                '<div class="cp-right cp-cust-tools"><label for="cpSortSel" class="cp-sub" style="display:inline">เรียงตาม</label><select id="cpSortSel" onchange="thpCpSort(this.value)">' +
                [['zip', 'รหัสที่ทำการ'], ['rev', 'รายได้มาก → น้อย'], ['pcs', 'ชิ้นงานมาก → น้อย']].map(function (o) { return '<option value="' + o[0] + '"' + (st.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div>' +
                '<div class="cp-scroll"><table class="cp-t"><thead><tr><th class="n">#</th><th>ลูกค้า</th><th>ที่ทำการ</th><th>ทีม</th><th>Package</th><th>สัญญา</th><th class="n">ชิ้นงาน</th><th class="n">รายได้ (บาท)</th><th>' + (y ? (st.metric === 'pcs' ? 'ชิ้นงาน' : 'รายได้') + 'รายเดือน ' + (Number(y) + 543) : '') + '</th></tr></thead><tbody>' +
                shown.map(function (x, i) {
                    var c = x.c, a = c.thp && D.ship[c.thp] && D.ship[c.thp][y], mx = 0, spark = '', idle = !(x.s[0] > 0 || x.s[1] > 0), off = st.metric === 'pcs' ? 0 : 1;
                    if (a) { for (var j = 0; j < 12; j++) mx = Math.max(mx, a[j * 2 + off]); for (var k = 0; k < 12; k++) { var v = a[k * 2 + off]; spark += '<span class="' + (v ? (m === k ? 'is-on' : '') : 'z') + '" style="height:' + (v ? Math.max(8, Math.round(v * 100 / (mx || 1))) : 8) + '%" title="' + MO[k] + ': ' + fmt(a[k * 2]) + ' ชิ้น · ' + fmt(a[k * 2 + 1]) + ' บาท"></span>'; } }
                    return '<tr' + (idle ? ' class="is-idle"' : '') + '><td class="n cp-sub">' + (i + 1) + '</td><td class="cp-name"><b>' + esc(c.name) + '</b><small>' + (c.thp ? 'THP-' + esc(c.thp) : 'ไม่มีหมายเลข THP') + '</small>' + (idle && c.thp ? '<span class="cp-idle-tag">ไม่ได้ฝากส่งในช่วงนี้</span>' : '') + '</td>' +
                        '<td style="white-space:nowrap">' + esc(c.zip) + '<span class="cp-sub">' + esc(c.office) + '</span></td><td style="white-space:nowrap">' + esc(teamOf(c)) + '</td><td>' + pkgBadge(pkgOf(c)) + '</td>' +
                        '<td style="white-space:nowrap">' + esc(c.start || '-') + '<span class="cp-sub">ถึง ' + esc(c.end || '-') + '</span></td>' +
                        '<td class="n">' + (x.s[0] ? fmt(x.s[0]) : '<span class="cp-zero">0</span>') + '</td><td class="n">' + (x.s[1] ? fmt(x.s[1]) : '<span class="cp-zero">0</span>') + '</td>' +
                        '<td>' + (a ? '<div class="cp-spark" aria-label="' + (st.metric === 'pcs' ? 'ชิ้นงาน' : 'รายได้') + 'รายเดือน">' + spark + '</div>' : '<span class="cp-sub">ไม่มีข้อมูล</span>') + '</td></tr>';
                }).join('') + '</tbody></table></div>' +
                (rows.length > shown.length ? '<button type="button" class="cp-more" onclick="thpCpMore()">แสดงเพิ่ม (เหลืออีก ' + fmt(rows.length - shown.length) + ' ราย)</button>' : '') + '</section>';
            body.innerHTML = html;
        };
    })();
</script>
