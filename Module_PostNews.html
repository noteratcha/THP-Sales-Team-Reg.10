<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left: Editor Panel -->
    <div class="lg:col-span-1 space-y-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div>
                <label
                    class="form-label text-[10px] font-bold text-gray-400 mb-2 block uppercase">เลือกรายการเข้าพบล่าสุด</label>

            <div class="border-t border-gray-100 pt-4">

                <select id="newsTemplateSelector" onchange="changePostNewsTemplate(this.value)"

                    <option value="">กำลังโหลด...</option>

            <div class="mb-4">

                <input type="date" id="newsDateInput" oninput="updateDateDisplay(this); updateNewsPreview()"

                    data-date="วว/ดด/ปปปป">
            </div>
            <div class="mb-4 p-3 bg-gray-50 border border-gray-200 rounded-lg">
                <div class="flex justify-between items-center mb-3 border-b border-gray-200 pb-1">
                    <p class="text-xs font-bold text-gray-600"><i class="fas fa-image"></i> ปรับแต่งรูปภาพ</p>
                    <button type="button" onclick="resetImageSettings()"
                        class="text-[10px] bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded transition"><i
                            class="fas fa-undo mr-1"></i>คืนค่าเริ่มต้น</button>
                </div>
                <div class="mb-3">
                    <label class="text-[10px] font-bold text-gray-500 uppercase flex justify-between mb-1">
                        <span>ความสูงกรอบรูป</span>
                        <span id="newsImageHeightValue" class="text-theme-orange">280px</span>
                    </label>
                    <input type="range" id="newsImageHeightInput" min="100" max="800" step="10" value="280"
                        oninput="updateNewsPreview()" class="w-full accent-theme-orange cursor-pointer">
                </div>
            </div>
            <div class="mb-4">
                <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">หัวข้อข่าวประชาสัมพันธ์</label>
                <textarea id="newsTitleInput" oninput="updateNewsPreview()" placeholder="ระบุหัวข้อข่าว..."
                    class="w-full text-xs p-2 border border-gray-300 rounded-lg outline-none focus:border-theme-orange font-sans"
                    rows="3"></textarea>
            </div>
            <div class="mb-4">
                <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">รายละเอียดข่าวสาร</label>
                <textarea id="newsDetailInput" oninput="updateNewsPreview()"
                    class="w-full text-xs p-2 border border-gray-300 rounded-lg outline-none focus:border-theme-orange font-sans"
                    rows="12" placeholder="ระบุรายละเอียด..."></textarea>
            </div>
            <div class="mb-2">
                <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">ลงชื่อ / ผู้จัดทำ</label>
                <input type="text" id="newsTeamInput" oninput="updateNewsPreview()"
                    class="w-full text-xs p-2 border border-gray-300 rounded-lg outline-none focus:border-theme-orange font-sans">
            </div>
        </div>
    </div>

    <!-- Right: Canvas Preview -->
    <div
        class="lg:col-span-2 flex justify-center overflow-hidden bg-gray-100 p-2 md:p-6 rounded-xl relative shadow-inner">
        <div class="scale-wrapper">
            <div id="newsCaptureArea" class="bg-white relative shadow-2xl overflow-hidden font-sans"
                style="width: 800px; height: 1131px; background-color: #ffffff;">
                <img id="newsTemplateBg" src="" class="absolute inset-0 w-full h-full object-cover z-0"
                    crossorigin="anonymous" alt="News Background">
                <div id="newsPreviewDate"
                    class="absolute top-[115px] right-[70px] z-10 text-[18px] font-normal text-black text-right w-[300px]">
                </div>
                <div class="relative z-10 w-full h-full flex flex-col pt-[200px] px-[70px] pb-[30px]">
                    <div id="newsPreviewTitle"
                        class="text-center text-[28px] font-normal text-black mb-6 leading-tight whitespace-pre-wrap">
                        หัวข้อข่าวประชาสัมพันธ์</div>

                    <div id="newsImageWrapper" class="mx-auto rounded-2xl mb-6 bg-white overflow-hidden"
                        style="width: 560px; max-width: 660px; transition: width 0.3s;">
                        <div id="newsImageContainer" onclick="document.getElementById('postNewsImageUpload').click()"
                            class="bg-white rounded-2xl border-4 border-white flex items-center justify-center relative overflow-hidden cursor-pointer hover:opacity-90 transition-opacity"
                            style="height: 280px; width: 100%;" title="คลิกเพื่ออัปโหลด/เปลี่ยนรูปภาพ">
                            <img id="newsPreviewImage" src="" class="h-full w-auto block hidden object-cover">
                            <div id="newsPreviewNoImage"
                                class="flex flex-col items-center justify-center text-gray-300 w-full py-16">
                                <i class="fas fa-image text-6xl mb-2"></i>
                                <span class="text-xl">ไม่มีรูปภาพประกอบ</span>
                                <span class="text-sm mt-2 text-theme-orange font-bold">(คลิกเพื่อเพิ่มรูปภาพ)</span>
                            </div>
                            <input type="file" id="postNewsImageUpload" accept="image/*" class="hidden"
                                onchange="handlePostNewsImageUpload(this)">
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col bg-transparent p-2 md:p-8">
                        <p id="newsPreviewDetail"
                            class="text-[16px] text-black leading-[1.8] text-left indent-12 whitespace-pre-wrap flex-1 tracking-normal">
                            รายละเอียดการเข้าพบจะแสดงที่นี่...</p>
                    </div>

                    <div class="mt-8 flex justify-between items-end gap-4">
                        <div class="text-left flex-1">
                            <p id="newsPreviewSubject" class="text-[16px] font-normal text-black tracking-normal pl-2">
                            </p>
                        </div>
                        <div class="text-right shrink-0">
                            <p id="newsPreviewTeam" class="text-[16px] font-normal text-black pr-2 whitespace-nowrap">
                                ส่วนทีมขายและดูแลลูกค้า ปข.10</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 🔊 นำเข้าเสียงแจ้งเตือนจากระบบส่วนกลาง (Core Module)
    var successSound = window.successSound;
    var errorSound = window.errorSound;

    // ==========================================
    // 5. POST NEWS LOGIC
    // ==========================================
    function initPostNews() {
        showGlobalLoader('กำลังดึงภาพพื้นหลังจากระบบ...');

        // 1. ดึงเทมเพลตทั้งหมดเพื่อสร้างตัวเลือกใน Dropdown
        google.script.run.withSuccessHandler(function (res) {
            var selector = document.getElementById('newsTemplateSelector');
            var defaultUrl = '';

            if (res.status === 'success' && res.data && res.data.length > 0) {
                if (selector) {
                    selector.innerHTML = '';
                    res.data.forEach(function (t, idx) {
                        var isUse = t.status === 'Use';
                        if (isUse && !defaultUrl) defaultUrl = t.url;
                        var opt = document.createElement('option');
                        opt.value = t.url;

                        var label = t.name || ('แบบที่ ' + (idx + 1));

                        opt.text = label + (isUse ? ' (ค่าเริ่มต้น)' : '');
                        if (isUse) opt.selected = true;
                        selector.appendChild(opt);
                    });

                    // หากไม่มีการระบุ Use เลย ให้ใช้อันแรกเป็น Default
                    if (!defaultUrl && res.data[0]) defaultUrl = res.data[0].url;
                }
            } else {
                if (selector) selector.innerHTML = '<option value="">ไม่มีข้อมูลแม่แบบ</option>';
            }

            if (!defaultUrl) {
                defaultUrl = window.DEFAULT_POST_NEWS_TEMPLATE;
            }

            // 2. โหลดภาพ Base64 จาก URL เริ่มต้นที่หาได้
            preloadTemplateToBase64(defaultUrl, function (success) {
                if (!success) {
                    console.error("Post News Background: ไม่สามารถโหลดรูปได้ กรุณาตรวจสอบการตั้งค่าการแชร์ใน Google Drive");
                }
                continueInitPostNews();
            });
        }).withFailureHandler(function (err) {
            console.error("Error loading templates: ", err);
            continueInitPostNews();
        }).getPostNewsTemplates();
    }

    // ฟังก์ชันสานต่อการทำงานหลังจากโหลดรูปพื้นหลังเสร็จ
    function continueInitPostNews() {
        if (allFetchedRows.length === 0) {
            google.script.run.withSuccessHandler(function (r) {
                hideGlobalLoader();
                if (r.status === 'success') {
                    var data = r.data;
                    allFetchedRows = [];
                    for (var i = data.length - 1; i >= 1; i--) {
                        var row = data[i].slice();
                        row.push(i + 1);
                        allFetchedRows.push(row);
                    }
                    populatePostNewsSelector();
                    renderNewsPreviewFromSelect();
                }
            }).getDataForTable();
        } else {
            hideGlobalLoader();
            populatePostNewsSelector();
            renderNewsPreviewFromSelect();
        }
    }

    // เมื่อผู้ใช้เปลี่ยน Template จาก Dropdown
    window.changePostNewsTemplate = function (url) {
        if (!url) return;
        showGlobalLoader('กำลังเปลี่ยนภาพพื้นหลัง...');
        preloadTemplateToBase64(url, function (success) {
            hideGlobalLoader();
            if (!success) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดรูปภาพแม่แบบได้ กรุณาลองเลือกรูปแบบอื่น', 'error');
            }
        });
    };

    /**
     * 🔹 เทคนิคระดับโปร: Pre-load รูปภาพผ่าน Proxy และแปลงเป็น Base64
     * เพื่อให้ภาพแสดงผลได้ 100% และ html2canvas ไม่ติดปัญหา CORS ตอนดาวน์โหลด
     */
    function preloadUrlToBase64(url, targetImgElement, callback) {
        if (!targetImgElement) { if (callback) callback(false); return; }

        // ดึง File ID จากลิงก์ Google Drive เฉพาะเจาะจงเพื่อหลีกเลี่ยงการจับ URL ภายนอกทั่วไปผิดพลาด
        var fileId = "";
        var match1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        var match2 = url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match1 && match1[1]) fileId = match1[1];
        else if (match2 && match2[1]) fileId = match2[1];

        if (!fileId) {
            targetImgElement.removeAttribute('crossorigin');
            targetImgElement.src = url;
            if (callback) callback(true);
            return;
        }

        // ลำดับช่องทางการดึงรูป (Thumbnail API เสถียรสุดสำหรับ CORS)
        var driveUrl = "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w1600";

        // รายชื่อ Proxy ที่ผ่านการทดสอบว่าทำงานได้ดี
        var proxyUrls = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?url=",
            "https://images.weserv.nl/?url="
        ];

        function tryFetchProxy(index) {
            if (index >= proxyUrls.length) {
                // ถ้าล้มเหลวทุก Proxy ให้ลองใช้ระบบ Thumbnail ตรงๆ โดยถอด crossorigin ออกเพื่อการันตีการแสดงผลภาพบนเบราว์เซอร์
                targetImgElement.removeAttribute('crossorigin');
                targetImgElement.src = driveUrl;
                if (callback) callback(false);
                return;
            }

            var finalUrl = proxyUrls[index] + encodeURIComponent(driveUrl);

            fetch(finalUrl)
                .then(function (res) {
                    if (!res.ok) throw new Error("Proxy response error");
                    return res.blob();
                })
                .then(function (blob) {
                    var reader = new FileReader();
                    reader.onloadend = function () {
                        var base64data = reader.result;
                        targetImgElement.removeAttribute('crossorigin');
                        targetImgElement.src = base64data;
                        targetImgElement.setAttribute('data-base64-loaded', 'true');
                        if (callback) callback(true);
                    };
                    reader.readAsDataURL(blob);
                })
                .catch(function (e) {
                    tryFetchProxy(index + 1);
                });
        }

        tryFetchProxy(0);
    }

    function preloadTemplateToBase64(url, callback) {
        var bgImg = document.getElementById('newsTemplateBg');
        preloadUrlToBase64(url, bgImg, callback);
    }

    function populatePostNewsSelector() {
        var selector = document.getElementById('newsDataSelector');
        if (!selector) return;
        selector.innerHTML = '<option value="">-- กรุณาเลือกรายการเข้าพบ (เริ่มใหม่) --</option>';
        var recentRows = allFetchedRows.slice(0, 20);
        recentRows.forEach(function (row, index) {
            var date = row[0] ? row[0].split(' ')[0] : '-';
            var customer = row[7] || 'ไม่ระบุชื่อ';
            var subject = row[1] || 'ไม่ระบุหัวข้อ';
            var option = document.createElement('option');
            option.value = index;
            option.textContent = "[" + date + "] " + subject + " - " + customer;
            selector.appendChild(option);
        });
    }

    function jumpToPostNews(sheetRowIndex, rowData) {
        switchPage('postnews');
        setTimeout(function () { applyDataToPostNews(rowData); }, 100);
    }

    function renderNewsPreviewFromSelect() {
        var selector = document.getElementById('newsDataSelector');
        var index = selector ? selector.value : '';
        var editPanel = document.getElementById('newsEditPanel');
        if (editPanel) editPanel.style.display = 'block';

        var signature = 'ส่วนทีมขายและดูแลลูกค้า ปข.10';
        if (currentUserInfo && currentUserInfo.user !== 'admin') {
            var teamName = currentUserInfo.team || 'ทีมขาย';
            var zipCode = currentUserInfo.zipcode || '';
            signature = teamName + (zipCode ? " (" + zipCode + ")" : "");
        }

        if (index === "") {
            var trySetInput = function (id, val) { var el = document.getElementById(id); if (el) el.value = val; }
            var trySetText = function (id, text) { var el = document.getElementById(id); if (el) el.innerText = text; }

            trySetInput('newsDateInput', ''); trySetInput('newsTitleInput', ''); trySetInput('newsDetailInput', ''); trySetInput('newsTeamInput', signature);
            trySetText('newsPreviewTitle', 'หัวข้อข่าวประชาสัมพันธ์'); trySetText('newsPreviewDetail', 'รายละเอียดการเข้าพบจะแสดงที่นี่...');
            trySetText('newsPreviewTeam', signature); trySetText('newsPreviewDate', ''); trySetText('newsPreviewSubject', '');
            var previewImg = document.getElementById('newsPreviewImage');
            if (previewImg) { previewImg.src = ''; previewImg.classList.add('hidden'); }
            var noImg = document.getElementById('newsPreviewNoImage');
            if (noImg) noImg.classList.remove('hidden');

            var fileInput = document.getElementById('postNewsImageUpload');
            if (fileInput) fileInput.value = '';

            resetImageSettings();
            return;
        }
        applyDataToPostNews(allFetchedRows[index]);
    }

    function resetPostNews() {
        var selector = document.getElementById('newsDataSelector');
        if (selector) selector.value = "";

        // 💡 เพิ่มการรีเซ็ตกลับเป็น Template ค่าเริ่มต้นด้วย
        var tmplSelector = document.getElementById('newsTemplateSelector');
        if (tmplSelector) {
            for (var i = 0; i < tmplSelector.options.length; i++) {
                if (tmplSelector.options[i].text.includes('ค่าเริ่มต้น')) {
                    tmplSelector.selectedIndex = i;
                    window.changePostNewsTemplate(tmplSelector.value);
                    break;
                }
            }
        }

        renderNewsPreviewFromSelect();
    }

    function handlePostNewsImageUpload(input) {
        var file = input.files[0];
        if (file) {
            var reader = new FileReader();
            reader.onload = function (e) {
                var previewImg = document.getElementById('newsPreviewImage');
                var noImgDiv = document.getElementById('newsPreviewNoImage');

                if (previewImg && noImgDiv) {
                    previewImg.onload = function () { adjustNewsImageWidth(); };
                    previewImg.src = e.target.result;
                    previewImg.classList.remove('hidden');
                    noImgDiv.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function applyDataToPostNews(rowData) {
        var dateStr = rowData[0] ? rowData[0].split(' ')[0] : '';
        var subject = rowData[1] || '-';
        var teamInRow = rowData[6] || '-';
        var office = rowData[4] || '-';
        var customer = rowData[7] || '-';
        var customerGroup = rowData[2] || '-';
        var phone = rowData[8] ? String(rowData[8]).replace(/^'/, "") : '-';
        var productType = rowData[9] || '-';
        var salesChannel = rowData[10] || '-';
        var shippingVolume = rowData[11] || '-';
        var currentCarrier = rowData[12] || '-';
        var imgUrl = rowData[18] || '';

        var maskedPhone = phone;
        if (maskedPhone !== '-' && maskedPhone.length >= 4) {
            maskedPhone = maskedPhone.substring(0, maskedPhone.length - 4) + 'xxxx';
        }

        var thaiDateFull = dateStr;
        var isoDate = '';
        if (dateStr) {
            var dateParts = dateStr.split('/');
            if (dateParts.length === 3) {
                var d = parseInt(dateParts[0]);
                var m = parseInt(dateParts[1]) - 1;
                var y = parseInt(dateParts[2]);
                var thaiMonthsLocal = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
                thaiDateFull = d + " " + thaiMonthsLocal[m] + " " + (y + 543);
                isoDate = y + "-" + String(m + 1).padStart(2, '0') + "-" + String(d).padStart(2, '0');
            }
        }

        var titleText = subject + " " + customer;
        var detailText = "เมื่อวันที่ " + thaiDateFull + " นำทีมโดย " + teamInRow + " (" + office + ") ได้เข้าพบผู้ประกอบการ " + customer + " (เบอร์โทร: " + maskedPhone + ") ซึ่งเป็นกลุ่มลูกค้า " + customerGroup + " โดยจำหน่ายสินค้าประเภท" + productType + " ผ่านช่องทาง" + salesChannel + " มีปริมาณการจัดส่งประมาณ " + shippingVolume + " ชิ้น/เดือน (ปัจจุบันใช้บริการขนส่งของ " + currentCarrier + ")\n\nการเข้าพบครั้งนี้มีหัวข้อในการพูดคุยคือ \"" + subject + "\" โดยมีรายละเอียดดังนี้...";

        var signature = 'ส่วนทีมขายและดูแลลูกค้า ปข.10';
        if (currentUserInfo && currentUserInfo.user !== 'admin') {
            var teamName = currentUserInfo.team || 'ทีมขาย';
            var zipCode = currentUserInfo.zipcode || '';
            signature = teamName + (zipCode ? " (" + zipCode + ")" : "");
        }

        var trySetInput = function (id, val) { var el = document.getElementById(id); if (el) el.value = val; }
        trySetInput('newsTitleInput', titleText); trySetInput('newsDetailInput', detailText); trySetInput('newsDateInput', isoDate); trySetInput('newsTeamInput', signature);

        var previewSubj = document.getElementById('newsPreviewSubject');
        if (previewSubj) previewSubj.innerText = subject !== '-' ? "ประเภท : " + subject : "";

        var previewImg = document.getElementById('newsPreviewImage');
        var noImgDiv = document.getElementById('newsPreviewNoImage');

        var fileInput = document.getElementById('postNewsImageUpload');
        if (fileInput) fileInput.value = '';

        if (imgUrl && imgUrl.startsWith('http') && previewImg && noImgDiv) {
            if (typeof showGlobalLoader === 'function') showGlobalLoader('กำลังโหลดรูปภาพประกอบข่าว...');
            preloadUrlToBase64(imgUrl, previewImg, function (success) {
                if (typeof hideGlobalLoader === 'function') hideGlobalLoader();
                previewImg.onload = function () { adjustNewsImageWidth(); };
                adjustNewsImageWidth();
                previewImg.classList.remove('hidden');
                noImgDiv.classList.add('hidden');
            });
        } else if (previewImg && noImgDiv) {
            previewImg.src = '';
            previewImg.classList.add('hidden');
            noImgDiv.classList.remove('hidden');
            adjustNewsImageWidth();
        }
        updateNewsPreview();
    }

    function updateNewsPreview() {
        var trySetText = function (id, text) { var el = document.getElementById(id); if (el) el.innerText = text; }
        trySetText('newsPreviewTitle', document.getElementById('newsTitleInput').value || 'หัวข้อข่าวประชาสัมพันธ์');
        trySetText('newsPreviewDetail', document.getElementById('newsDetailInput').value || 'รายละเอียดการเข้าพบจะแสดงที่นี่...');
        trySetText('newsPreviewTeam', document.getElementById('newsTeamInput').value || '-');

        var rawDate = document.getElementById('newsDateInput').value;
        if (rawDate) {
            var parts = rawDate.split('-');
            var thaiMonthsLocal = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            trySetText('newsPreviewDate', parseInt(parts[2]) + " " + thaiMonthsLocal[parseInt(parts[1]) - 1] + " " + (parseInt(parts[0]) + 543));
        } else {
            trySetText('newsPreviewDate', '');
        }

        var heightInput = document.getElementById('newsImageHeightInput');
        if (heightInput) {
            var imgContainer = document.getElementById('newsImageContainer');

    function downloadNewsImage() {
        var captureArea = document.getElementById('newsCaptureArea');
        if (!captureArea) return;
        Swal.fire({ title: 'กำลังสร้างรูปภาพ...', text: 'กรุณารอสักครู่', allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });

        document.fonts.ready.then(function () {
            var clone = captureArea.cloneNode(true);
            clone.style.transform = 'none';
            clone.style.position = 'absolute';
            clone.style.left = '-9999px';
            clone.style.top = '0';
            clone.style.width = '800px';
            clone.style.height = '1131px';

            var originalImg = captureArea.querySelector('#newsPreviewImage');
            var clonedImg = clone.querySelector('#newsPreviewImage');
            if (originalImg && clonedImg) {
                clonedImg.src = originalImg.src;
                if (originalImg.classList.contains('hidden')) {
                    clonedImg.classList.add('hidden');
                } else {
                    clonedImg.classList.remove('hidden');
                }
            }

            var originalBg = captureArea.querySelector('#newsTemplateBg');
            var clonedBg = clone.querySelector('#newsTemplateBg');
            if (originalBg && clonedBg) {
                clonedBg.src = originalBg.src;
            }

            document.body.appendChild(clone);

            var runCapture = function () {
                setTimeout(function () {
                    html2canvas(clone, { useCORS: true, allowTaint: false, scale: 4, backgroundColor: '#ffffff', logging: false }).then(function (canvas) {
                        document.body.removeChild(clone);
                        Swal.close();
                        var image = canvas.toDataURL("image/png", 1.0);
                        var link = document.createElement('a');
                        var titleInput = document.getElementById('newsTitleInput');
                        var dateInput = document.getElementById('newsDateInput');
                        var title = (titleInput ? titleInput.value.substring(0, 20) : '') || 'PostNews';
                        var date = (dateInput ? dateInput.value.replace(/-/g, '') : '') || 'date';
                        link.download = "PostNews_" + date + "_" + title + ".png";
                        link.href = image;
                        link.click();
                        successSound.play().catch(function (e) { });
                        Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'รูปภาพข่าวถูกดาวน์โหลดแล้ว', timer: 2000, showConfirmButton: false });
                    }).catch(function (err) {
                        document.body.removeChild(clone);
                        Swal.close();
                        errorSound.play().catch(function (e) { });
                        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถสร้างรูปภาพได้ กรุณาลองใหม่อีกครั้ง', 'error');
                    });
                }, 300);
            };

            // 💡 เทคนิคชั้นเซียน: รอให้รูปภาพทั้งหมดใน Clone ทำการโหลดเสร็จ 100% ก่อนทำการแคปเจอร์
            var images = Array.from(clone.getElementsByTagName('img'));
            var activeImages = images.filter(function (img) {
                return img.src && !img.complete;
            });

            if (activeImages.length === 0) {
                runCapture();
            } else {
                var loadedCount = 0;
                var totalImages = activeImages.length;
                var triggerCapture = function () {
                    loadedCount++;
                    if (loadedCount >= totalImages) {
                        runCapture();
                    }
                };
                activeImages.forEach(function (img) {
                    img.onload = triggerCapture;
                    img.onerror = triggerCapture; // fallback
                });
            }
        });
    }

    function renderMergeWorkspace() {
        var container = document.getElementById('mergeGridContainer');
        if (!container) return;

        var layoutObj = MERGE_LAYOUTS.find(function (l) { return l.id === activeMergeLayout; });

        // Dynamically adjust workspace container size and aspect ratio to ensure square slots

            workspace.classList.remove('w-full', 'aspect-square');
            workspace.style.aspectRatio = layoutObj.aspect;

            var aspectParts = layoutObj.aspect.split('/');
            var wRatio = parseFloat(aspectParts[0]);
            var hRatio = parseFloat(aspectParts[1]);

            // Set dynamic canvas bounding box to strictly fit within the available workspace viewport height and width
            var isMobile = window.innerWidth < 768;
            var maxCanvasW = isMobile ? window.innerWidth - 32 : 540;
            var maxCanvasH = isMobile ? window.innerHeight - 200 : 430; // Adjust max height for mobile to fit screen

            var calculatedW = maxCanvasW;
            var calculatedH = calculatedW * (hRatio / wRatio);

            if (calculatedH > maxCanvasH) {
                calculatedH = maxCanvasH;
                calculatedW = calculatedH * (wRatio / hRatio);
            }

            workspace.style.width = Math.round(calculatedW) + 'px';
            workspace.style.height = Math.round(calculatedH) + 'px';
            workspace.style.maxWidth = 'none';
            workspace.style.maxHeight = 'none';

    function updateMergeTransform(index) {
        var data = mergeSlotData[index];
        if (!data) return;
        var slotEl = document.getElementById('mergeGridContainer').children[index];
        if (slotEl) {
            var imgLayer = slotEl.querySelector('.merge-image-layer');

                var zoom = data.zoom || 1.0;

                var panY = data.panY || 0;

    // ฟังก์ชันปรับความคมชัด/ลดขนาดภาพความละเอียดสูงสุดขีด (4000px - 4K UHD) เพื่อคงรายละเอียดพิกเซลและสีสันสูงสุด
    function compressImageAndLoad(base64Str, callback) {
        var img = new Image();
        img.onload = function () {
            var maxW = 4000;
            var maxH = 4000;
            var w = img.width;
            var h = img.height;
            if (w > maxW || h > maxH) {
                if (w > h) {
                    h = Math.round((h * maxW) / w);
                    w = maxW;
                } else {
                    w = Math.round((w * maxH) / h);
                    h = maxH;
                }
            }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var compressedBase64 = canvas.toDataURL('image/jpeg', 0.98);
            callback(compressedBase64);
        };
        img.onerror = function () {
            callback(base64Str);
        };
        img.src = base64Str;
    }

    function handleMergeFileUpload(input) {
        console.log("handleMergeFileUpload input:", input);
        if (!input || !input.files) {
            console.error("Invalid file input object:", input);
            return;
        }
        var file = input.files[0];
        console.log("Selected file:", file, "targetUploadSlotIndex:", targetUploadSlotIndex);
        if (!file || targetUploadSlotIndex === -1) return;

        showGlobalLoader('กำลังประมวลผลรูปภาพสำหรับเครื่องมือรวมรูปภาพ...');
        var reader = new FileReader();
        reader.onload = function (e) {
            hideGlobalLoader();
            mergeSlotData[targetUploadSlotIndex] = {
                src: e.target.result, // เก็บรูปภาพต้นฉบับแบบความละเอียด 100% เต็ม ไม่ผ่านการบีบอัด
                zoom: 1.0,
                panX: 0,
                panY: 0,
                rotate: 0,
                fitMode: 'contain'
            };
            selectedMergeSlotIndex = targetUploadSlotIndex;
            renderMergeWorkspace();
        };
        reader.readAsDataURL(file);
    }

    function selectMergeSlot(index) {
        selectedMergeSlotIndex = index;
        renderMergeWorkspace();
    }

    function updateMergeZoomFromInline(zoomLevel, index) {
        if (mergeSlotData[index]) {
            mergeSlotData[index].zoom = zoomLevel;
            updateMergeTransform(index);
        }
    }

    function removeMergeSlotImageSpecific(index) {
        if (mergeSlotData[index]) {
            mergeSlotData[index] = null;
            selectedMergeSlotIndex = -1;
            renderMergeWorkspace();
        }
    }

    function startMergePan(e, index) {
        if (e.type === 'mousedown' && e.button !== 0) return;

        selectedMergeSlotIndex = index;
        renderMergeWorkspace();

        var slotEl = document.getElementById('mergeGridContainer').children[index];
        if (slotEl) {
            var panLayer = slotEl.querySelector('.pan-catcher');
            if (panLayer) {
                panLayer.classList.remove('cursor-grab');
                panLayer.classList.add('cursor-grabbing');
            }
        }

        isMergeDragging = false;
        dragStartX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        dragStartY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        startPanX = mergeSlotData[index].panX;
        startPanY = mergeSlotData[index].panY;

        document.addEventListener('mousemove', onMergePanMove);
        document.addEventListener('touchmove', onMergePanMove, { passive: false });
        document.addEventListener('mouseup', stopMergePan);
        document.addEventListener('touchend', stopMergePan);
    }

    function onMergePanMove(e) {
        isMergeDragging = true;
        if (e.cancelable) e.preventDefault();

        var clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        var clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

        var dx = clientX - dragStartX;
        var dy = clientY - dragStartY;

        var zoom = mergeSlotData[selectedMergeSlotIndex].zoom;
        var sensitivity = 0.8;

        var newPanX = startPanX + (dx / zoom) * sensitivity;
        var newPanY = startPanY + (dy / zoom) * sensitivity;

        mergeSlotData[selectedMergeSlotIndex].panX = newPanX;
        mergeSlotData[selectedMergeSlotIndex].panY = newPanY;

        updateMergeTransform(selectedMergeSlotIndex);
    }

    function stopMergePan() {
        document.removeEventListener('mousemove', onMergePanMove);
        document.removeEventListener('touchmove', onMergePanMove);
        document.removeEventListener('mouseup', stopMergePan);
        document.removeEventListener('touchend', stopMergePan);

        if (selectedMergeSlotIndex !== -1) {
            var slotEl = document.getElementById('mergeGridContainer').children[selectedMergeSlotIndex];
            if (slotEl) {
                var panLayer = slotEl.querySelector('.pan-catcher');
                if (panLayer) {
                    panLayer.classList.add('cursor-grab');
                    panLayer.classList.remove('cursor-grabbing');
                }
            }
        }

        setTimeout(function () { isMergeDragging = false; }, 50);
    }

    function downloadMergedImage() {
        var container = document.getElementById('mergeWorkspaceContainer');
        var gridContainer = document.getElementById('mergeGridContainer');
        if (!container || !gridContainer) return;

        var hasImage = mergeSlotData.some(function (d) { return d !== null; });
        if (!hasImage) {
            Swal.fire('แจ้งเตือน', 'กรุณาเพิ่มรูปภาพอย่างน้อย 1 รูป', 'warning');
            return;
        }

        Swal.fire({
            title: 'กำลังบันทึกรูปภาพ...',
            text: 'ระบบกำลังประมวลผลรูปภาพความละเอียดสูงเทียบเท่ารูปภาพต้นฉบับ กรุณารอสักครู่...',
            allowOutsideClick: false,
            didOpen: function () { Swal.showLoading(); }
        });

        // 1. Load all images in parallel to ensure we use original high-resolution pixels
        var promises = mergeSlotData.map(function (data, idx) {
            if (!data) return Promise.resolve(null);
            return new Promise(function (resolve) {
                var img = new Image();
                img.onload = function () {
                    resolve({ img: img, data: data, index: idx });
                };
                img.onerror = function () {
                    resolve(null);
                };
                img.src = data.src;
            });
        });

        Promise.all(promises).then(function (results) {
            try {
                // 2. Determine target high-resolution canvas size (3600px width base)
                var canvasWidth = 3600;
                var layoutObj = MERGE_LAYOUTS.find(function (l) { return l.id === activeMergeLayout; });
                var aspectParts = layoutObj.aspect.split('/');
                var wRatio = parseFloat(aspectParts[0]);
                var hRatio = parseFloat(aspectParts[1]);

                var canvas = document.createElement('canvas');
                canvas.width = canvasWidth;
                canvas.height = Math.round(canvasWidth * (hRatio / wRatio));

                var ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Calculate scaling factor from DOM pixels to high-res canvas pixels
                var domW = gridContainer.offsetWidth;
                var scale = canvas.width / domW;

                var slots = gridContainer.querySelectorAll('.group');

                // 3. Render each slot on the high-res canvas
                results.forEach(function (res, index) {
                    var slot = slots[index];
                    if (!slot) return;

                    var sX = slot.offsetLeft * scale;
                    var sY = slot.offsetTop * scale;
                    var sW = slot.offsetWidth * scale;
                    var sH = slot.offsetHeight * scale;

                    if (res) {
                        var img = res.img;
                        var data = res.data;

                        // Calculate unzoomed fit bounds (baseW, baseH) inside the slot
                        var imgRatio = img.naturalWidth / img.naturalHeight;
                        var slotRatio = sW / sH;
                        var fitMode = data.fitMode || 'contain';
                        var baseW, baseH;

                        if (fitMode === 'contain') {
                            if (imgRatio > slotRatio) {
                                baseW = sW;
                                baseH = sW / imgRatio;
                            } else {
                                baseH = sH;
                                baseW = sH * imgRatio;
                            }
                        } else { // 'cover'
                            if (imgRatio > slotRatio) {
                                baseH = sH;
                                baseW = sH * imgRatio;
                            } else {
                                baseW = sW;
                                baseH = sW / imgRatio;
                            }
                        }

                        // Center of the slot is the transform origin
                        var centerX = sX + sW / 2;
                        var centerY = sY + sH / 2;

                        ctx.save();

                        // Clip drawing to slot boundaries
                        ctx.beginPath();
                        ctx.rect(sX, sY, sW, sH);
                        ctx.clip();

                        // Apply CSS scale and translate transformations
                        ctx.translate(centerX, centerY);
                        ctx.scale(data.zoom, data.zoom);
                        ctx.translate(data.panX * scale, data.panY * scale);
                        ctx.rotate((data.rotate || 0) * Math.PI / 180);

                        // Draw image centered at the origin
                        ctx.drawImage(img, -baseW / 2, -baseH / 2, baseW, baseH);

                        ctx.restore();
                    } else {
                        // Draw empty slot background
                        ctx.fillStyle = '#f3f4f6';
                        ctx.fillRect(sX, sY, sW, sH);
                    }
                });

                // 4. Download final high-resolution merged image
                var image = canvas.toDataURL("image/jpeg", 0.98); // Visually lossless JPEG
                var link = document.createElement('a');

                var date = new Date();
                var yyyy = date.getFullYear();
                var mm = String(date.getMonth() + 1).padStart(2, '0');
                var dd = String(date.getDate()).padStart(2, '0');
                var time = String(date.getHours()).padStart(2, '0') + String(date.getMinutes()).padStart(2, '0');

                link.download = "Merged_Visit_" + yyyy + mm + dd + "_" + time + ".jpg";
                link.href = image;
                link.click();

                Swal.close();
                successSound.play().catch(function (e) { });
                Swal.fire({
                    icon: 'success',
                    title: 'ดาวน์โหลดสำเร็จ',
                    text: 'ภาพได้รับการบันทึกด้วยความละเอียดสูงระดับเทียบเท่าภาพต้นฉบับของคุณแล้วครับ',
                    timer: 3000,
                    showConfirmButton: true,
                    confirmButtonText: 'รับทราบ',
                    confirmButtonColor: '#e27d3d'
                });

            } catch (err) {
                console.error("High-Res Canvas rendering error:", err);
                Swal.close();
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถสร้างรูปภาพความละเอียดสูงได้ กรุณาลองใหม่อีกครั้ง', 'error');
            }
        }).catch(function (err) {
            console.error("Promise load images error:", err);
            Swal.close();
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดรูปภาพต้นฉบับได้ กรุณาลองใหม่อีกครั้ง', 'error');
        });
    }

    // Attach to window globally to guarantee accessibility across all Apps Script modules
    window.openMergeModal = openMergeModal;
    window.closeMergeModal = closeMergeModal;
    window.resetMergeTool = resetMergeTool;
    window.handleMergeFileUpload = handleMergeFileUpload;
    window.openMergeUpload = openMergeUpload;
    window.renderMergeWorkspace = renderMergeWorkspace;
    window.setMergeLayout = setMergeLayout;
    window.downloadMergedImage = downloadMergedImage;
</script>
