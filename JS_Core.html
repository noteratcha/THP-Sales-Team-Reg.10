    function translateAndExplainError(msg) {
        if (!msg) return 'ไม่ทราบสาเหตุแน่ชัด';
        
        const m = String(msg).toLowerCase();
        if (m.includes('is not defined')) {
            const nameMatch = msg.match(/(\w+)\s+is\s+not\s+defined/i);
            const varName = nameMatch ? `"${nameMatch[1]}"` : 'ตัวแปร/ฟังก์ชัน';
            return `เกิดจากระบบเรียกใช้ ${varName} ที่ยังไม่ได้ประกาศสร้างไว้ หรือพิมพ์ชื่อตัวแปรสะกดผิดพลาด`;
        }
        if (m.includes('is not a function')) {
            const nameMatch = msg.match(/(\w+)\s+is\s+not\s+a\s+function/i);
            const funcName = nameMatch ? `"${nameMatch[1]}"` : 'ชื่อ';
            return `เกิดจากการเรียกใช้ ${funcName} ในฐานะฟังก์ชัน แต่ระบบตรวจพบว่าสิ่งนั้นไม่ได้เป็นฟังก์ชันจริง ๆ (อาจจะพิมพ์ชื่อสะกดผิด)`;
        }
        if (m.includes('cannot read property') || m.includes('cannot read properties') || m.includes('is null') || m.includes('is undefined')) {
            return `เกิดจากการพยายามอ่านข้อมูลย่อยของตัวแปรที่มีค่าเป็นค่าว่างเปล่า (null หรือ undefined) เช่น พยายามดึงข้อมูลลูกค้าแต่ข้อมูลนั้นยังไม่ได้ถูกโหลดลงมา`;
        }
        if (m.includes('networkerror') || m.includes('failed to fetch') || m.includes('load resource')) {
            return `เกิดจากปัญหาการเชื่อมต่อเครือข่าย หรือเซิร์ฟเวอร์ Google Apps Script ขัดข้องชั่วคราว`;
        }
        if (m.includes('script error')) {
            return `เกิดจากความผิดพลาดของสคริปต์ภายนอก (Cross-origin script error) หรือการตั้งค่าความปลอดภัยของเว็บเบราว์เซอร์`;
        }
        return 'เป็นความผิดพลาดทั่วไปในส่วนควบคุมระบบปฏิบัติการของโค้ด';
    }

    // ==========================================
    // GOOGLE DRIVE URL CDN TRANSFORMER
    // ==========================================
    window.transformGoogleDriveUrl = function(url) {
        if (!url || typeof url !== 'string' || url.trim() === '') return '';
        var cleanUrl = url.trim();
        if (cleanUrl.indexOf('data:image') === 0 || cleanUrl.indexOf('lh3.googleusercontent.com') !== -1) {
            return cleanUrl;
        }
        var fileId = null;
        var fileDMatch = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (fileDMatch && fileDMatch[1]) {
            fileId = fileDMatch[1];
        } else {
            var idMatch = cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (idMatch && idMatch[1]) {
                fileId = idMatch[1];
            }
        }
        if (fileId) {
            return 'https://lh3.googleusercontent.com/d/' + fileId + '=s600';
        }
        return cleanUrl;
    };

    // ==========================================
    // SAFE STORAGE UTILS (CORS & IFRAME IF BLOCK-COOKIES)

    var SafeStorage = {
        _memoryStore: {},
        setItem: function(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                this._memoryStore[key] = value;
                console.warn("localStorage is blocked. Using memory fallback.");
            }
        },
        getItem: function(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                return this._memoryStore[key] || null;
            }
        },
        removeItem: function(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {
                delete this._memoryStore[key];
            }
        }

        if (!url) return "";

        const match1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);

    function toggleDropdown(id) {

    function toggleSubMenu(groupId, iconId) {
        const allGroups = ['menu-group-visits', 'menu-group-revenue', 'menu-group-tools', 'menu-group-biglot'];
        const allIcons = ['icon-visits', 'icon-revenue', 'icon-tools', 'icon-biglot'];

        const targetGroup = document.getElementById(groupId);
        const targetIcon = document.getElementById(iconId);
        
        if (targetGroup && targetIcon) {
            const isHidden = targetGroup.classList.contains('hidden');

            if (allGroups.includes(groupId)) {
                allGroups.forEach((id, index) => {
                    const grp = document.getElementById(id);
                    const icn = document.getElementById(allIcons[index]);
                    if (grp && icn) {
                        grp.classList.add('hidden');
                        grp.classList.remove('flex');
                        icn.style.transform = 'rotate(0deg)';
                        icn.classList.remove('text-theme-orange');
                        
                        const trg = document.getElementById(allIcons[index].replace('icon-', 'nav-trigger-'));
                        if (trg) {
                            trg.classList.remove('text-theme-orange', 'font-bold');
                            trg.classList.add('text-gray-400');
                        }
                    }
                });

                const tmsGroup = document.getElementById('menu-group-tms');
                const tmsIcon = document.getElementById('icon-tms');
                if (tmsGroup && tmsIcon) {
                    tmsGroup.classList.add('hidden');
                    tmsGroup.classList.remove('flex');
                    tmsIcon.style.transform = 'rotate(0deg)';
                    tmsIcon.classList.remove('text-theme-orange');
                    
                    const tmsTrg = document.getElementById('nav-trigger-tms');
                    if (tmsTrg) {
                        tmsTrg.classList.remove('text-theme-orange', 'font-bold');
                        tmsTrg.classList.add('text-gray-400');
                    }
                }
            } else if (!isHidden) {
                targetGroup.classList.add('hidden');
                targetGroup.classList.remove('flex');
                targetIcon.style.transform = 'rotate(0deg)';
                targetIcon.classList.remove('text-theme-orange');
                
                const triggerEl = document.getElementById(iconId.replace('icon-', 'nav-trigger-'));
                if (triggerEl) {
                    triggerEl.classList.remove('text-theme-orange', 'font-bold');
                    triggerEl.classList.add('text-gray-400');
                }
            }

            if (isHidden) {
                targetGroup.classList.remove('hidden');

                targetIcon.style.transform = 'rotate(180deg)';
                targetIcon.classList.add('text-theme-orange');

        document.querySelectorAll('.app-version-text').forEach(el => el.innerText = typeof APP_VERSION !== 'undefined' ? APP_VERSION : '');
        
        // ยิง API ไปบวกตัวเลขและโหลดจำนวนผู้เข้าชม (Visitor Counter)

                console.error("Failed to increment visitor count:", err);

    // 🎵 BACKGROUND MUSIC PLAYER (YouTube Iframe API)
    // ==========================================
    var ytPlayer;
    var isMusicPlaying = false;
    var isMusicMuted = false;
    var currentMusicVolume = 15;

    // รายชื่อเพลงเริ่มต้น (จะถูกเขียนทับด้วยข้อมูลจากเซิร์ฟเวอร์)
    var BG_MUSIC_TRACKS = [];
    var currentMusicTrack = null;

    // ฟังก์ชันเริ่มโหลด Player และอัปเดต UI หลังจากได้ข้อมูลเพลง
    function initMusicPlayerAndUI() {
        if (!BG_MUSIC_TRACKS || BG_MUSIC_TRACKS.length === 0) {
            // ปิดการใช้งานฟังก์ชันเพลงหากไม่มีข้อมูลในชีต
            var select = document.getElementById('musicTrackSelect');
            if (select) {
                select.innerHTML = '<option value="">(ไม่มีเพลงในระบบ)</option>';
                select.disabled = true;
            }
            return;
        }
        
        currentMusicTrack = BG_MUSIC_TRACKS[Math.floor(Math.random() * BG_MUSIC_TRACKS.length)];

        // อัปเดต Dropdown
        var select = document.getElementById('musicTrackSelect');
        if (select) {
            select.innerHTML = '';
            BG_MUSIC_TRACKS.forEach(function(track) {
                var opt = document.createElement('option');
                opt.value = track.id;
                opt.text = track.title;
                select.appendChild(opt);
            });
            select.value = currentMusicTrack.id;
        }

        // โหลดสคริปต์ YouTube Player API และสร้าง container
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        if (firstScriptTag) {
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        } else {
            document.head.appendChild(tag);
        }

        var div = document.createElement('div');
        div.id = 'ytPlayerContainer';
        div.style.position = 'fixed';
        div.style.bottom = '0';
        div.style.right = '0';
        div.style.width = '200px';
        div.style.height = '200px';
        div.style.pointerEvents = 'none';
        div.style.zIndex = '-100';
        div.style.opacity = '1';
        div.innerHTML = '<div id="ytPlayer"></div>';
        document.body.appendChild(div);
    }

    // โหลดข้อมูลเพลงจากเซิร์ฟเวอร์
    google.script.run.withSuccessHandler(function(res) {
        if (res && res.status === 'success' && res.data && res.data.length > 0) {
            BG_MUSIC_TRACKS = res.data;
        }
        initMusicPlayerAndUI();
    }).withFailureHandler(function(err) {
        console.error('Failed to load music playlist', err);
        initMusicPlayerAndUI(); // fallback to default
    }).getMusicPlaylist();

    // ฟังก์ชัน callback ส่วนกลางเมื่อ API พร้อมใช้งาน
    window.onYouTubeIframeAPIReady = function() {
        ytPlayer = new YT.Player('ytPlayer', {
            height: '200',
            width: '200',
            videoId: currentMusicTrack.id,
            playerVars: {
                'autoplay': 0, // ปิด autoplay เพื่อให้ YouTube นับยอดวิว // เปิดเล่นอัตโนมัติ
                'controls': 0,
                'disablekb': 1,
                'fs': 0,
                'modestbranding': 1,
                'rel': 0,
                'showinfo': 0,
                'start': 0, // เริ่มที่ 0 วินาทีเสมอตามคำขอผู้ใช้
                'loop': 0, // ปิด loop ที่นี่ เพื่อใช้การสุ่มเพลงใหม่แทน
                'playlist': currentMusicTrack.id
            },
            events: {
                'onReady': onYtPlayerReady,
                'onStateChange': onYtPlayerStateChange,
                'onError': onYtPlayerError
            }
        });
    };

    // ฟังก์ชันแจ้งเตือนข้อผิดพลาดและข้ามไปยังเพลงถัดไปอัตโนมัติ (เช่น เพลงถูกลบ/ติดลิขสิทธิ์)
    function onYtPlayerError(event) {
        console.warn("YouTube player error (code " + event.data + "). Skipping to next random track...");
        playRandomNextTrack();
    }

    function onYtPlayerReady(event) {
        event.target.setVolume(currentMusicVolume);
        
        // บังคับเริ่มเล่นที่ 0 วินาทีเสมอ (ป้องกันประวัติการรับชมเดิมจำจุดเริ่ม)
        if (typeof event.target.seekTo === 'function') {
            event.target.seekTo(0, true);
        }
        
        // เพื่อให้ยอดวิวถูกนับตามกฎ YouTube จำเป็นต้องให้การเล่นเกิดจากผู้ใช้คลิก
        document.addEventListener('click', function autoPlayOnFirstClick() {
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                if (typeof ytPlayer.seekTo === 'function') {
                    ytPlayer.seekTo(0, true);
                }
                ytPlayer.playVideo();
            }
            document.removeEventListener('click', autoPlayOnFirstClick);
        }, { once: true });
    }

    function onYtPlayerStateChange(event) {
        var disc = document.getElementById('btnBgMusicPlayMini');
        var menuBtnIcon = document.getElementById('menuBtnPlayPauseIcon');

        if (event.data === 1) { // PLAYING
            isMusicPlaying = true;
            if (disc) {
                disc.classList.add('playing');
                disc.classList.remove('bg-gray-50', 'border-gray-200', 'text-theme-orange');
                disc.classList.add('bg-theme-orange', 'border-theme-orange', 'text-white', 'shadow-md');
            }
            if (menuBtnIcon) {
                menuBtnIcon.className = 'fas fa-pause text-xs';
            }
            SafeStorage.setItem('thp_bg_music_state', 'playing');
        } else if (event.data === 0) { // ENDED
            // เมื่อเพลงบรรเลงปัจจุบันจบลง สุ่มเล่นเพลงใหม่ทันที!
            playRandomNextTrack();
        } else if (event.data === 2 || event.data === -1 || event.data === 5) { // PAUSED or UNSTARTED
            isMusicPlaying = false;
            if (disc) {
                disc.classList.remove('playing');
                disc.classList.remove('bg-theme-orange', 'border-theme-orange', 'text-white', 'shadow-md');
                disc.classList.add('bg-gray-50', 'border-gray-200', 'text-theme-orange');
            }
            if (menuBtnIcon) {
                menuBtnIcon.className = 'fas fa-play text-xs ml-0.5';
            }
            SafeStorage.setItem('thp_bg_music_state', 'paused');
        }
    }

    // ฟังก์ชันสำหรับสุ่มเพลงบรรเลงในลำดับถัดไป
    window.playRandomNextTrack = function() {
        if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;
        
        // กรองเพลงปัจจุบันออกไปก่อนเพื่อไม่ให้สุ่มได้เพลงเดิมซ้ำติดต่อกัน
        var availableTracks = BG_MUSIC_TRACKS.filter(function(t) { 
            return t.id !== currentMusicTrack.id; 
        });
        if (availableTracks.length === 0) availableTracks = BG_MUSIC_TRACKS;
        
        currentMusicTrack = availableTracks[Math.floor(Math.random() * availableTracks.length)];
        
        ytPlayer.loadVideoById({
            videoId: currentMusicTrack.id,
            startSeconds: 0 // บังคับเริ่มเล่นที่ 0 วินาทีสำหรับทุกเพลง
        });
        if (typeof ytPlayer.seekTo === 'function') {
            ytPlayer.seekTo(0, true);
        }
        ytPlayer.playVideo();
        
        // ซิงค์การแสดงผลของ Dropdown เพลงบรรเลง
        var select = document.getElementById('musicTrackSelect');
        if (select) {
            select.value = currentMusicTrack.id;
        }
    };

    window.playNextTrack = function() {
        if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;
        var currentIndex = BG_MUSIC_TRACKS.findIndex(function(t) { return t.id === currentMusicTrack.id; });
        var nextIndex = (currentIndex + 1) % BG_MUSIC_TRACKS.length;
        playSelectedTrack(BG_MUSIC_TRACKS[nextIndex].id);
    };

    window.playPreviousTrack = function() {
        if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;
        var currentIndex = BG_MUSIC_TRACKS.findIndex(function(t) { return t.id === currentMusicTrack.id; });
        var prevIndex = (currentIndex - 1 + BG_MUSIC_TRACKS.length) % BG_MUSIC_TRACKS.length;
        playSelectedTrack(BG_MUSIC_TRACKS[prevIndex].id);
    };

    // ฟังก์ชันสำหรับการเลือกเล่นเพลงจาก Dropdown รายการตั้งค่า
    window.playSelectedTrack = function(id) {
        if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;
        
        var track = BG_MUSIC_TRACKS.find(function(t) { return t.id === id; });
        if (!track) return;
        
        currentMusicTrack = track;
        
        ytPlayer.loadVideoById({
            videoId: currentMusicTrack.id,
            startSeconds: 0
        });
        if (typeof ytPlayer.seekTo === 'function') {
            ytPlayer.seekTo(0, true);
        }
        ytPlayer.playVideo();
        
        // ยืนยันการอัปเดตสถานะ Dropdown
        var select = document.getElementById('musicTrackSelect');
        if (select) {
            select.value = id;
        }
    };

    // ฟังก์ชันเปิด/ปิดเครื่องเล่นผ่านปุ่มตัวโน้ตหลัก
    window.toggleBgMusic = function(forcePlay) {
        if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
        
        if (forcePlay === true || !isMusicPlaying) {
            ytPlayer.playVideo();
        } else {
            ytPlayer.pauseVideo();
        }
    };

    window.toggleBgMusicMute = function() {
        if (!ytPlayer || typeof ytPlayer.mute !== 'function') return;
        var muteIcon = document.getElementById('btnBgMusicMuteIcon');
        
        if (isMusicMuted) {
            ytPlayer.unMute();
            isMusicMuted = false;
            if (muteIcon) {
                muteIcon.className = 'fas fa-volume-up';
                muteIcon.classList.remove('text-red-500');
            }
        } else {
            ytPlayer.mute();
            isMusicMuted = true;
            if (muteIcon) {
                muteIcon.className = 'fas fa-volume-mute text-red-500';
            }
        }
        updateMusicVolIcon(currentMusicVolume);
    };

    // ฟังก์ชันปรับความดังของเสียง (ซิงค์ทั้ง YouTube, Slider, เปอร์เซ็นต์ และ ไอคอน)
    window.changeBgMusicVolume = function(val) {
        currentMusicVolume = parseInt(val);
        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
            ytPlayer.setVolume(currentMusicVolume);
        }
        
        // ซิงค์ค่าไปยัง UI Slider และป้ายเปอร์เซ็นต์
        var percent = document.getElementById('musicVolPercent');
        var slider = document.getElementById('musicVolSlider');
        if (percent) percent.innerText = currentMusicVolume + '%';
        if (slider) slider.value = currentMusicVolume;
        
        updateMusicVolIcon(currentMusicVolume);
    };

    // แสดง/ซ่อน Context Menu ควบคุมเสียงและเพลงด้วยคลิกขวา
    window.handleMusicContextMenu = function(e) {
        if (e) e.preventDefault();
        var menu = document.getElementById('musicContextMenu');
        if (!menu) return;
        
        var isHidden = menu.classList.contains('hidden');
        if (isHidden) {
            // อัปเดตข้อมูลใน Slider และ Dropdown ก่อนแสดงหน้าจอ
            var slider = document.getElementById('musicVolSlider');
            var percent = document.getElementById('musicVolPercent');
            var select = document.getElementById('musicTrackSelect');
            
            if (slider) slider.value = currentMusicVolume;
            if (percent) percent.innerText = currentMusicVolume + '%';
            if (select) select.value = currentMusicTrack.id;
            updateMusicVolIcon(currentMusicVolume);
            
            var menuBtnIcon = document.getElementById('menuBtnPlayPauseIcon');
            if (menuBtnIcon) {
                if (isMusicPlaying) {
                    menuBtnIcon.className = 'fas fa-pause text-xs';
                } else {
                    menuBtnIcon.className = 'fas fa-play text-xs ml-0.5';
                }
            }
            
            menu.classList.remove('hidden');
            
            // รอสักครู่แล้วเปิด event ตรวจจับการคลิกด้านนอกเพื่อปิดเมนู
            setTimeout(function() {
                document.addEventListener('click', closeMusicContextMenu);
            }, 50);
        } else {
            menu.classList.add('hidden');
        }
    };

    // ปิดเมนูควบคุมเมื่อผู้ใช้คลิกข้างนอกตัวควบคุม
    function closeMusicContextMenu(e) {
        var menu = document.getElementById('musicContextMenu');
        if (!menu) return;
        
        var btn = document.getElementById('btnBgMusicPlayMini');
        if (menu.contains(e.target) || (btn && btn.contains(e.target))) {
            return; // หากคลิกโดนเมนูการตั้งค่า หรือโดนปุ่มโน้ตเพลงหลัก ไม่ต้องปิด
        }
        
        menu.classList.add('hidden');
        document.removeEventListener('click', closeMusicContextMenu);
    }

    // ฟังก์ชันช่วยเปลี่ยนสถานะไอคอนเสียงตามระดับเปอร์เซ็นต์เสียงจริง
    function updateMusicVolIcon(vol) {
        var icon = document.getElementById('musicVolIcon');
        if (!icon) return;
        if (vol === 0 || isMusicMuted) {
            icon.className = 'fas fa-volume-mute text-red-500 w-4 text-center';
        } else if (vol < 30) {
            icon.className = 'fas fa-volume-down text-gray-400 w-4 text-center';
        } else if (vol < 70) {
            icon.className = 'fas fa-volume-up text-gray-500 w-4 text-center';
        } else {
            icon.className = 'fas fa-volume-up text-theme-orange w-4 text-center';
        }
    }

    // แสดง/ซ่อน เมนูออกจากระบบเมื่อคลิกขวาที่รูปโปรไฟล์ ด้วยเอฟเฟกต์แอนิเมชันแบบสปริงที่นุ่มนวล
    window.handleProfileContextMenu = function(e) {
        if (e) e.preventDefault();
        var menu = document.getElementById('profileContextMenu');
        if (!menu) return;
        
        var isOpen = menu.classList.contains('opacity-100');
        if (!isOpen) {
            // ลบสถานะปิด (Closed) และเพิ่มสถานะเปิด (Opened)
            menu.classList.remove('opacity-0', 'pointer-events-none', 'invisible', 'scale-95', '-translate-y-2');
            menu.classList.add('opacity-100', 'pointer-events-auto', 'visible', 'scale-100', 'translate-y-0');
            
            // รอสักครู่แล้วเปิด event ตรวจจับการคลิกด้านนอกเพื่อปิดเมนู
            setTimeout(function() {
                document.addEventListener('click', closeProfileContextMenu);
            }, 50);
        } else {
            closeContextMenuAnimated(menu);
        }
    };

    // ฟังก์ชันช่วยปิดเมนูพร้อมแอนิเมชันหดเล็กลงและฟีดหายไป
    function closeContextMenuAnimated(menu) {
        if (!menu) return;
        menu.classList.add('opacity-0', 'pointer-events-none', 'invisible', 'scale-95', '-translate-y-2');
        menu.classList.remove('opacity-100', 'pointer-events-auto', 'visible', 'scale-100', 'translate-y-0');
        document.removeEventListener('click', closeProfileContextMenu);
    }

    // ปิดเมนูออกจากระบบเมื่อผู้ใช้คลิกข้างนอกตัวควบคุม
    function closeProfileContextMenu(e) {
        var menu = document.getElementById('profileContextMenu');
        if (!menu) return;
        
        // หากคลิกโดนเมนูการตั้งค่า หรือโดนรูปภาพโปรไฟล์หลัก ไม่ต้องปิด
        var profileDiv = menu.parentElement;
        if (menu.contains(e.target) || (profileDiv && profileDiv.contains(e.target))) {
            return;
        }
        
        closeContextMenuAnimated(menu);
    }

    window.openImagePreview = function(url) {
        let modal = document.getElementById('imagePreviewModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'imagePreviewModal';
            modal.className = 'fixed inset-0 z-[10000] hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300';
            modal.innerHTML = `
                <div class="relative w-full max-w-3xl h-full max-h-[90vh] flex flex-col items-center justify-center">
                    <button onclick="closeImagePreview()" class="absolute -top-10 right-0 text-white hover:text-theme-orange transition-colors text-4xl">&times;</button>
                    <img id="imagePreviewImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl">
                </div>
            `;
            // Click outside to close
            modal.addEventListener('click', function(e) {
                if(e.target === modal) closeImagePreview();
            });
            document.body.appendChild(modal);
        }
        document.getElementById('imagePreviewImg').src = url;
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    };

    window.closeImagePreview = function() {
        const modal = document.getElementById('imagePreviewModal');
        if (modal) {
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    };
